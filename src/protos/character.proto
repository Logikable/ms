syntax = "proto3";

package ms;

import "src/protos/equip.proto";
import "src/protos/item.proto";

// The character's current job, named for the first advancement (Swordman,
// Archer, ...). One Job spans every advancement stage of its line; which tier
// the character is actually at comes from job_stage. See JobAdvancement for the
// finer-grained tiers that skills belong to.
enum Job {
  JOB_UNSPECIFIED = 0;
  JOB_BEGINNER = 1;
  JOB_SWORDMAN = 2;
  JOB_ARCHER = 3;
  JOB_MAGICIAN = 4;
  JOB_ROGUE = 5;
  // The warrior's 2nd advancement. These are Jobs of their own rather than
  // stages of JOB_SWORDMAN because they are a branch: a Swordman becomes one
  // of the three and the other two are closed off, which a job_stage on a
  // single Job cannot say.
  JOB_FIGHTER = 6;
  JOB_PAGE = 7;
  JOB_SPEARMAN = 8;
  // The archer's 2nd advancement. A branch for the same reason: one line
  // masters the bow and the other the crossbow, and the weapon a character
  // already holds does not decide it for them.
  JOB_HUNTER = 9;
  JOB_CROSSBOWMAN = 10;
  // The magician's 2nd advancements. The two elemental ones are named for the
  // pair each casts; the game shows them as "I/L Wizard" and "F/P Wizard"
  // everywhere the full name will not fit. The Cleric's name fits anywhere.
  JOB_ICE_LIGHTNING_WIZARD = 11;
  JOB_FIRE_POISON_WIZARD = 12;
  JOB_CLERIC = 13;
  // The rogue's 2nd advancements. One throws stars off a claw, the other
  // stabs with a dagger, and the weapon a character already holds does not
  // decide it for them -- a Rogue is handed both.
  JOB_ASSASSIN = 14;
  JOB_BANDIT = 15;
  // The warrior's 3rd advancements. The 3rd job narrows rather than forks, so
  // each 2nd job has exactly one, and each names a line that ends in a 4th job
  // this game does not reach: Fighter -> Crusader -> Hero, Spearman ->
  // Berserker -> Dark Knight, Page -> White Knight -> Paladin.
  JOB_BERSERKER = 16;
  JOB_CRUSADER = 17;
  JOB_WHITE_KNIGHT = 18;
  JOB_RANGER = 19;
  JOB_SNIPER = 20;
  // The magician's 3rd advancements. Shown as "I/L Mage" and "F/P Mage"
  // wherever the full name will not fit, the same abbreviations the wizards
  // below them take.
  JOB_ICE_LIGHTNING_MAGE = 21;
  JOB_FIRE_POISON_MAGE = 22;
  JOB_PRIEST = 23;
  // The rogue's 3rd advancements.
  JOB_HERMIT = 24;
  JOB_CHIEF_BANDIT = 25;
  // The 4th advancements. The 4th job narrows no further -- every 3rd job has
  // exactly one -- so these are four of ten, and the rest follow them.
  JOB_DARK_KNIGHT = 26;
  JOB_PALADIN = 27;
  JOB_HERO = 28;
  JOB_BOW_MASTER = 29;
  JOB_MARKSMAN = 30;
  // The magician's 4th advancements. Shown as "I/L Arch Mage" wherever the
  // full name will not fit, the same way its wizard and mage do. The Bishop's
  // name fits anywhere, as the Cleric's and the Priest's below it do.
  JOB_ICE_LIGHTNING_ARCH_MAGE = 31;
  JOB_FIRE_POISON_ARCH_MAGE = 32;
  JOB_BISHOP = 33;
  // The rogue's 4th advancements.
  JOB_NIGHT_LORD = 34;
  JOB_SHADOWER = 35;
}

// A single advancement tier -- finer than Job. One Job spans a sequence of
// these as the character advances (Swordman, then Fighter, ...), one per job
// stage. Each skill belongs to exactly one; the skills tab shows a page per
// advancement the character has reached.
enum JobAdvancement {
  JOB_ADVANCEMENT_UNSPECIFIED = 0;
  JOB_ADVANCEMENT_SWORDMAN = 1;
  JOB_ADVANCEMENT_ARCHER = 2;
  JOB_ADVANCEMENT_MAGICIAN = 3;
  JOB_ADVANCEMENT_ROGUE = 4;
  JOB_ADVANCEMENT_FIGHTER = 5;
  JOB_ADVANCEMENT_PAGE = 6;
  JOB_ADVANCEMENT_SPEARMAN = 7;
  JOB_ADVANCEMENT_HUNTER = 8;
  JOB_ADVANCEMENT_CROSSBOWMAN = 9;
  JOB_ADVANCEMENT_ICE_LIGHTNING_WIZARD = 10;
  JOB_ADVANCEMENT_FIRE_POISON_WIZARD = 11;
  JOB_ADVANCEMENT_CLERIC = 12;
  JOB_ADVANCEMENT_ASSASSIN = 13;
  JOB_ADVANCEMENT_BANDIT = 14;
  // The 3rd advancements, at level 60.
  JOB_ADVANCEMENT_BERSERKER = 15;
  JOB_ADVANCEMENT_CRUSADER = 16;
  JOB_ADVANCEMENT_WHITE_KNIGHT = 17;
  JOB_ADVANCEMENT_RANGER = 18;
  JOB_ADVANCEMENT_SNIPER = 19;
  JOB_ADVANCEMENT_ICE_LIGHTNING_MAGE = 20;
  JOB_ADVANCEMENT_FIRE_POISON_MAGE = 21;
  JOB_ADVANCEMENT_PRIEST = 22;
  JOB_ADVANCEMENT_HERMIT = 23;
  JOB_ADVANCEMENT_CHIEF_BANDIT = 24;
  // The 4th advancements, at level 100.
  JOB_ADVANCEMENT_DARK_KNIGHT = 25;
  JOB_ADVANCEMENT_PALADIN = 26;
  JOB_ADVANCEMENT_HERO = 27;
  JOB_ADVANCEMENT_BOW_MASTER = 28;
  JOB_ADVANCEMENT_MARKSMAN = 29;
  JOB_ADVANCEMENT_ICE_LIGHTNING_ARCH_MAGE = 30;
  JOB_ADVANCEMENT_FIRE_POISON_ARCH_MAGE = 31;
  JOB_ADVANCEMENT_BISHOP = 32;
  JOB_ADVANCEMENT_NIGHT_LORD = 33;
  JOB_ADVANCEMENT_SHADOWER = 34;
  // The 5th advancements, at level 200. Nothing reaches one yet: no character
  // takes a 5th job stage, so its book is unbuyable and its page never draws.
  // The advancement exists so a 5th job skill has somewhere to be written --
  // see data/skills/warrior/dark_knight/fifth.
  JOB_ADVANCEMENT_DARK_KNIGHT_V = 35;
}

// Identifies a stat that a player can spend AP into via AllocateStat.
enum StatField {
  STAT_FIELD_UNSPECIFIED = 0;
  STAT_FIELD_STR = 1;
  STAT_FIELD_DEX = 2;
  STAT_FIELD_INT = 3;
  STAT_FIELD_LUK = 4;
  STAT_FIELD_HP = 5;
  STAT_FIELD_MP = 6;
}

// One Hyper Stat a player can put points into, in the order the Hyper tab
// lists them. Job-independent: every character is offered the same fourteen.
enum HyperStatField {
  // 6 was Max MP, which GMS offers and this game does not: no fight here is
  // decided by a mage running dry.
  reserved 6;

  HYPER_STAT_FIELD_UNSPECIFIED = 0;
  HYPER_STAT_FIELD_STR = 1;
  HYPER_STAT_FIELD_DEX = 2;
  HYPER_STAT_FIELD_INT = 3;
  HYPER_STAT_FIELD_LUK = 4;
  HYPER_STAT_FIELD_MAX_HP = 5;
  HYPER_STAT_FIELD_CRIT_RATE = 7;
  HYPER_STAT_FIELD_CRIT_DAMAGE = 8;
  HYPER_STAT_FIELD_IED = 9;
  HYPER_STAT_FIELD_DAMAGE = 10;
  HYPER_STAT_FIELD_BOSS_DAMAGE = 11;
  HYPER_STAT_FIELD_NORMAL_DAMAGE = 12;
  HYPER_STAT_FIELD_ATTACK = 13;
  HYPER_STAT_FIELD_EXP = 14;
  // Only worth anything to a character wearing an Arcane Symbol, so the game
  // holds it shut until level 200 -- see HyperStatUnlocked.
  HYPER_STAT_FIELD_ARCANE_FORCE = 15;
}

// One allocation of Hyper Stat points: the level each stat is raised to,
// keyed by HyperStatField (stored as int32, proto3 map limitation). An absent
// or zero entry is a stat with nothing spent on it. What the allocation cost
// is not stored -- it is the cost table summed over these levels, so the pool
// and the spending cannot drift apart.
message HyperStatPreset {
  map<int32, int32> levels = 1;
}

// The two allocations a character keeps. Named fields rather than a repeated
// one because there are exactly two, and the game picks between them by what
// the player is doing: farming a map or fighting a boss.
message HyperStats {
  HyperStatPreset farming = 1;
  HyperStatPreset bossing = 2;
}

// How good one Inner Ability line is, and how good the ability as a whole is.
// A line never outranks the ability holding it, and a reset can carry the
// ability up a rank but never down.
enum AbilityRank {
  ABILITY_RANK_UNSPECIFIED = 0;
  ABILITY_RANK_RARE = 1;
  ABILITY_RANK_EPIC = 2;
  ABILITY_RANK_UNIQUE = 3;
  ABILITY_RANK_LEGENDARY = 4;
}

// What one Inner Ability line can grant. A cut of GMS's 45, keeping only what
// a lever in this game reads: no MP, no DEF, no jump or speed, and none of
// GMS's cross-stat conversions. The weights the survivors roll at keep their
// relative sizes, so thinning the list only makes the wanted lines likelier.
//
// Attack and Magic Attack are two types rather than one, as GMS has them, so
// every character carries one line in the pool that is dead to them. Hyper
// Stats take the opposite bargain -- one Attack row pays both.
enum AbilityLineType {
  ABILITY_LINE_TYPE_UNSPECIFIED = 0;
  ABILITY_LINE_TYPE_STR = 1;
  ABILITY_LINE_TYPE_DEX = 2;
  ABILITY_LINE_TYPE_INT = 3;
  ABILITY_LINE_TYPE_LUK = 4;
  ABILITY_LINE_TYPE_ALL_STATS = 5;
  ABILITY_LINE_TYPE_MAX_HP = 6;
  ABILITY_LINE_TYPE_MAX_HP_PCT = 7;
  ABILITY_LINE_TYPE_ATTACK = 8;
  ABILITY_LINE_TYPE_MAGIC_ATTACK = 9;
  ABILITY_LINE_TYPE_CRIT_RATE = 10;
  ABILITY_LINE_TYPE_BOSS_DAMAGE = 11;
  ABILITY_LINE_TYPE_NORMAL_DAMAGE = 12;
  ABILITY_LINE_TYPE_BUFF_DURATION = 13;
  ABILITY_LINE_TYPE_ITEM_DROP = 14;
  ABILITY_LINE_TYPE_MESO = 15;
  ABILITY_LINE_TYPE_ATTACK_SPEED = 16;
}

// One line of a character's Inner Ability. What it is worth is not stored: a
// reset always rolls the top of GMS's range, so the value is a function of the
// type and the rank -- see AbilityLineValue.
message AbilityLine {
  AbilityLineType type = 1;
  AbilityRank rank = 2;
  // Whether a reset holds this line as it stands. Only a Unique or Legendary
  // line may be locked, and never more than two at once.
  bool locked = 3;
}

// One Inner Ability setup: three lines, and the rank of the whole. The first
// line always carries that rank; the other two are rolled a rung or more
// below it.
message AbilityPreset {
  AbilityRank rank = 1;
  repeated AbilityLine lines = 2;
}

// The two setups a character keeps, chosen between the same way the Hyper
// Stat presets are. Independent of each other, but a reset of either is paid
// for out of the one honor pool.
message InnerAbility {
  AbilityPreset farming = 1;
  AbilityPreset bossing = 2;
}

// A character's own stat amounts, before equipment or skills. STR/DEX/INT/LUK
// come from AP alone; hp and mp also collect what each level-up grants for the
// job held at the time. Equipment and skill bonuses are summed separately --
// see DerivedStatsFor in character_stats.h.
message AllocatedStats {
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 luk = 4;
  int32 hp = 5;
  int32 mp = 6;
}

// Items sitting in the character's equip bag, unequipped. Indexed by position
// (0-based integer) — order is preserved and multiple items of the same type
// are allowed. CharacterInstance::PickUp appends here.
message Inventory {
  repeated Equip equip_tab = 1;
}

// One sale the shop will undo. Buying an entry back costs exactly what the
// sale paid out, and an equip comes back as the item that left -- its stars,
// its scrolls, its spent slots, its trace flag -- because the price it sold
// for never paid for any of that.
message BuyBackEntry {
  oneof sold {
    Equip equip = 1;
    StackableStack stack = 2;
  }
  // What one copy sold for. The whole of an equip's price; a stackable row is
  // worth this times its count, and buying part of one costs this each.
  int64 unit_price = 3;
}

message Character {
  // What the player calls this character, alphanumeric and at most
  // kMaxUsernameLength. Never empty once saved: an unnamed character carries
  // kDefaultUsername, the row's own invitation to set one. Multiplayer will
  // introduce the player by this.
  string name = 1;
  int32 level = 2;
  // EXP accumulated toward the next level. Always < ExpToNextLevel(level).
  int64 exp = 3;
  Job job = 4;
  int32 job_stage = 5;
  int32 ap = 6;
  AllocatedStats allocated_stats = 7;

  // Unequipped items in the equip bag. Indexed by list position; use
  // CharacterInstance::Equip(slot, index) to move an item from here into a
  // slot, or Unequip(slot) to move it back.
  Inventory inventory = 8;

  // Currently worn items. Keyed by EquipSlot enum value (stored as int32,
  // proto3 map limitation). At most one item per slot. Only items in this map
  // contribute to the character's equipment stats.
  map<int32, Equip> equipped = 9;

  // Meso, the character's spendable currency. Earned from farming, spent on
  // upgrades. Non-negative.
  int64 meso = 10;

  // Available skill points, keyed by job stage (1 = 1st job, 2 = 2nd job, ...).
  // A stage's SP is earned only while leveling through that stage's band --
  // 3 per level, e.g. 1st job over levels 11-30 -- plus a bonus at the
  // advancement into it, and is spent only on that stage's skills. Passing a
  // band's top level stops its SP whether or not the advancement was taken.
  map<int32, int32> sp_by_stage = 11;

  // Available Hyper SP: a pool of its own, spent only on Hyper Skills. Not a
  // stage of the map above, which is banded by advancement level -- these are
  // earned one every five levels from 140 to 195, a band that spans the 4th
  // job's own and would be a stage the game does not have.
  int32 hyper_sp = 18;

  // Learned skill levels, keyed by the skill's display name (Skill.name).
  // Absent or zero means unlearned. Raised by spending that stage's SP.
  map<string, int32> skill_levels = 12;

  // The Use and Etc tabs, one entry per stack. Held as a flat list rather than
  // a tab apiece because a tab is only ever a filter over it, and the order
  // within a tab is the order the player sees.
  repeated StackableStack stacks = 13;

  // Scrolls the player has pinned to the top of the scroll list, by the keys
  // ScrollPinKey builds. A pin names a stat and a rate on one kind of
  // equipment, not one scroll file, so it holds as the character outgrows a
  // tier and meets the same scroll again at the next one.
  repeated string pinned_scrolls = 16;

  // The shop's buy-back shelf: the last sales this character made, newest
  // first, capped at kBuyBackSlots. One entry per sale rather than per item,
  // so selling 300 of something in two goes leaves two rows and buying them
  // back is two purchases. Oldest falls off the end.
  repeated BuyBackEntry buy_backs = 15;

  // Boss clears this character is holding against the reset clock, one entry
  // per boss and difficulty. What is stored is the moment of the clear; when
  // it expires is worked out from the difficulty's reset period, so retuning
  // a boss from daily to weekly takes effect on the clears already banked.
  repeated BossClear boss_clears = 17;

  // Toggle skills the player currently has switched on, by display name --
  // Righteously Indignant and nothing else so far. A skill absent here is
  // switched off, so a character who never learned one carries an empty list.
  // See Skill.toggle.
  repeated string active_skill = 19;

  // The two Hyper Stat allocations, spent from a pool that opens at level 140.
  // Both are the player's to fill; which one is in play is decided by the
  // activity -- see StatPreset.
  HyperStats hyper_stats = 20;

  // The two Inner Ability setups, which open at level 160. Both start on the
  // three Rare All Stats lines every character is handed.
  InnerAbility inner_ability = 21;

  // Honor, the currency an Inner Ability reset is paid for in. Its own pool,
  // held per character the way AP and SP are, and shared by the two presets.
  // Nothing pays into it yet.
  int64 honor = 22;

  // Tabs opened and gold trails walked, which the account keeps as of format
  // version 2: what the player has been shown once is shown to all of their
  // characters. See Account.seen_keys.
  reserved 14;
}

// One boss cleared at one difficulty, and when. Named by the data file stem
// and the difficulty's own name, the way every other catalog reference in a
// save is made.
message BossClear {
  string boss = 1;
  string difficulty = 2;
  int64 cleared_unix_seconds = 3;
}

// One stack on the Use or Etc tab. Carries the catalog key and a count, not
// the item itself: prototypes are loaded from data/ and resolved by name, so a
// save stays small and the data files stay authoritative over what an item is.
message StackableStack {
  string name = 1;
  int32 count = 2;
  ItemCategory category = 3;
}
