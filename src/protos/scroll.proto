syntax = "proto3";

package ms;

import "src/protos/equip.proto";

// The tier comes from the equipment's required_level:
//   Tier 1: 0-74, Tier 2: 75-114, Tier 3: 115+
enum ScrollTier {
  SCROLL_TIER_UNSPECIFIED = 0;
  SCROLL_TIER_1 = 1;
  SCROLL_TIER_2 = 2;
  SCROLL_TIER_3 = 3;
}

enum ScrollCategory {
  SCROLL_CATEGORY_UNSPECIFIED = 0;
  SCROLL_CATEGORY_CLEAN_SLATE = 1;
}

// The stat the scroll raises. The values are in display order: the scroll list
// sorts by ScrollType ascending, then by success_rate descending within a type.
enum ScrollType {
  SCROLL_TYPE_UNSPECIFIED = 0;
  SCROLL_TYPE_ATT = 1;
  SCROLL_TYPE_MATT = 2;
  SCROLL_TYPE_STR = 3;
  SCROLL_TYPE_DEX = 4;
  SCROLL_TYPE_INT = 5;
  SCROLL_TYPE_LUK = 6;
  SCROLL_TYPE_HP = 7;
  SCROLL_TYPE_DEF = 8;
  // Armour only, and only at low success rates. Raises all four stats at once,
  // each by less than the matching single-stat scroll raises one.
  SCROLL_TYPE_ALL_STATS = 9;
}

// The kind of equipment a scroll can be used on. Job categories can't express
// this: a universal hat has the same category every weapon scroll applies to,
// so without a target every weapon scroll would be offered for it.
// TargetForSlot gives the item's side.
enum ScrollTarget {
  // Any item. Clean slates use this: they restore a slot on any item that has
  // one.
  SCROLL_TARGET_UNSPECIFIED = 0;
  SCROLL_TARGET_WEAPON = 1;
  // Everything worn on the body except gloves; shoulderpads included.
  SCROLL_TARGET_ARMOUR = 2;
  // Accessories, with their own prices: face and eye pieces, earrings, rings,
  // pendants and the belt.
  SCROLL_TARGET_ACCESSORY = 3;
  // Gloves. GMS gives them their own scrolls, which add attack where armour
  // scrolls add a stat.
  SCROLL_TARGET_GLOVES = 4;
  // Hearts. Their scrolls add only the attack type the wearer's job uses.
  // Priced as accessories, which is how GMS prices them.
  SCROLL_TARGET_HEART = 5;
}

// One fully specified scroll, e.g. "Spell Trace 100% STR, Warrior, Tier 1".
message Scroll {
  string name = 1;
  ScrollType scroll_type = 2;
  ScrollCategory scroll_category = 3;
  ScrollTier tier = 4;
  // Success probability in [0, 100].
  int32 success_rate = 5;
  EquipStats stats = 6;
  repeated EquipJobCategory applicable_job_categories = 7;
  // Spell traces per copy, for clean slates only. GMS doesn't sell clean slates
  // for traces, so there is no price band to use.
  //
  // Every other scroll leaves this unset; its price comes from the level of the
  // item it is used on, through TraceCost in src/item/spell_trace_cost.h. A
  // data test rejects a value here, because it would be ignored.
  int32 trace_cost = 8;
  ScrollTarget target = 9;
}
