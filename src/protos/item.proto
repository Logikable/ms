syntax = "proto3";

package ms;

// Category of a stackable (non-equip) item. Equipment is defined separately by
// EquipPrototype and never stacks.
enum ItemCategory {
  ITEM_CATEGORY_UNSPECIFIED = 0;
  ITEM_CATEGORY_USE = 1;
  ITEM_CATEGORY_ETC = 2;
}

// What using an item does. Most items do nothing yet and leave this unset,
// which is what makes their Use entry inert.
enum ItemEffect {
  ITEM_EFFECT_UNSPECIFIED = 0;
  // Advances the character one level, whatever their EXP. A debugging tool
  // rather than something the game hands out.
  ITEM_EFFECT_LEVEL_UP = 1;
}

// Static definition of a stackable item type. Loaded from data/items textprotos
// at startup; shared read-only across all stacks of the same type.
message ItemPrototype {
  string name = 1;
  ItemCategory category = 2;
  // Maximum per-slot stack. 0 means the category default (see MaxStack):
  // Use = 9999, Etc = 200.
  int32 max_stack = 3;
  // Meso received when sold to a shop. 0 = unsellable.
  int32 sell_price = 4;
  // What the item is, in a sentence, for the inspect screen. A stack has no
  // stats to show, so this is the whole of what inspecting one tells you.
  string description = 5;
  // What one copy does when used. Unset means nothing happens, and the Use
  // entry is offered but inert.
  ItemEffect effect = 6;
}
