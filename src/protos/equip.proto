syntax = "proto3";

package ms;

enum AttackSpeed {
  ATTACK_SPEED_UNSPECIFIED = 0;
  ATTACK_SPEED_SLOWER = 1;
  ATTACK_SPEED_SLOW_1 = 2;
  ATTACK_SPEED_SLOW_2 = 3;
  ATTACK_SPEED_AVERAGE = 4;
  ATTACK_SPEED_FAST_1 = 5;
  ATTACK_SPEED_FAST_2 = 6;
  ATTACK_SPEED_FASTER = 7;
  ATTACK_SPEED_FASTEST_1 = 8;
  ATTACK_SPEED_FASTEST_2 = 9;
  ATTACK_SPEED_FASTEST_3 = 10;
}

// The kind of item, e.g. one-handed sword or bow. It decides which scrolls
// apply, the attack animation and weapon-specific mechanics.
enum EquipType {
  EQUIP_TYPE_UNSPECIFIED = 0;
  EQUIP_TYPE_ONE_HANDED_SWORD = 1;
  EQUIP_TYPE_BOW = 2;
  EQUIP_TYPE_STAFF = 3;
  EQUIP_TYPE_DAGGER = 4;
  EQUIP_TYPE_CLAW = 5;
  EQUIP_TYPE_THROWING_STAR = 6;
  // The 2nd-job warrior weapons. Which ones a character can use is decided by
  // their skills, not by the item: a Fighter's Final Attack takes a sword or an
  // axe, a Spearman's a spear or a polearm.
  EQUIP_TYPE_TWO_HANDED_AXE = 7;
  EQUIP_TYPE_SPEAR = 8;
  EQUIP_TYPE_POLEARM = 9;
  EQUIP_TYPE_TWO_HANDED_BLUNT = 10;
  EQUIP_TYPE_TWO_HANDED_SWORD = 11;
  // No items have these types yet. They exist so a skill that works with a
  // weapon in either hand can say so without naming only the half that has
  // items: a Fighter's mastery covers axes, not only two-handed axes.
  EQUIP_TYPE_ONE_HANDED_AXE = 12;
  EQUIP_TYPE_ONE_HANDED_BLUNT = 13;
  // The bowman's other weapon. It hits harder than a bow of the same level and
  // has a higher weapon constant; nothing else separates the two here.
  EQUIP_TYPE_CROSSBOW = 14;
  // Off-hand items, one kind per 2nd job. Two in the same branch have identical
  // stats, so only the type tells a Fighter's medallion from a Page's rosary.
  // AdvancementForSecondary uses it to keep each one with its own job.
  EQUIP_TYPE_MEDALLION = 15;
  EQUIP_TYPE_ROSARY = 16;
  EQUIP_TYPE_IRON_CHAIN = 17;
  // One book per magician branch. The player sees all three as a "Magic Book",
  // as in GMS. They are separate types because the type names which branch uses
  // the item, and one type couldn't name three branches.
  EQUIP_TYPE_MAGIC_BOOK_FIRE_POISON = 18;
  EQUIP_TYPE_MAGIC_BOOK_ICE_LIGHTNING = 19;
  EQUIP_TYPE_MAGIC_BOOK_HOLY = 20;
  EQUIP_TYPE_ARROW_FLETCHING = 21;
  EQUIP_TYPE_BOW_THIMBLE = 22;
  EQUIP_TYPE_CHARM = 23;
  EQUIP_TYPE_DAGGER_SCABBARD = 24;
  // Archer ammunition, one ladder per weapon. There are two types because the
  // type says which weapon uses it, and a bow can't fire a bolt. See AmmoFor in
  // src/item/projectile.h.
  EQUIP_TYPE_ARROW_FOR_BOW = 25;
  EQUIP_TYPE_ARROW_FOR_CROSSBOW = 26;
}

// The equipment window slot an item goes in when worn, one item per slot. A
// save records worn items by these numbers, so slots can be added but never
// renumbered; the numbers follow the order slots were added. The window's
// display order is kSlotOrder in src/item/slot_order.cc.
enum EquipSlot {
  EQUIP_SLOT_UNSPECIFIED = 0;
  EQUIP_SLOT_PRIMARY_WEAPON = 1;
  // Ammunition: a thief's stars, an archer's arrows. A shield goes in the off
  // hand next to a sword, but ammunition is used up rather than held, so it has
  // its own slot that never competes with a shield.
  EQUIP_SLOT_PROJECTILE = 2;
  // The off hand, which holds a 2nd job's class-specific secondary. Shields
  // would go here too, but none exist. Shield Mastery checks what is in this
  // slot; see Skill.requires_secondary.
  EQUIP_SLOT_SECONDARY = 3;

  // Armour.
  //
  // Top and bottom are separate slots and will stay that way. An overall covers
  // both but gets only one item's worth of scrolling and star force, so it
  // permanently loses everything the second item would have had.
  EQUIP_SLOT_HAT = 4;
  EQUIP_SLOT_TOP = 5;
  EQUIP_SLOT_BOTTOM = 6;
  EQUIP_SLOT_CAPE = 7;
  // Accessories worn on the face.
  EQUIP_SLOT_FACE_ACCESSORY = 8;
  EQUIP_SLOT_EYE_ACCESSORY = 9;

  // Accessories that star force treats as armour, so their stars raise Max HP.
  // See RaisesMaxHp in src/item/item.cc.
  //
  // These two are also the first ring slot and the first pendant slot. The
  // other ring and pendant slots are at the end of this list.
  EQUIP_SLOT_RING = 10;
  EQUIP_SLOT_PENDANT = 11;
  EQUIP_SLOT_BELT = 12;
  EQUIP_SLOT_SHOULDER = 13;
  // Worn, not carried, and the only slot with no level requirement: what goes
  // here is a boss reward a character keeps from the day it drops.
  EQUIP_SLOT_POCKET = 14;
  // The last of the original slots. Saves record worn items by this number, so
  // it was added at the end instead of beside the other accessories.
  EQUIP_SLOT_EARRINGS = 15;

  // One slot per Arcane River area, because a character wears one symbol from
  // each area and they don't compete. Giving each its own slot enforces that
  // for free, since a worn item already takes a whole slot.
  //
  // Numbered in the order the areas open, which is the order the Symbols tab
  // lists them.
  EQUIP_SLOT_SYMBOL_VANISHING_JOURNEY = 16;
  EQUIP_SLOT_SYMBOL_CHU_CHU_ISLAND = 17;
  EQUIP_SLOT_SYMBOL_LACHELEIN = 18;
  EQUIP_SLOT_SYMBOL_ARCANA = 19;
  EQUIP_SLOT_SYMBOL_MORASS = 20;
  EQUIP_SLOT_SYMBOL_ESFERA = 21;

  // A character wears four rings and two pendants. Any ring fits any of the
  // four ring slots: the item says EQUIP_SLOT_RING and goes in the first free
  // one. The same item can't be worn twice in one family. These are numbered
  // here, not beside the first ring, because slots can be added but never
  // renumbered.
  EQUIP_SLOT_RING_2 = 22;
  EQUIP_SLOT_RING_3 = 23;
  EQUIP_SLOT_RING_4 = 24;
  EQUIP_SLOT_PENDANT_2 = 25;

  // The rest of the body. Gloves and shoes are armour a player buys and
  // scrolls. Neither is in GMS's Category A, so their stars don't raise Max HP,
  // and gloves have their own scrolls that add attack.
  EQUIP_SLOT_GLOVES = 26;
  EQUIP_SLOT_SHOES = 27;
  // The three trophy slots, worn to show what a character has done. GMS allows
  // no scrolls on any of them.
  EQUIP_SLOT_BADGE = 28;
  EQUIP_SLOT_EMBLEM = 29;
  EQUIP_SLOT_MEDAL = 30;
  // Scrolled with its own scrolls, which add the attack type the wearer's job
  // uses. No heart items exist yet.
  EQUIP_SLOT_HEART = 31;

  // Grandis's areas, one slot each for the same reason as Arcane River's, and
  // in the order the areas open.
  EQUIP_SLOT_SYMBOL_CERNIUM = 32;
  EQUIP_SLOT_SYMBOL_ARCUS = 33;
  EQUIP_SLOT_SYMBOL_ODIUM = 34;
  EQUIP_SLOT_SYMBOL_SHANGRI_LA = 35;
  EQUIP_SLOT_SYMBOL_ARTERIA = 36;
  EQUIP_SLOT_SYMBOL_CARCION = 37;

  // A character wears three totems, a family like the rings: any totem fits
  // any of the three, and the same one can't be worn twice. GMS allows no
  // scrolls, stars or potential on them.
  EQUIP_SLOT_TOTEM = 38;
  EQUIP_SLOT_TOTEM_2 = 39;
  EQUIP_SLOT_TOTEM_3 = 40;

  // A character keeps three pets, a family like the totems but the only one
  // that takes copies: three of the same pet fill all three slots. A pet is
  // the item itself, scrolled with its own scroll; there is no separate pet
  // equipment.
  EQUIP_SLOT_PET = 41;
  EQUIP_SLOT_PET_2 = 42;
  EQUIP_SLOT_PET_3 = 43;

  // The Cont Ring slot, below the four rings: GMS's extra Special Skill Ring
  // slot, which only a passive ring (the Continuous Ring) fits. GMS opens it
  // only while a Lv. 4+ special ring is worn; here it is always open.
  EQUIP_SLOT_CONT_RING = 44;
}

// The rank of a potential and of each of its lines. It has the same four ranks
// as Inner Ability, but is a separate enum because an item isn't a character
// and the two can diverge.
enum PotentialRank {
  POTENTIAL_RANK_UNSPECIFIED = 0;
  POTENTIAL_RANK_RARE = 1;
  POTENTIAL_RANK_EPIC = 2;
  POTENTIAL_RANK_UNIQUE = 3;
  POTENTIAL_RANK_LEGENDARY = 4;
}

// What one potential line can grant: the part of GMS's list that some stat here
// uses. When GMS offers one effect at several sizes, each size is its own type
// (two entries in one pool, not one entry with two values), so a line's value
// depends only on its type, rank and item level.
enum PotentialLineType {
  POTENTIAL_LINE_TYPE_UNSPECIFIED = 0;
  // Flat stats. As in GMS, they are rare on their own: Epic and above no longer
  // roll them, which is most of the reason to rank up.
  POTENTIAL_LINE_TYPE_STR = 1;
  POTENTIAL_LINE_TYPE_DEX = 2;
  POTENTIAL_LINE_TYPE_INT = 3;
  POTENTIAL_LINE_TYPE_LUK = 4;
  POTENTIAL_LINE_TYPE_ALL_STATS = 5;
  POTENTIAL_LINE_TYPE_MAX_HP = 6;

  POTENTIAL_LINE_TYPE_STR_PCT = 7;
  POTENTIAL_LINE_TYPE_DEX_PCT = 8;
  POTENTIAL_LINE_TYPE_INT_PCT = 9;
  POTENTIAL_LINE_TYPE_LUK_PCT = 10;
  // One rank weaker than the single-stat lines above and rolled from Epic up,
  // both as in GMS.
  POTENTIAL_LINE_TYPE_ALL_STATS_PCT = 11;
  POTENTIAL_LINE_TYPE_MAX_HP_PCT = 12;

  // Weapon lines, rolled only on a weapon, secondary or emblem.
  POTENTIAL_LINE_TYPE_ATTACK_PCT = 13;
  POTENTIAL_LINE_TYPE_MAGIC_ATTACK_PCT = 14;
  POTENTIAL_LINE_TYPE_DAMAGE_PCT = 15;
  POTENTIAL_LINE_TYPE_IGNORE_DEFENSE_15 = 16;
  POTENTIAL_LINE_TYPE_IGNORE_DEFENSE_30 = 17;
  POTENTIAL_LINE_TYPE_IGNORE_DEFENSE_35 = 18;
  POTENTIAL_LINE_TYPE_IGNORE_DEFENSE_40 = 19;
  POTENTIAL_LINE_TYPE_BOSS_DAMAGE_30 = 20;
  POTENTIAL_LINE_TYPE_BOSS_DAMAGE_35 = 21;
  POTENTIAL_LINE_TYPE_BOSS_DAMAGE_40 = 22;

  // Lines that only one slot rolls each: gloves, then the accessories, then the
  // hat.
  POTENTIAL_LINE_TYPE_CRIT_DAMAGE_PCT = 23;
  POTENTIAL_LINE_TYPE_MESO_RATE = 24;
  POTENTIAL_LINE_TYPE_ITEM_DROP_RATE = 25;
  POTENTIAL_LINE_TYPE_COOLDOWN_1 = 26;
  POTENTIAL_LINE_TYPE_COOLDOWN_2 = 27;

  // Bonus potential's lines off weaponry, weaker than the main lines of the
  // same name. Bonus weaponry rolls the main %stat, %ATT and %Damage lines
  // instead, since GMS gives them the same values there.
  POTENTIAL_LINE_TYPE_BONUS_STR_PCT = 28;
  POTENTIAL_LINE_TYPE_BONUS_DEX_PCT = 29;
  POTENTIAL_LINE_TYPE_BONUS_INT_PCT = 30;
  POTENTIAL_LINE_TYPE_BONUS_LUK_PCT = 31;
  POTENTIAL_LINE_TYPE_BONUS_ALL_STATS_PCT = 32;
  POTENTIAL_LINE_TYPE_BONUS_MAX_HP_PCT = 33;
  // Bonus weaponry's boss damage, one line whose value steps with the item's
  // level, unlike the main track's fixed sizes.
  POTENTIAL_LINE_TYPE_BONUS_BOSS_DAMAGE = 34;
  // Flat stat per 9 character levels, off weaponry: a line's value is the
  // points per step, and the wearer's level decides the steps.
  POTENTIAL_LINE_TYPE_STR_PER_9_LEVELS = 35;
  POTENTIAL_LINE_TYPE_DEX_PER_9_LEVELS = 36;
  POTENTIAL_LINE_TYPE_INT_PER_9_LEVELS = 37;
  POTENTIAL_LINE_TYPE_LUK_PER_9_LEVELS = 38;
}

// One line of a potential. Its value isn't stored; PotentialLineValue computes
// it from the type, the rank and the item's level.
message PotentialLine {
  PotentialLineType type = 1;
  // Either the potential's own rank or one below it. GMS calls a line at the
  // potential's rank a prime line; only the rank is kept here.
  PotentialRank rank = 2;
}

// The potential on one item: a rank and three lines. The first line always has
// the potential's rank; the second and third are prime with low odds and one
// rank lower otherwise.
//
// An item with no potential leaves this message unset, which is every item
// until the first cube is used on it.
message Potential {
  PotentialRank rank = 1;
  repeated PotentialLine lines = 2;
}

// A way an item can be improved after it drops. A prototype lists these only to
// say which ones the item refuses.
enum Upgrade {
  UPGRADE_UNSPECIFIED = 0;
  UPGRADE_SCROLL = 1;
  UPGRADE_STAR_FORCE = 2;
  // Both tracks: an item that refuses cubes keeps the potential it dropped
  // with.
  UPGRADE_CUBE = 3;
  UPGRADE_FLAME = 4;
}

// What one flame line grants. A pair grants the same amount of both stats.
enum FlameStat {
  FLAME_STAT_UNSPECIFIED = 0;
  FLAME_STAT_STR = 1;
  FLAME_STAT_DEX = 2;
  FLAME_STAT_INT = 3;
  FLAME_STAT_LUK = 4;
  FLAME_STAT_STR_DEX = 5;
  FLAME_STAT_STR_INT = 6;
  FLAME_STAT_STR_LUK = 7;
  FLAME_STAT_DEX_INT = 8;
  FLAME_STAT_DEX_LUK = 9;
  FLAME_STAT_INT_LUK = 10;
  FLAME_STAT_MAX_HP = 11;
  FLAME_STAT_ATTACK = 12;
  FLAME_STAT_MAGIC_ATTACK = 13;
  FLAME_STAT_ALL_STAT = 14;
  FLAME_STAT_BOSS_DAMAGE = 15;
  FLAME_STAT_DAMAGE = 16;
}

// One line of an item's flame (GMS's Bonus Stats). Its value isn't stored;
// FlameLineValue computes it from the stat, the tier and the item.
message FlameLine {
  FlameStat stat = 1;
  // 3 to 7, GMS's boss-equipment tiers: every item here is flame advantaged.
  int32 tier = 2;
}

// A boss soul's tier, which sets what its line is worth. GMS's tier lists
// and its shard pages disagree; the tiers here follow the values the shard
// pages give, so Hilla sits with Arkarium in A.
enum SoulTier {
  SOUL_TIER_UNSPECIFIED = 0;
  SOUL_TIER_C = 1;
  SOUL_TIER_B = 2;
  SOUL_TIER_A = 3;
  SOUL_TIER_S = 4;
  SOUL_TIER_SS = 5;
}

// The seven lines a Magnificent soul can roll, at equal odds.
enum SoulLine {
  SOUL_LINE_UNSPECIFIED = 0;
  SOUL_LINE_ATTACK = 1;
  SOUL_LINE_MAGIC_ATTACK = 2;
  SOUL_LINE_ALL_STATS = 3;
  SOUL_LINE_MAX_HP = 4;
  SOUL_LINE_CRIT_RATE = 5;
  SOUL_LINE_IGNORE_DEFENSE = 6;
  SOUL_LINE_BOSS_DAMAGE = 7;
}

// The soul on a weapon. Unlike GMS every soul is Magnificent, so there is no
// grade to store. The tier is copied from the shard when the soul is applied,
// as GMS's soul item carries its own stats.
message Soul {
  // The boss's short name, as its shard gives it: "Damien".
  string boss = 1;
  SoulTier tier = 2;
  SoulLine line = 3;
}

// Which job branches can equip the item. UNIVERSAL means any job; BEGINNER
// includes characters who haven't advanced yet (Noblesse, etc.). Used to filter
// scrolls and to enforce equip requirements.
enum EquipJobCategory {
  EQUIP_JOB_CATEGORY_UNSPECIFIED = 0;
  EQUIP_JOB_CATEGORY_WARRIOR = 1;
  EQUIP_JOB_CATEGORY_BOWMAN = 2;
  EQUIP_JOB_CATEGORY_MAGICIAN = 3;
  EQUIP_JOB_CATEGORY_THIEF = 4;
  EQUIP_JOB_CATEGORY_PIRATE = 5;
  EQUIP_JOB_CATEGORY_UNIVERSAL = 6;
  EQUIP_JOB_CATEGORY_BEGINNER = 7;
}

message EquipStats {
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 luk = 4;
  int32 attack = 5;
  int32 magic_attack = 6;
  int32 max_hp = 7;
  int32 max_mp = 8;
  int32 def = 9;
  // Percent bonus to damage against bosses (e.g. 30 = 30%). OffenseStatsFor
  // reads it and ExpectedAttackDamage applies it to mobs with the `boss` flag
  // set.
  int32 boss_damage = 10;
  // Percent of enemy defense ignored (e.g. 10 = 10%). OffenseStatsFor reads it
  // and ExpectedAttackDamage applies it against the mob's PDR.
  int32 ignore_enemy_defense = 11;
  // Percent added to how often a kill drops anything, meso included (e.g. 20 =
  // a fifth more often). It adds to what the character's passives grant; see
  // DerivedStats::item_drop_pct. No item has it; a potential's drop line goes
  // through PotentialTotals.
  int32 item_drop_rate = 12;
  // Percent added to max HP and MP (e.g. 10 = a tenth more). It applies to the
  // whole pool, as a passive's does, and adds to what the character's skills
  // grant; see DerivedStatsFor.
  int32 max_hp_pct = 13;
  int32 max_mp_pct = 14;
  // Percent added to the meso a kill drops (e.g. 20 = a fifth more). It is the
  // only equipment bonus with its own cap: however much a character wears,
  // equipment adds at most kEquipMesoSoftCap; see MesoBonus. No item has it; a
  // potential's meso line reaches the same bonus through PotentialTotals.
  int32 meso_rate = 15;
}

// What an Arcane Symbol needs beyond an ordinary equip. Only the six Arcane
// Symbols set it, so its presence is what marks one.
message ArcaneSymbolInfo {
  // The main term in the cost of a level-up: 10,000 x floor[(this + 0.1 x
  // level) x duplicates]. It rises by area, from 8 in Vanishing Journey to 18
  // in Esfera, which is why later symbols cost more to raise.
  int32 meso_cost_base = 1;
  // The level at which this symbol's area opens: 200 for Vanishing Journey up
  // to 235 for Esfera. A player gets the symbol from the level at which they
  // can first reach the map that gives it.
  int32 area_level = 2;
}

// What a Sacred Symbol needs beyond an ordinary equip; see ArcaneSymbolInfo.
message SacredSymbolInfo {
  // The main term in the cost of a level-up: 100,000 x floor[(this - 0.6 x
  // level) x duplicates]. GMS states it to a tenth, from 13.2 in Cernium to
  // 22.2 in Carcion.
  double meso_cost_base = 1;
  // The boss that caps this symbol's area, by data file stem. A maxed symbol
  // adds kSacredMaxBossDamagePct against it, and nothing while the boss isn't
  // in the game.
  string boss = 2;
  // That boss's name as the symbol's card shows it, since the boss may not
  // exist to be asked.
  string boss_name = 3;
  // The level GMS opens this symbol's area at, 260 for Cernium up to 285 for
  // Carcion. Only a max character reads it; this game's Grandis maps all open
  // at 260.
  int32 area_level = 4;
}

// One way to buy an item with tokens.
message TokenPrice {
  // The token, by data file stem.
  string token_item = 1;
  int32 count = 2;
}

// The definition of an item type, loaded from data/ at startup and shared
// read-only by every EquipInstance of that type.
message EquipPrototype {
  string name = 1;
  EquipType equip_type = 2;
  EquipSlot equip_slot = 3;
  AttackSpeed attack_speed = 4;
  int32 required_level = 5;
  repeated EquipJobCategory equip_job_categories = 6;
  EquipStats base_stats = 7;
  int32 upgrade_slots = 8;
  // Upgrades this item refuses. Ordinary equipment accepts all of them, so data
  // files list only the exceptions. Check it per item, never per equip_type:
  // two throwing stars don't have to agree.
  repeated Upgrade unsupported_upgrades = 9;
  // The shop price in meso. Setting a price is what puts an item in the shop,
  // so there is no second list to keep in sync. It is optional because zero is
  // a valid price; leaving it unset keeps the item out of the shop.
  optional int32 shop_price = 10;
  // What the shop pays for the item, when that isn't a tenth of shop_price
  // (GMS's buy-back rate, and the default for items the shop stocks). Set only
  // on items no shop sells. Call SellPrice instead of reading this field. Zero
  // is a valid price: an item worth nothing is thrown away. Boss and token gear
  // is 0, since the gear is the reward and selling it would pay a clear twice.
  optional int32 sell_price = 11;
  // The tokens this item is bought with, any one of them. Empty for items sold
  // for meso, which is most of them. A price puts an item on the token shelf,
  // the same way shop_price puts it on the meso shelf.
  repeated TokenPrice token_prices = 12;
  // The set family this item belongs to, e.g. "Frozen Weapon". A set names a
  // family when any of several items fills a slot; weapons are per class, so a
  // set can't name one directly. Empty for items in no set and for items a set
  // names directly.
  string set_family = 14;
  // Set only on the twelve symbols. A symbol levels up by absorbing duplicates
  // instead of through scrolls or stars, and its stats depend on its level and
  // the wearer's job. So its base_stats are empty and SymbolStatsFor computes
  // them.
  oneof symbol {
    ArcaneSymbolInfo arcane_symbol = 15;
    SacredSymbolInfo sacred_symbol = 16;
  }
  // The upgrade state every new copy starts in, for an item that drops already
  // scrolled or with a potential. Set only what differs from a plain drop;
  // FreshEquip fills in the name and the open slots.
  optional Equip dropped_as = 17;
  // The pets' place on their shelf, lowest first, since they share a level,
  // price and type and would otherwise list by name. The order is the user's.
  int32 shelf_order = 18;
  // The skill this item grants while worn; unset on almost everything. Each
  // level of a Special Skill Ring is its own item, so the level is the item's.
  EquipmentSkill equipment_skill = 19;
  // On a weapon, the base attack of the bow at its required level: GMS's
  // Combat Power prices every weapon as that bow. Data files never set this;
  // FillBowAttack does, and 0 means no bow matched.
  int32 bow_attack = 20;
}

// A skill a worn item grants. See Skill.granted_by_equip.
message EquipmentSkill {
  // The skill's display name.
  string skill = 1;
  int32 level = 2;
}

// The per-copy state of one dropped item, saved to disk. It refers to its
// prototype by name. If trace is true, star force destroyed the item and it
// stays in equip_tab as a trace that can't be equipped.
message Equip {
  string equip_name = 1;
  int32 remaining_upgrade_slots = 2;
  int32 scroll_successes = 3;
  EquipStats scroll_stats = 4;
  int32 stars = 5;
  bool trace = 6;
  // A symbol's level; zero on everything else. A new copy is level 1,
  // which SymbolLevel reads from the zero here, so drops don't need to set it.
  int32 symbol_level = 7;
  // Duplicates absorbed toward the next level. Whatever is left after a
  // level-up is paid carries over to the next level.
  int32 symbol_exp = 8;
  // Golden Hammers used, before the slots they added were built in. Read only
  // by the version 3 save upgrade.
  int32 legacy_hammers = 9 [deprecated = true];
  // The potential lines on this item, unset until the first cube is used.
  Potential main_potential = 10;
  // A second potential with pools of its own, unset until the first bonus cube
  // is used; see PotentialTrack.
  Potential bonus_potential = 11;
  // Four distinct lines once flamed, empty before; see src/item/flame.h.
  repeated FlameLine flame = 12;
  // Unset until 10 of a boss's soul shards are applied; weapons only.
  Soul soul = 13;
}
