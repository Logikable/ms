syntax = "proto3";

package ms;

import "src/protos/equip.proto";

// Tier is determined by the equipment's required_level:
//   Tier 1: 0-74, Tier 2: 75-114, Tier 3: 115+
enum ScrollTier {
  SCROLL_TIER_UNSPECIFIED = 0;
  SCROLL_TIER_1 = 1;
  SCROLL_TIER_2 = 2;
  SCROLL_TIER_3 = 3;
}

enum ScrollCategory {
  SCROLL_CATEGORY_UNSPECIFIED = 0;
  SCROLL_CATEGORY_CLEAN_SLATE = 1;
}

// Primary stat boosted by the scroll. Values are ordered for display: the
// scroll list in the UI is sorted by ScrollType ascending, then by
// success_rate descending within each type.
enum ScrollType {
  SCROLL_TYPE_UNSPECIFIED = 0;
  SCROLL_TYPE_ATT = 1;
  SCROLL_TYPE_MATT = 2;
  SCROLL_TYPE_STR = 3;
  SCROLL_TYPE_DEX = 4;
  SCROLL_TYPE_INT = 5;
  SCROLL_TYPE_LUK = 6;
  SCROLL_TYPE_HP = 7;
  SCROLL_TYPE_DEF = 8;
  // Armour only, and only at the long odds. Raises all four stats at once by
  // less than the single-stat scroll beside it raises one.
  SCROLL_TYPE_ALL_STATS = 9;
}

// The kind of equipment a scroll goes on. The job categories cannot say this:
// a universal hat lists the same category every weapon scroll applies to, so
// without a target every weapon scroll is offered for it. TargetForSlot reads
// the item's side of the question.
enum ScrollTarget {
  // Any item. What a clean slate is: it restores a slot on whatever holds one.
  SCROLL_TARGET_UNSPECIFIED = 0;
  SCROLL_TARGET_WEAPON = 1;
  SCROLL_TARGET_ARMOUR = 2;
}

// One Scroll represents a single, fully-specified scroll option,
// e.g. "Spell Trace 100% STR, Warrior, Tier 1".
message Scroll {
  string name = 1;
  ScrollType scroll_type = 2;
  ScrollCategory scroll_category = 3;
  ScrollTier tier = 4;
  // Success probability in [0, 100].
  int32 success_rate = 5;
  EquipStats stats = 6;
  repeated EquipJobCategory applicable_job_categories = 7;
  // Spell traces one copy costs. GMS prices a scroll by the item's ten-level
  // band; a tier here spans several of those, so each tier takes the band its
  // own equipment actually sits in -- level 60 for T1, 100 for T2, 150 for T3.
  int32 trace_cost = 8;
  ScrollTarget target = 9;
}
