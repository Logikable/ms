syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/equip.proto";

// How a skill folds into the game. Combat is a single expected-damage
// auto-attack, so skills are passive modifiers in one of two roles.
enum SkillKind {
  SKILL_KIND_UNSPECIFIED = 0;
  SKILL_KIND_ATTACK = 1;   // the swing's identity: supplies skill_pct
  SKILL_KIND_PASSIVE = 2;  // folds its levers into the character's stats
  // Cast, but not an attack. It spends the character's swing on something
  // other than damage -- the Cleric's Heal, which they cast in place of a
  // swing when they are low. A cast with no lever behind it is not offered at
  // all: it would take the slot and do nothing.
  SKILL_KIND_ACTIVE = 3;
  // Attacks on its own clock, alongside whatever the character is swinging,
  // rather than being the swing. A summon or a cooldown skill the player would
  // be holding down anyway; see cast_interval_seconds.
  SKILL_KIND_AUTO_ATTACK = 4;
}

// A mark on a skill that some rule outside the skill reads: a group it belongs
// to, a family a later skill asks about. A tag never changes what the skill
// itself does -- that is what SkillEffect is for.
enum SkillTag {
  SKILL_TAG_UNSPECIFIED = 0;
  // The Paladin's Holy Power group. Nothing reads it yet: Vessel of Light, the
  // skill GMS gates on having used one, is permanent here.
  SKILL_TAG_HOLY_POWER = 1;
  // A fire spell. Ignite reads it: the fire mage's Final Attack follows their
  // fire spells and nothing else, so the attacks say which of them burn.
  SKILL_TAG_FIRE = 2;
  // The Cleric's Benevolence group -- the healing half of their kit -- and the
  // Vengeance forms Righteously Indignant puts in its place. Both are marks
  // rather than rules: which form stands is settled by name, through
  // Skill.replaces_skill_name.
  SKILL_TAG_BENEVOLENCE = 3;
  // The Hero line's Swordsmanship group -- Brandish and Intrepid Slash, the
  // two swings GMS marks with it. Nothing reads it yet: what reads it in GMS
  // is a 4th job skill, far above this game's cap.
  SKILL_TAG_SWORDSMANSHIP = 4;
  // The elements an I/L magician alternates between. Freezing Crush reads the
  // pair: an ice swing leaves Freeze Stacks behind it and a lightning swing
  // spends them, so the attacks say which of the two they are.
  SKILL_TAG_ICE = 5;
  SKILL_TAG_LIGHTNING = 6;
  SKILL_TAG_VENGEANCE = 7;
}

// A skill's per-level contribution to the character's stats. Only the levers we
// currently model are here; a skill whose real effect is something we don't
// track (speed, jump, ...) simply carries no levers and does nothing. Percents
// are fractions (0.10 == +10%).
//
// Numbered in two blocks. Everything up to 99 is a lever any job could want;
// from 100 up is one that exactly one job line's book grants, parked out of the
// way so a new class does not thread its one-off through the middle of the
// general ones.
//
// The test is the MECHANISM, not whose book happens to state it today. Boss
// damage belongs above because any book could pay it and gear already does; a
// Combo Orb belongs below because nothing but a warrior counts them.
//
// Nothing here is ever serialized -- the catalog loads from textproto by field
// NAME and the save refers to skills by display name -- so these numbers are
// free to move, unlike character.proto's.
message SkillEffect {
  // Primary stats, exactly as a worn item grants them.
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 luk = 4;

  // HP and MP pools. The flat amounts land first -- the outright grant and the
  // per-level one alike -- and the percent scales what they come to.
  //
  // The pair below is per LEVEL, which is how most of GMS's pool skills read.
  // Advanced Blessing simply grants 750, so the flat pair above it is what a
  // worn item's Max HP is: the same number at level 1 and at 140.
  int32 max_hp = 25;
  int32 max_mp = 26;
  int32 max_hp_per_level = 5;
  double max_hp_pct = 6;
  int32 max_mp_per_level = 7;
  double max_mp_pct = 8;

  int32 attack = 9;  // flat weapon attack, as a worn weapon grants it
  // Percentage added to the whole of the character's attack, worn and granted
  // alike, and the last thing to land on it -- the same bargain def_pct makes
  // with DEF. Unlike that one it pays: attack is the second factor of the
  // damage chain, so 25% here is worth 25% more damage.
  double attack_pct = 24;
  // Flat magic attack, likewise. A magician swings on this where everyone else
  // swings on attack, so the two are separate fields for the same reason a
  // staff's two numbers are: a skill grants one or the other, not both.
  int32 magic_attack = 10;
  double skill_pct = 11;  // damage multiplier (attack skills)
  // Added chance for a swing to crit. On a passive it rides the character; on
  // an ATTACK it rides that attack alone, the way ied_pct and boss_pct do --
  // Snipe crits every time and hands nothing to the swing after it. Added to
  // what the character already has, so 1.00 is certainty either way.
  double crit_rate = 12;
  // Added critical damage (0.05 == +5%), on top of the hidden 0.35 every
  // character crits for. Worth its share of the swings: a crit rate of 20%
  // makes 5% of critical damage worth 1% of damage.
  double crit_dmg = 13;
  int32 attack_speed = 14;  // faster-swing stages, added to the weapon's own
  // Weapon mastery, 0..1: how close the swing's minimum roll comes to its
  // maximum. Unlike everything else here, masteries do not stack -- a
  // character holding two takes the better one, not the sum.
  double mastery = 15;
  // Plain % damage (0.05 == +5%). Every source of it sums inside a single
  // multiplier, so two skills granting 5% come to 10%.
  double damage_pct = 16;
  // Final damage (0.10 == +10%), which multiplies where damage_pct adds: two
  // sources of 10% are worth 21%, not 20%. The distinction is invisible until
  // a second source of either exists, and expensive to unpick afterwards.
  //
  // On an ATTACK this rides that swing alone rather than following the
  // character, exactly as ied_pct and boss_pct do -- see WithoutSwingLevers.
  double final_dmg_pct = 17;

  // Final Attack: a chance for the character's swing to be followed by one
  // extra hit on each enemy that swing reached, worth final_attack_pct of a
  // plain swing on each of final_attack_lines strikes. The lines are told
  // apart rather than folded into one percent because each rolls its own crit
  // and its own mastery, which two stars of 150% and one of 300% do not come
  // to the same thing under. 0 lines is one strike.
  //
  // Only the character's own swings carry it. A skill firing on its own clock
  // does not, which is why the two are separate fields rather than one
  // expected value: the chance and the damage are what the player is shown.
  //
  // It rolls separately for every enemy the swing reached, so what it is worth
  // is this against each of them. Which swings set it off belongs to the skill
  // rather than to the level -- see Skill.follows_skill_tag.
  double final_attack_chance = 18;
  double final_attack_pct = 19;
  int32 final_attack_lines = 32;

  int32 def = 20;                // flat weapon DEF
  double damage_taken_pct = 21;  // share of incoming damage cancelled
  // Chance an incoming hit misses outright (0.30 == 30%). Not reduction: what
  // it cancels is the whole hit rather than a share of one. The two are still
  // worth the same to an expected-value fight, which is why this multiplies
  // into the damage taken beside them -- what it buys the player that reduction
  // does not is a hit they never took at all, and nothing here can tell.
  //
  // GMS calls two different things avoidability and this is only one of them.
  // What lands here is the flat roll -- Evasion Boost's, and the "Bonus
  // Avoidability Chance" Illusion Step grants. The other is the AVOID STAT,
  // which loses an accuracy check against the monster's, and which this game
  // has no notion of: a skill granting a share of THAT grants nothing here.
  // Two rolls meet as rolls do, so no pile of them ever reaches certainty.
  double dodge_chance = 22;
  // Share taken off the ATTACK of whatever is hitting the character (0.30 ==
  // 30% less). Not reduction: it weakens the monster before its hit is rolled,
  // so the character's DEF cancels a larger share of what is left -- which is
  // the whole difference between a barrier and armour.
  //
  // Summed across its sources, GMS stating each as points on the same number,
  // and floored at nothing: no pile of barriers ever makes a monster harmless.
  //
  // Ordinary monsters alone, unless something grants the field below. GMS
  // weakens what walks into the barrier and a boss walks into nothing.
  double enemy_attack_pct = 50;
  // Whether the share above reaches a BOSS as well. Set by a skill of its own
  // rather than paired with the lever, because that is how GMS sells it: the
  // Night Lord's Frailty Curse - Boss Rush lifts the barrier the rest of their
  // book already raised. One skill granting it opens the whole of what the
  // character has.
  bool enemy_attack_reaches_boss = 51;
  // Share of the monster's DEF this character's attacks ignore (0.25 == 25%).
  // Combines in reverse: what two sources leave the monster is the product of
  // what each leaves it, so 30% and 40% ignore 58% between them and no pile of
  // sources ever reaches all of it. Gear grants the same thing -- see
  // EquipStats::ignore_enemy_defense -- and the two meet the same way.
  //
  // On an ATTACK this rides that attack's own swing and no other; on a passive
  // it rides the character. GMS writes it both ways and means two different
  // things by them. See WithoutSwingLevers.
  double ied_pct = 23;

  // Share added to the character's damage against a boss and nothing else (0.10
  // == +10%). Sums with what gear grants, the two being the same quantity from
  // two places.
  //
  // Ships dead, like the resistances below: no mob in the game sets `boss`.
  // The stats page shows it so a player can see what their points and their
  // gear bought, which is more than the equipment's own half ever got.
  //
  // Rides one swing or the character by the same rule ied_pct does: Heaven's
  // Hammer hits a boss 30% harder and hands nothing to the swing after it.
  double boss_pct = 27;
  // Damage percentage this attack ADDS against anything that is not a boss, per
  // line, exactly as skill_pct is per line -- so a 180% swing carrying 180%
  // here lands 360% on an ordinary monster. GMS states it as percentage POINTS
  // on the skill for that reason, and it is Beam Blade's whole identity. Not
  // the equipment's boss damage in mirror image: that one is a share of the
  // character's damage, and this is a share of one swing's.
  double normal_skill_pct = 28;
  // Maple Warrior. Share of what AP bought that this skill grants back as flat
  // stat, stat by stat (0.15 == 15%): 1000 points of STR and 100 of DEX become
  // 150 and 10. Rounded down, as GMS rounds it.
  //
  // Only what AP bought counts. A ring's STR and another skill's STR are not
  // multiplied by this, which is why it reads the allocation rather than the
  // total -- and what it grants IS a grant like theirs, so a percentage over
  // the character's stats would lift this too.
  double ap_stat_pct = 29;
  // Strikes added to every multi-line swing the character makes -- Bolt
  // Surplus's "+1 attack to all multi-hit skills". Summed across its sources,
  // of which there is one.
  //
  // GMS says it skips summons, 5th job common skills and "certain skills", and
  // every one of those falls out of what a swing is here: a summon fires on its
  // own clock rather than being swung, and a Final Attack is a lever with no
  // line count to add to. What is left is exactly the attacks the character
  // chooses between, an empowered form among them.
  //
  // A swing that lands once is left alone. GMS grants this to multi-hit skills,
  // and a single strike doubling would be the largest lever in the game.
  int32 bonus_attack_lines = 33;
  // Expected share of the HP pool a landed swing puts back (0.02 == 2%). GMS
  // states it as a chance of a fixed amount; the expectation is what an
  // expected-damage fight can use, so the two are multiplied out here. Unlike
  // heal_pct this costs no swing -- it rides the attack.
  //
  // On an ATTACK it rides THAT swing alone, as ied_pct and the other swing
  // levers do: Angel Ray heals the Bishop as it lands and Big Bang does not.
  // On a passive it follows the character, which is Lord of Darkness's shape.
  // See WithoutSwingLevers.
  double hp_recover_pct = 34;

  // Share of the HP pool one cast of this skill puts back (1.00 == all of it).
  // The one lever spent during a fight rather than folded into the stat line:
  // the character casts it in place of a swing when they are low, and the fight
  // is what reads it. See CombatSim::HealToCast.
  double heal_pct = 35;
  // Damage multiplier of the harder opening hit some swings land on a single
  // enemy before spreading -- GMS's "strikes one, then detonates in place".
  // Read with Skill.lead_lines, and 0 for the swings that land once.
  double lead_pct = 36;

  // Shadow Partner. A shadow copies every line the character's swing lands and
  // strikes again for this share of one (0.70 == 70%), so a three-line swing
  // lands three real lines and three shadow ones.
  //
  // Carried as lines rather than folded into a multiplier, which comes to the
  // same damage: what the player is buying is a second set of hits, and a page
  // that says so is worth the field. Summed across sources, of which there is
  // one.
  //
  // The shadow copies SWINGS. It does not copy a summon's pulse or a Final
  // Attack -- the same line those two are already drawn on in encounter.cc.
  double mirror_line_pct = 37;
  // Levels this skill adds to every other skill the character has already
  // learned, held to each one's master level. It never raises the skill
  // granting it, and never teaches one that is unlearned.
  //
  // A double for a lever counted in whole levels, because GMS climbs it in a
  // step -- one level for most of the ladder and two at the top -- which
  // base + per_level * (L - 1) can only walk by carrying the fraction and
  // flooring it where it is read. See EffectiveSkillLevel.
  //
  // A skill marked Skill.exceeds_master_level takes these levels past its own
  // master level; every other skill stops there.
  double skill_level_bonus = 38;
  // Share added to how long every buff the character raises stays up (0.50 ==
  // half again), summed across its sources. It lengthens the buff and leaves
  // the wait for the next one alone, which is the whole of what it buys.
  //
  // Only a Buff has a duration to lengthen, so this reaches exactly the skills
  // that could not be folded in as permanent -- see the Buff message.
  double buff_duration_pct = 39;
  // Share of the HP pool one pulse of a fountain puts back, and how many
  // seconds apart the pulses are. Both are read together and only together:
  // what reaches the fight is the rate, so two sources would add their rates
  // rather than their pulses.
  //
  // Unlike heal_pct this costs no swing and asks for nothing -- the fountain
  // stands there whether the character is winning or losing. The interval
  // climbs the ladder downwards, so per_level is negative.
  double regen_pct = 40;
  double regen_interval_seconds = 41;
  // A pulse poured in flat HP rather than as a share of the pool, on the same
  // clock and read with it. The Evil Eye's aura is what it exists for: GMS
  // heals a flat 20 HP every 24 seconds, which is nothing to a character with
  // a pool -- and is exactly what its Hyper Skill exists to replace.
  //
  // Set beside regen_pct or instead of it. Either half is enough to make a
  // fountain, and one pouring both pours both.
  int32 regen_hp = 49;
  // Total INT that buys one more helping of the pulse above, so at 2500 a
  // character with 5000 INT is poured three times what the fountain states.
  // Holy Water is what it exists for -- GMS's "HP Recovery is increased by 5%
  // per 2500 INT".
  //
  // The whole of the character's INT counts, their skills' grants included, so
  // it is folded where the total is finally known rather than where the pulse
  // is read. 0 for a fountain that pours the same however clever they are.
  double regen_int_step = 42;
  // Extra EXP every kill yields, as a fraction of what the mob was already
  // worth (0.50 == half again). Summed across the passives granting it, and the
  // only lever in the game that pays in something other than a fight -- what it
  // buys is the time to the next level.
  double exp_pct = 43;
  // Share added to the meso a kill yields (0.20 == +20%). Sums across its
  // sources, and the second lever in the game to pay in something other than a
  // fight -- exp_pct above is the first.
  double meso_pct = 44;
  // Share added to how often a kill drops anything at all (0.20 == a fifth
  // more often), covering the items a mob lists and the meso it carries alike.
  // Sums across its sources, and the third lever to pay in something other
  // than a fight.
  //
  // It moves the CHANCE, where meso_pct above moves the amount. A drop that is
  // already certain cannot be made more certain, so the chance is capped at
  // one -- see MesoDropChance.
  double item_drop_pct = 45;
  // Shield Mastery's, in both books that carry one -- the Bandit's and the
  // White Knight's. Percentage added to the whole of the character's DEF, worn
  // and granted and bought with AP alike, and the last thing to land on it.
  // Ships dead by design: DEF stops paying at a share of the attacking
  // monster's own attack, and a character has passed that cap on their stats
  // alone long before a skill grants any. See DerivedStats::def.
  double def_pct = 46;
  // Resistance to abnormal statuses, on GMS's own scale rather than as a
  // fraction, and to elemental damage as a fraction. Nothing in this game
  // inflicts a status or an element, so nothing reads either -- they are here
  // to keep the wiki's figures with the skill, and the stats page shows them so
  // the player can see what they bought.
  double status_resistance = 47;
  double elemental_resistance = 48;
  // --- From here down, one job line apiece. See the message comment. ---
  // The Fighter's. Attack per Combo Orb the character is carrying, for a skill
  // that surrounds them with orbs. The orbs are assumed full, so what this is
  // worth is this times the orbs the character has -- stated per orb rather
  // than as the product because a later skill raises the count and only the
  // count. See Skill.combo_orbs.
  int32 attack_per_combo_orb = 100;
  // The Crusader's, and the same bargain per orb as the field above.
  double final_dmg_pct_per_combo_orb = 101;
  // The Hero's, and the same bargain again: boss damage per orb, and DEF per
  // orb. The DEF one ships dead for the reason def_pct does -- a 4th job has
  // passed the cap on their stats alone -- and is written per orb rather than
  // as its product so that it says what GMS says.
  double boss_pct_per_combo_orb = 112;
  int32 def_per_combo_orb = 113;
  // The Magician's. Share of incoming damage that comes out of MP rather than
  // HP. Nothing tracks MP, so it lands as plain reduction alongside
  // damage_taken_pct.
  double damage_to_mp_pct = 102;
  // The Fighter's. Share of a hit taken that is dealt straight back to whatever
  // landed it (1.20 == 120% of the damage received). Measured against what the
  // character actually loses, so their own defences cut the reflection with it.
  double damage_reflect_pct = 103;
  // The Chief Bandit's. Pick Pocket. Chance a meso falls out of an enemy,
  // rolled once per LINE the swing lands on them (0.30 == 30%) -- so a
  // four-line swing across eight enemies rolls thirty-two times. GMS states
  // one meso a proc and never states what one is worth, and its own hyper
  // enhancement raises the chance and the count and nothing else: a meso here
  // is a unit of ammunition, not money.
  //
  // Only the character's own swings drop them, and only the ones they chose to
  // swing -- not a summon's pulse, not a Final Attack, not a shadow's copy,
  // and not a skill on a clock of its own.
  double meso_drop_chance = 104;
  // The share of that chance one SWING gives up (0.50 == it shakes coins loose
  // half as often). GMS halves Pick Pocket for Cruel Stab, which would
  // otherwise pay a Shadower more for mobbing than for anything else they do.
  //
  // A share rather than a number of points, so it is exactly half at every
  // level of Pick Pocket rather than only at the top of it. Read off the skill
  // being swung and nowhere else -- it never folds into the character, and a
  // skill that is not an attack states it for nobody.
  //
  // Neither of its neighbours: meso_drop_chance above is what grants the
  // chance, and meso_pct below is what a KILL pays into the purse.
  double meso_drop_cut = 105;
  // The Chief Bandit's. Meso Explosion. What ONE LINE of a thrown meso deals
  // (1.00 == 100%); the skill's `lines` says how many a meso is worth.
  //
  // Nothing is spent to throw them. They are the mesos on the ground that Pick
  // Pocket knocked loose, never the ones in the player's purse, so what the
  // pair really trades is coins the character would never have picked up.
  double meso_hit_pct = 106;
  // The Dark Knight's. Final Pact. Seconds a character waits between one
  // revival and the next; anything above 0 says the skill revives them at all.
  // A hit that would kill them fills the pool back up instead, and the fight
  // carries on where it stood.
  //
  // Held here rather than in Skill.cooldown_seconds, which is a flat field: a
  // GMS pact shortens its own wait as it is levelled, and this one walks 1103
  // seconds down to 900. Two skills granting it would leave the shorter wait
  // standing rather than adding two chances.
  double revive_cooldown_seconds = 107;
  // Seconds off that wait, summed across the skills granting it and taken
  // once the shortest pact above has been chosen. The Dark Knight's Final
  // Pact - Reduce Cooldown is the only one: GMS shortens the wait by defeating
  // enemies after a revival, which this game has no window to count, so the
  // hyper simply pays the seconds.
  //
  // Never to nothing: a wait of 0 is what says a character is not revived at
  // all, so the cut stops a second short of it.
  double revive_cooldown_cut_seconds = 111;
  // The Priest's. Lifts every abnormal condition on the character. Nothing
  // inflicts one yet, so nothing reads it -- but it is the whole of what Dispel
  // does, and a skill page calling that skill empty would be saying the game
  // has no plans for it. The boss that needs it is what it waits for.
  bool cures_conditions = 108;
  // The I/L Magician's. Freezing Crush. What one Freeze Stack the character is
  // holding is worth: critical damage on any swing they make, and final damage
  // on the lightning swing that spends it. See Skill.freeze_stack_cap.
  double crit_dmg_per_freeze_stack = 109;
  double final_dmg_pct_per_freeze_stack = 110;
  // Glacial Fury's, and the pile it deepens is Freezing Crush's: stacks added
  // to the cap while this stands, and the magic attack each held stack is
  // worth to an ice swing. Neither means anything without a cap to raise --
  // the mechanism is Freezing Crush's, and a character who has not learned it
  // holds no stacks to pay for.
  int32 freeze_stack_cap_bonus = 114;
  int32 magic_attack_per_freeze_stack = 115;
  // Shatter's. Enemy defence ignored for every Freeze Stack the character is
  // holding, on any swing they make -- a frozen enemy is frozen whichever
  // element is hitting it. Combines with the rest of what they ignore the way
  // two sources always do, and is worth nothing against a monster whose defence
  // was already cancelled.
  double ied_pct_per_freeze_stack = 117;
  // Scarring Sword's. Chance ONE LINE of a swing leaves the enemy it lands on
  // SCARRED, and how long the scar stands. GMS calls it piercing the enemy;
  // the word is taken from the skill instead, since a pierce here is already
  // what an arrow does to a row of monsters.
  //
  // A scar is the second status this game tracks, after a freeze, and it
  // rides the monster the same way -- see QueuedMob::scarred_left_seconds.
  // Only the character's own swings leave one.
  double scar_chance = 118;
  double scar_seconds = 119;
  // Chance Attack's. Final damage on every line landed on a scarred monster.
  // Binary, as final_dmg_pct_when_frozen is: a scar is a scar, and a second
  // one over it says nothing.
  double final_dmg_pct_when_scarred = 120;
  // Scarring Sword's other half. Share off the ATTACK of a monster that is
  // scarred, on top of whatever enemy_attack_pct already takes off every
  // monster -- the same bargain that field makes, and it weakens the mob
  // before its hit is rolled.
  double enemy_attack_pct_when_scarred = 121;
  // Gungnir's Descent's. Flat damage EACH LINE adds, as a share of the
  // character's own Max HP (1.10 == 110% of the pool). It lands after the
  // damage chain and nothing multiplies it -- not the critical roll, not the
  // mastery, not the final damage, and not the defence it ignores -- so what
  // it is worth shrinks as a character's damage outgrows their pool.
  //
  // GMS words it "Damage increases by {50+2x}% of Max HP for every attack",
  // and the client gives the skill twelve of them.
  double max_hp_damage_pct = 122;
  // Storm Magic's. Final damage on every swing made while the enemy is frozen,
  // which is what holding any Freeze Stack at all means here -- GMS asks only
  // whether the enemy is under one of a list of conditions, and freezing is the
  // one this game has. So it does not climb with the pile the way the levers
  // above do: one stack lights it and five light it no brighter.
  double final_dmg_pct_when_frozen = 116;
}

// A second attack the same skill makes, on its own clock, beside the swing it
// already is. Arrow Blaster is the case it exists for: one skill the player
// learns once, which they fire by holding the key AND which leaves a turret
// behind firing by itself. Two skills sharing a display name would cost one SP
// ladder and list as two rows; this is one row, one ladder, one page.
//
// A skill may carry several. Revenge of the Evil Eye is the case for that:
// its Evil Eye Shock III lands a volley and then four auras behind it, which
// reach different numbers of enemies and so cannot be one attack.
//
// Read at the same learned level as the skill carrying it.
message AutoMode {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls this half, in both the row stating its reach and
  // the row stating its damage. Two halves sharing a label would say nothing
  // about either, so keep them short and distinct.
  string label = 6;
  // Seconds between its casts, exactly as Skill.cast_interval_seconds. Never
  // scaled by attack speed -- nothing on its own clock is.
  double cast_interval_seconds = 3;
  // How many enemies it reaches, which is its own and not the skill's: the
  // Evil Eye's auras cover 3 where the volley fired with them covers 10.
  int32 max_enemies = 4;
  int32 lines = 5;
}

// The damage a buff itself ticks: a wound, bleeding for as long as the buff
// stands and only then. Puncture is the case it exists for -- GMS's "attacked
// enemies take #dot% damage every #dotInterval sec., for #dotTime sec.", where
// the seconds are the buff's own and the enemies are the ones the swing
// reached.
//
// Not an AutoMode, which is a turret: that fires whether or not anything was
// struck and picks its own targets. This has no reach of its own -- it takes
// the swing's, being the mark that swing left -- and no clock beyond the
// buff's.
//
// GMS words the tick as a chance of a damage: "a 100% chance to take 165%".
// Both fold into skill_pct here, the way a Final Attack's chance and damage
// do, because neither half says anything on its own.
//
// Read at the same learned level as the skill carrying it.
message BuffPulse {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, in its row under the buff's heading.
  string label = 3;
  // Seconds between ticks. Never scaled by attack speed -- nothing on its own
  // clock is.
  double cast_interval_seconds = 4;
  int32 lines = 5;
  // Enemies one strike reaches. 0 leaves it the reach of the swing that laid
  // the buff, which is what a wound wants: the mark is on what was hit.
  int32 max_enemies = 6;
  // Strikes one tick lands, each its own attack of `lines` lines against its
  // own `max_enemies`. Cry Valhalla is what it exists for -- GMS has three
  // sword strikes fall together, 60ms apart, which is one moment here. 0 reads
  // as one, which is every other pulse.
  int32 casts = 7;
  // Ticks one raising of the buff is worth, after which it falls silent for
  // the rest of the window. 0 is a pulse that ticks for as long as the buff
  // stands, which is Puncture's wound. Cry Valhalla's twelve run out at 24
  // seconds of a 30-second buff -- which is why lengthening the buff buys
  // nothing.
  int32 max_pulses = 8;
}

// A buff a skill puts up for a while, on a cooldown of its own: what it grants
// while it is up, how long that is, and what shortens the wait for the next
// one. The skill's own cooldown_seconds is that wait.
//
// Dark Resonance is the case it exists for, and what makes it a mechanism
// rather than another passive is that its duration is SHORTER than its
// cooldown. Cross Surge and Hyper Body are up for as long as a player keeps
// pressing them, so this game simply folds them in as permanent; a buff that
// cannot be permanent has to be modelled, or the game would be handing out
// something GMS never does.
//
// What it grants goes through the same fold every passive does, so its levers
// meet the character's the way two skills' do -- two sources of ignored
// defence combine rather than sum, which is the whole reason a buff cannot be
// a multiplier applied to a damage number after the fact.
//
// Read at the same learned level as the skill carrying it.
// A shell that stands over a character and cancels whole hits, rather than
// taking a share off each of them. Holy Magic Shell is what it exists for:
// GMS blocks a set number of attacks outright and leaves the shell standing
// until either the count or the clock runs out.
//
// GMS exempts attacks that cost a share of the target's Max HP -- almost
// everything a boss throws -- and blunts them instead. Nothing here deals
// damage as a share of the pool, so `Mob.boss` is what says which hits those
// are: a boss's hit is never blocked and costs
// `boss_damage_taken_pct` less, and every other hit is blocked whole.
//
// Read at the same learned level as the skill carrying it.
message Shield {
  // Hits one raising cancels before the shell falls. A double for the reason
  // Dot.max_stacks is one: GMS climbs it faster than a level at a time, and
  // only a fractional step floored where it is read can walk that ladder.
  double hits = 1;
  double hits_per_level = 2;
  // Share of a hit the shell cannot block that it takes off instead (0.10 ==
  // a tenth of it). Multiplies with every other reduction standing, as they
  // all do.
  double boss_damage_taken_pct = 3;
  // Whether one raising covers the whole party or the caster alone. Holy Magic
  // Shell is GMS's party shell; Divine Shield is the White Knight's own skin
  // and shelters nobody else, so it leaves this unset.
  bool party = 4;
}

message Buff {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // Seconds it stays up, climbing the same base + per_level * (L - 1) ladder
  // every other number here climbs.
  double duration_seconds = 3;
  double duration_seconds_per_level = 4;
  // Seconds a landed swing takes off the wait for the next cast. What it buys
  // the player is the reason to swing fast beyond the damage: the buff comes
  // round sooner. 0 for a buff that waits out its whole cooldown.
  double cooldown_reduction_seconds = 5;
  // What the buff bleeds while it stands. Unset for every buff that only
  // grants levers, which is all of them but Puncture's wound.
  BuffPulse pulse = 6;
  // Whether one of these stands over the whole party however many raise it.
  // Epic Adventure is what it exists for: every Explorer has it, it does not
  // stack with itself, and a party casts it in turn rather than all at once.
  //
  // The caster's own wait is untouched -- the page still states it. What
  // changes is how often the buff comes ROUND on them, since a partner's cast
  // covers them too: a party of N takes N turns to come back to the same
  // player, so the buff is up N times as often as one caster could manage.
  //
  // Only a party member holding the skill is covered. That is the whole of the
  // faction rule GMS states -- a Cygnus Knight will never learn an Explorer's
  // Epic Adventure, so nothing has to ask what class anybody is.
  bool party_shared = 8;
  // Lines the character has to land before this goes up, instead of a wait in
  // seconds. Mortal Blow is what it exists for: GMS counts the hits a Ranger
  // lands and pays them a window once the count comes round. Lines landed
  // while it stands do not count, so its uptime is what their firing rate
  // buys. 0 for a buff that waits on a clock, which is every other one.
  int32 charge_lines = 7;
  // What everybody ELSE in the party gets while this stands, read at the
  // caster's level. Smokescreen alone: GMS shelters the party under it, and
  // this hands them a share off what a hit costs instead.
  //
  // Apart from Skill.ally_base, which grants for good. A buff's party half
  // comes and goes on the caster's clock, so it reaches an ally as a window of
  // their own rather than as a passive -- and a 30-second buff behind a
  // 120-second wait folded in as a passive would pay four times over.
  SkillEffect ally_base = 9;
  SkillEffect ally_per_level = 10;
  // The shell this buff stands as, over the caster and the party alike -- one
  // cast, one shell, and everyone under it gets their own count of blocks.
  // Unset for every buff that only grants levers, which is all of them but
  // Holy Magic Shell.
  Shield shield = 11;
}

// A chance a swing has to land harder on one of the enemies it reached, and
// what firing it hands the character back. Mortal Blow is what it exists for:
// GMS's "a 10% chance when attacking to deal 20% increased damage to an enemy,
// recovering 1% of Max HP".
//
// Rolled ONCE for the whole swing rather than once per line, because GMS words
// it "when attacking" -- and per line the recovery would be worth a swing's
// line count of times as much.
//
// The damage is a share of what that one enemy was already taking, unlike a
// Final Attack, which is an extra hit worth its own percent whatever set it
// off. So a harder swing carries a harder proc, which is what "increased
// damage" means.
//
// Read at the same learned level as the skill carrying it.
message Proc {
  // damage_pct is the share added to that enemy's damage; hp_recover_pct is
  // the share of the pool put back. Nothing else here is read.
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  double chance = 3;
  double chance_per_level = 4;
}

// A burn a swing leaves on the enemies it reached: damage on a clock of its
// own, for a while after the swing that lit it. Flame Sweep is what it exists
// for -- GMS's "enemies struck by the flame are burned and take continuous
// damage".
//
// A second cast writes the mark again, so the duration starts over and the
// damage is taken fresh from the character as they stand at that moment -- a
// burn lit under a buff keeps the buffed number for the whole of its life, and
// one lit without it never gains. Where max_stacks allows it the second cast
// also piles another helping on, and the monster burns for both.
//
// Not an AutoMode, which is a turret with a reach of its own, and not a
// BuffPulse, which bleeds for as long as a buff on the CHARACTER stands. This
// rides the monster: it lives and dies with the one it was left on, and one
// that dies burning takes the rest of the burn with it.
//
// Read at the same learned level as the skill carrying it.
message Dot {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // Seconds between ticks. Never scaled by attack speed -- nothing on its own
  // clock is.
  double interval_seconds = 4;
  // Seconds it burns for, from the swing that lit it, on the same
  // base + per_level * (L - 1) ladder every other number here climbs. GMS
  // lengthens several of its poisons as they are levelled.
  double duration_seconds = 5;
  double duration_seconds_per_level = 3;
  int32 lines = 6;
  // Chance it takes hold on each enemy the swing reached (0.30 == 30%). 0 is
  // certainty, which is what a burn a swing simply leaves wants -- only the
  // poison a rogue keeps on their claw is rolled for.
  double chance = 7;
  double chance_per_level = 8;
  // Helpings of it one monster can carry at once, each ticking for the whole
  // damage. A ladder rather than a number because Toxic Venom's count climbs,
  // and floored where it is read: GMS's 2 + floor(L/6) is 2 through level 5, 3
  // through 11 and 4 at 12, which only a fractional step can walk. 0 reads as
  // one, which is every other burn in the game.
  double max_stacks = 9;
  double max_stacks_per_level = 10;
}

// A second hit the same swing lands at the same moment. Divine Mark is the
// case it exists for: the hammer falls and the brand it leaves explodes, and
// GMS prices the two differently -- 420% seven times and 290% five times, with
// only the explosion hitting an ordinary monster harder.
//
// Folded into ONE swing rather than told apart in time, because nothing here
// would do anything with the gap between them. What it buys over simply adding
// the strikes together is that each half keeps its own multiplier and its own
// bonus against ordinary monsters, both of which are per line.
//
// It reaches whatever the swing reached: it is the same swing. It carries none
// of the swing's riders either -- a Final Attack rolls once for the swing, not
// once per hit in it, and a shadow copies the swing it was already copying.
//
// Beside its own multiplier, a hit may crit more often than the rest of the
// swing: `crit_rate` here is ADDED to the character's own for this hit alone.
// GMS only ever states it as certainty -- Raging Blow's "the final two attacks
// are criticals" -- which is a rate of 1.00, and the damage chain already
// holds the total at 1.00 so nothing special has to happen for it. The
// character's critical DAMAGE is untouched: a certain crit is still worth what
// their crits are worth.
//
// Read at the same learned level as the skill carrying it.
message SwingHit {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, under the swing's own Damage row.
  string label = 3;
  int32 lines = 4;
}

// A swing the player HOLDS rather than presses: it pulses while the key is
// down and ends on one bigger strike when they let go. Lightning Orb is what
// it exists for -- an orb that zaps eight enemies every 150ms for up to two
// seconds and then bursts.
//
// The pulse is the skill's own: its damage, its lines, its reach. What is here
// is the clock the pulses fall on, how long the hold can run and what it ends
// with. Skill.base_delay_ms is the SHORTEST hold rather than the whole swing,
// and it alone is scaled by attack speed -- the pulse clock is the skill's own
// rate, exactly as fixed_delay says of a key-down swing.
//
// The enemies are picked when the hold opens and never again. An orb that has
// emptied its targets goes on zapping the space where they stood, so the fight
// lets go the moment another pulse would buy nothing -- which is the whole
// reason the hold has a length to decide at all.
// A swing thrown as single-target strikes scattered over the enemies in reach,
// rather than one strike landing on all of them. It spreads before it doubles
// up, so it is the enemy count that decides how hard any one of them is hit.
//
// Megiddo Flame is what it exists for: GMS throws eleven blue flames, each
// burning one enemy, and a flame landing on an enemy another already reached
// keeps less of its damage. Against a lone boss all eleven land on it, which
// is the whole point of the skill -- read as an ordinary eleven-enemy swing it
// would be worth a fifth of what GMS pays there.
message Scatter {
  // Strikes the cast throws. Each is the skill's own swing landed on one
  // enemy: same multiplier, same lines, same everything but the target count.
  int32 hits = 1;
  // Final damage a strike keeps when it lands on an enemy an earlier strike of
  // the same cast already reached -- GMS's "Final Damage decreases by 55% for
  // subsequent flames", so -0.55. Flat rather than compounding: the third
  // strike on one enemy is worth exactly what the second was.
  //
  // Read the way every other final damage here is, so 0 is a repeat strike
  // worth as much as the first.
  double repeat_final_dmg_pct = 2;
}

message Channel {
  int32 pulse_interval_ms = 1;
  // Pulses a full hold is worth. The hold runs no longer than these take.
  int32 max_pulses = 2;
  // The strike the hold ends on, read exactly as an extra_hit is: its own
  // multiplier and its own lines, landed once however long the hold ran.
  SwingHit finish = 3;
  int32 finish_delay_ms = 4;
  // Share of every hit the player takes that is cancelled while the key is
  // held. The hold is the shelter, so it lasts exactly as long as the hold.
  double damage_taken_pct = 5;
}

// A second attack the same swing sets off, on a wait of its own. Showdown's
// shuriken is the case it exists for: the talisman lands, and once every five
// seconds a dark shuriken goes with it and hunts down its own six enemies.
//
// Not an AutoMode, which fires on its own clock whatever the character is
// swinging -- what makes this different is that a Night Lord holding Quad Star
// never sets it off. The wait is real time, so a faster swing does not buy
// more of them; what a swing is worth counts it at the rate it can sustain.
//
// It reaches its own enemies and lands its own strikes, and it is not the
// character's swing: no Final Attack follows it, no burn rides it, and nothing
// the book aimed at the skill BY NAME reaches it -- GMS's Showdown - Reinforce
// and - Spread both say in so many words that they leave the shuriken alone.
// What the skill itself states is still the strike's, the two being one skill.
message SideStrike {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, over its own damage row.
  string label = 3;
  // 0 for a strike that reaches as far as the swing that set it off.
  int32 max_enemies = 4;
  int32 lines = 5;
  double cooldown_seconds = 6;
}

// A stronger version of a skill's attack, landed in place of every Nth
// ordinary one. Empowered Arrows is the case it exists for: the Sniper's
// Piercing Arrow is upgraded to an Empowered Piercing Arrow every fourth shot.
//
// Which attack it takes the place of is `skill_name` below, falling back on
// Skill::boosts_skill_name -- the same field that names what the permanent half
// of the bonus lands on, so one skill strengthening one other skill is one
// relationship and not two. Leaving both EMPTY means the skill upgrades its own
// attack instead, which is how the F/P Mage's Creeping Toxin detonates the pool
// it is already spreading.
//
// Either clock will carry it. A form on a swing is landed in place of a swing;
// a form on a summon is landed in place of a pulse, and takes that pulse's
// place in the summon's interval rather than getting one of its own.
//
// It replaces the attack rather than adding to it, so four landings are three
// ordinary ones and one of these, never four and a fifth. Read at the same
// learned level as the skill carrying it.
//
// What is counted is ordinarily the swing, so the whole of the fourth one is
// this instead. brands_each_enemy below is the other shape entirely -- a mark
// riding each enemy that goes off ON TOP of the strike that completes it.
message EmpoweredForm {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // The attack this form takes the place of, by display name. Needed only by a
  // skill carrying SEVERAL forms, which Greater Empowered Arrows is: it
  // upgrades every fourth Piercing Arrow II and every fourth Snipe, one 20-level
  // ladder pricing both. Empty falls back on the rule above.
  string skill_name = 7;
  // Swings of the named skill one of these takes the place of: 4 means three
  // ordinary swings, then this. Nothing happens without it.
  int32 casts_per_trigger = 3;
  // How far the form reaches, when that is not how far the attack it stands in
  // for already reaches. Empty takes the attack's own, which is what a form
  // that only hits harder wants -- see AttachEmpoweredForm. Ignored when
  // brands_each_enemy is set, where the form goes exactly as far as the
  // enemies that came due.
  int32 max_enemies = 4;
  int32 lines = 5;
  // Second hits this form lands, exactly as Skill.extra_hit are for a swing:
  // each keeps its own multiplier, its own line count and its own reach.
  // Empowered Piercing Arrow II explodes at the end of its flight, and
  // Empowered Snipe spends the mark Snipe left.
  repeated SwingHit extra_hit = 8;
  // A mark on each enemy the swing strikes rather than a count on the swing.
  // Divine Judgment is what it is for: every Blast marks the enemies it hits,
  // and the mark detonates on the enemy that has taken casts_per_trigger of
  // them. Two things follow, and both are the opposite of the reading above.
  //
  // It ADDS rather than replaces: the enemy that came due takes its ordinary
  // strike and the detonation on top. And the count belongs to the enemy, so
  // one that dies partway there takes it to the grave, and the rest of the
  // swing lands ordinarily beside whoever went off.
  bool brands_each_enemy = 6;
}

// An extra grant that lands only with certain weapons in hand, on top of what
// the skill gives with any weapon it accepts. Weapon Mastery is the case it
// exists for: a Spearman masters a spear and a polearm equally, but only a
// spear swings faster and hits harder for it.
//
// The weapons named here must be ones the skill itself accepts -- a bonus for
// a weapon that lapses the whole skill would never be read.
message WeaponBonus {
  repeated EquipType required_equip_type = 1;
  // Flat, with no per-level counterpart: every GMS bonus of this shape is the
  // same at level 1 as at max. Give it one when one needs it.
  SkillEffect effect = 2;
}

// What one skill hands another by name. Two kinds of grant: the structural
// ones -- strikes, reach, the clock -- and `effect`, a lever aimed at that one
// skill rather than at the character. Greater Vessel of Light is the first
// (a strike to Divine Charge and to Blast, and reach to Divine Charge alone);
// a Hyper Skill's Reinforce is the second.
//
// The structure is folded into a COPY of the target before its attack is
// built, so the damage chain, the line count and the reach all see one skill
// that already carries them. Read at the granting skill's own learned level.
message SkillBoost {
  string skill_name = 1;
  // Strikes added to every swing of the named skill. Flat: every GMS bonus of
  // this shape is +1 however far the granting skill is taught.
  int32 lines = 2;
  // Enemies added to its reach at level 1, and the rate that climbs, read
  // exactly as Skill.lines and Skill.lines_per_level are -- 0.2 is one more
  // enemy every fifth level, which is GMS's ceil(L/5).
  int32 max_enemies = 3;
  double max_enemies_per_level = 4;
  // The swing count a skill clocked by swings landed now fires on, replacing
  // its own rather than adding to it -- GMS says "reduces the strikes required
  // to 7", an absolute. 0 leaves the clock alone, which is what every boost
  // but Speed Mirage II's wants. Where two of them name one skill the faster
  // clock stands, since neither is a quantity that can be summed.
  int32 attacks_per_cast = 5;
  // Share off the named skill's wait (0.30 == it comes back 30% sooner),
  // taken off the whole ladder so the cut is the same share at every level
  // the skill is taught. Heaven's Hammer - Cooldown Cutter is what it exists
  // for -- GMS writes it "Cooldown: -30%".
  //
  // Combines in reverse, as ignored defence does: what two cuts leave is the
  // product of what each leaves, so no pile of them ever reaches nothing.
  double cooldown_pct = 8;
  // Strikes added to each SECOND hit the named skill lands -- its opening hit
  // and every extra hit, in its empowered form as well as its ordinary one.
  // Flat, as `lines` above is. The Marksman's two Extra Strike hypers are what
  // it exists for: GMS adds their attack to the arrow's fragment and to the
  // mark Snipe leaves, both of which are hits beside the swing rather than
  // lines of it.
  //
  // Apart from `lines` because the two are different strikes: a swing whose
  // second hit is priced on its own does not gain one by gaining a line.
  int32 extra_hit_lines = 9;
  // Whether this boost follows the named skill into its empowered form, which
  // is a swing of its own and takes none of what its parent hands the ordinary
  // version by default -- see EmpoweredForm.
  //
  // GMS settles it per hyper. Piercing Arrow - Reinforce names Piercing Arrow,
  // Piercing Arrow II and both empowered forms, so it is set here; Empowered
  // Arrows states its form's damage whole, so it is not.
  bool reaches_empowered_form = 10;
  // Percentage points on the named skill's BURN tick, worth their value once
  // per tick line -- exactly what effect.skill_pct below is to its swing.
  //
  // Apart from that lever because the burn is not the swing. A mark keeps the
  // swing's ignored defence, boss damage and final damage -- BurnFor starts
  // from its stat line, so what a boost hands the swing already reaches the
  // burn -- but it states its own multiplier, so a boost aimed at the tick
  // has to say so. Mist Eruption is what this exists for: GMS raises Poison
  // Mist's continuous damage for good.
  //
  // Read at the granting skill's level, as everything here is.
  double dot_skill_pct = 11;
  double dot_skill_pct_per_level = 12;
  // Seconds added to how long the named skill's burn lasts. Apart from
  // effect{} for the same reason the pair above is: the mark is not the swing,
  // and it states its own clock. Poison Mist - Aftermath is what it exists for
  // -- GMS writes it "Bonus 6 seconds of additional damage".
  //
  // Read at the granting skill's level, and never a share: GMS states seconds.
  double dot_duration_seconds = 13;
  double dot_duration_seconds_per_level = 14;
  // Seconds added to how long the named skill's BUFF stands. Apart from the
  // pair above for the same reason that pair is apart from `effect`: a buff
  // states its own clock, and lengthening it is not a lever it grants. Holy
  // Magic Shell - Persist is what it exists for -- GMS writes it
  // "Duration: +5 sec".
  //
  // Buff Duration then lengthens the whole, the boost having landed first: a
  // share added to the buff's own duration is added to this too, since what
  // stands over the character is one buff of one length.
  double buff_duration_seconds = 15;
  // Hits added to the shell the named skill's buff stands as, and the share it
  // takes off a hit it cannot block. Holy Magic Shell - Extra Guard and
  // - Enhance, which are the only two things in the game that could want
  // either.
  //
  // Both are read at the granting skill's level and land before the shell is
  // built, so one shell is one count of blocks however many hypers deepened
  // it. The share meets the buff's own by summing, unlike the reductions it
  // then multiplies with: the two are one skill's statement of what a boss's
  // hit costs under its shell.
  double shield_hits = 16;
  double shield_boss_damage_taken_pct = 17;
  // Levers the named skill alone carries, on top of its own. Seven are read --
  // skill_pct, damage_pct, boss_pct, ied_pct, crit_rate, final_dmg_pct and
  // final_attack_chance -- and each meets the target's own the way two sources
  // of it always meet: damage and boss damage sum, ignored defence combines in
  // reverse, final damage multiplies. A lever outside those seven is silently
  // dropped, which //src/data_test:skill_test refuses.
  //
  // The two damages are not the same bargain. skill_pct is percentage POINTS
  // on the target's own multiplier, worth its value once per line; damage_pct
  // is a share of the character's damage that only this swing collects, and
  // sums with what their gear and passives already pay. A Hyper Skill's
  // Reinforce is the second -- GMS writes it "Damage: +20%".
  //
  // Not folded into the copy above, because these are not the target's own:
  // ignored defence would sum where it must combine, and the fold happens
  // before the damage chain knows what it is hitting. They ride the SWING --
  // a boost aimed at a passive grants nothing, so a lever meant for the
  // character belongs in the granting skill's own `base`.
  //
  // The exception is a passive carrying a Final Attack, which has something to
  // strengthen without ever swinging: final_attack_chance, damage_pct and
  // skill_pct are folded onto that extra hit instead -- the last as points on
  // the strike's own multiplier, which is what GMS's "Night Lord's Mark
  // Damage: +100% points" is. The Hero's Advanced Final Attack hypers and the
  // Night Lord's Death Star are what it exists for -- see FinalAttackSource.
  //
  // Read at the granting skill's learned level, as `base` and `per_level` are:
  // see effect_per_level.
  SkillEffect effect = 6;
  SkillEffect effect_per_level = 7;
}

// A skill that has to be learned to a level before another can be bought at
// all. GMS states this in the description; here it is structured, because the
// skills tab has to enforce it as well as say it.
//
// `skill_name` is the required skill's display name -- the same key a
// character's learned levels are held under, so the check needs no catalog.
message SkillRequirement {
  string skill_name = 1;
  int32 level = 2;
}

// Static definition of a skill. Loaded from data/skills textprotos at startup,
// keyed by filename stem; the Character's skill_levels map references the skill
// by its display `name`. The effect at learned level L is base + per_level *
// (L - 1), so `base` is the level-1 value and `per_level` the increment beyond.
//
// Numbered in the same two blocks as SkillEffect, by the same test: a general
// mechanism up to 99, one job line's own from 100 up.
message Skill {
  string name = 1;
  SkillKind kind = 2;
  // Flavour text for the inspect screen, taken from the GMS skill and pruned to
  // the effects this game actually has. A skill whose wiki entry boasts of
  // movement speed or an MP cost says neither here, because neither is real to
  // the player reading it.
  string description = 3;
  // Groups this skill belongs to. Recorded so a group survives until something
  // needs it; see SkillTag.
  repeated SkillTag tags = 4;
  // Where this skill sits on its advancement's page, counting from 1. GMS's
  // own order, taken off the wiki's skill list for the job, so a player who
  // knows the class finds the skills where they expect them. Distinct within
  // an advancement; nothing compares it across two.
  //
  // This is the whole of the order. What a skill DOES has no say in where it
  // is listed -- the attacks are not gathered above the passives -- because
  // GMS does not sort that way and a second rule would only fight this one.
  int32 skill_order = 5;

  // The advancement this skill belongs to. Its SP pool buys the skill, and the
  // skills tab groups one page per advancement. Determines the SP stage (see
  // StageForAdvancement).
  JobAdvancement job_advancement = 6;
  int32 max_level = 7;
  // What must be learned first, if anything. Named `required_skill` rather
  // than `requires`, which C++20 has taken for itself.
  SkillRequirement required_skill = 8;
  // Weapon types this skill needs in hand. Empty means any weapon, which is
  // what most skills want -- a swordman's job is decided by the job, not the
  // sword. An attack that names weapons cannot be swung without one; a passive
  // that names them stops granting anything without one, which is how Final
  // Attack demands a sword or an axe.
  repeated EquipType required_equip_type = 9;
  // The swings this skill's Final Attack follows: only an attack carrying this
  // tag sets it off. Unset means every swing does, which is what the warriors'
  // and archers' Final Attacks want -- they are about the weapon in hand, and
  // required_equip_type already says so.
  SkillTag follows_skill_tag = 10;

  SkillEffect base = 11;
  SkillEffect per_level = 12;
  // Levers an ATTACK keeps for good, beside the ones above that ride only the
  // swing stating them. Cruel Stab is what it exists for: GMS writes its final
  // damage under "[Passive Effects]", which is the character's and follows
  // them onto every other swing, and the lever-by-lever split in
  // WithoutSwingLevers cannot tell that from Assassinate's, which does not.
  //
  // Read only on an attack. Every other kind of skill keeps everything it
  // grants already, so a second block would say nothing.
  SkillEffect passive = 26;
  SkillEffect passive_per_level = 27;
  // What the skill grants on top of `base` with particular weapons in hand.
  repeated WeaponBonus weapon_bonus = 13;

  // How many enemies one swing of this attack hits (attack skills). Unset/0 is
  // treated as 1 (single target); the bare poke is likewise 1.
  //
  // GMS's `mobCount` is a CAP, reached only when that many monsters happen to
  // stand inside the attack's hitbox. This fight has no positions, so a swing
  // always hits its cap -- which quietly overpays a skill whose box is small
  // and whose cap is generous. So a cap GMS could not realistically fill is
  // cut to what its own hitbox holds:
  //
  //     reach = floor(box width / 70) * (1 + floor(box height / 250))
  //
  // 70 pixels is about one monster's footprint and 250 is about one storey of
  // a map, so the two factors are "how many stand side by side" and "how many
  // platforms the swing covers". The cut is a floor under GMS's own number,
  // never a lift: a box that holds more than the cap leaves the cap standing.
  //
  // Boxes are `lt`/`rb` in the client's Skill.wz, and the rule reads a box
  // that IS THE WHOLE GROUND the swing covers. Three kinds are not, and keep
  // their cap:
  //
  //   - a projectile carrying no box at all (Flash Blade, Beam Blade);
  //   - a box that travels with its shot -- Arrow Blaster's 120x120 is one
  //     arrow's burst, aimed and swept down a platform, and Energy Bolt's
  //     240x150 goes where the bolt does;
  //   - one tile of a laid area, which the client marks with `areaDotCount`.
  //     Ignite's wall of fire is 80x40 and Creeping Toxin's pool 200x200, both
  //     with twenty of that box laid down.
  //
  // Applied to the warrior, bowman and magician branches on 2026-08-28. A file
  // whose reach was cut says so at the top.
  int32 max_enemies = 14;
  // How many times one swing strikes each enemy it reaches. Damage is
  // skill_pct per line, so a 90% 2-line skill deals 180% to every target.
  // Unset/0 is treated as 1. This is the count at level 1.
  int32 lines = 15;
  // Lines the skill gains per level, as a fraction: a strike is whole, so what
  // this buys is the level the next one arrives at. 1/15 is a line every
  // fifteen levels. See SkillLinesAt.
  double lines_per_level = 23;
  // What an arrow gains for every enemy it has already gone through, as a
  // fraction. It COMPOUNDS: at 0.15 the second enemy the swing reaches takes
  // 1.15 times the first and the sixth takes 1.15^5 = 2.01 times it, which is
  // the doubling GMS names beside the 15%. 0 for every skill that hits all its
  // targets alike, which is all of them but Piercing Arrow.
  //
  // Which enemy an arrow reaches first is arbitrary here -- nothing in this
  // game has a position -- so the swing draws the order at random. Its own
  // lines all land at the same step, the arrow having passed once; the opening
  // hit and the Final Attack are other arrows and take none of it.
  double pierce_gain_pct = 25;
  // How long one swing of this attack takes at average attack speed, in
  // milliseconds: the sum of its animation's frames. GMS keys the delay on the
  // skill, not on the weapon -- a spear and a sword swing the same skill at the
  // same speed, and the weapon has its say through its attack-speed stage
  // instead. See SwingIntervalSeconds for how the stage scales this.
  //
  // Unset takes kDefaultSwingDelayMs, which is what the bare poke swings at.
  // Meaningless for a SKILL_KIND_AUTO_ATTACK, which fires on
  // cast_interval_seconds rather than on the character's swing.
  int32 base_delay_ms = 16;
  // Whether base_delay_ms is the whole story, with no attack-speed stage
  // scaling it. True for GMS's key-down skills -- the ones held rather than
  // pressed, Hurricane and Arrow Blaster among them -- which fire at a fixed
  // rate however fast the weapon swings.
  //
  // A character whose only swing carries this gets nothing from an
  // attack-speed skill, which is the bargain GMS strikes too.
  bool fixed_delay = 19;
  // Seconds this skill is unavailable for after it is used, in GMS scale
  // before the game's own pacing stretches it. A swing with a cooldown is not
  // there to be chosen every time, so the fight falls back on whatever else it
  // has while this one recharges -- which is what lets a skill hit harder than
  // the swing it interrupts without simply replacing it.
  //
  // Not cast_interval_seconds, which is how often a skill that fights on its
  // own goes off by itself. A skill names one or the other, never both.
  double cooldown_seconds = 17;
  // Seconds the wait moves by per level, NEGATIVE for the usual case of a
  // skill that comes back sooner the further it is taught -- Heaven's Hammer
  // walks 29 seconds down to 15. Read together with the field above and only
  // through CooldownAt, which floors the pair at nothing.
  double cooldown_seconds_per_level = 24;
  // Seconds between casts of a SKILL_KIND_AUTO_ATTACK, in GMS scale before the
  // game's own pacing stretches it -- usually the skill's cooldown, since a
  // cooldown skill is one the player would fire the moment it came back.
  // Ignored for every other kind. A skill with no interval never fires.
  double cast_interval_seconds = 18;
  // The other clock a SKILL_KIND_AUTO_ATTACK can run on: swings landed rather
  // than seconds passed. Speed Mirage fires once every four of them.
  //
  // A skill names one clock or the other. Counting attacks rather than seconds
  // is what keeps such a skill worth the same behind a fast swing and a slow
  // one -- and it is the shape GMS states these in, because what the player is
  // being paid for is attacking.
  int32 attacks_per_cast = 20;
  // How many landed swings of THIS attack count as one toward the field above.
  // Unset is one, which is what an ordinary swing is worth.
  //
  // Above one for a swing that lands far faster than the rest: Arrow Blaster
  // fires at 120ms and takes seven, so 28 of them do what 4 ordinary swings
  // do. Without it a rapid swing would set off every counter in the book
  // several times a second. GMS states the rule in exactly this shape --
  // "every 7 hits count as 1 successful strike" -- so it is an integer here
  // rather than the fraction it works out to.
  int32 hits_per_attack_count = 21;
  // Whether granted levels can carry this skill PAST its master level. GMS
  // allows it for 4th job skills and marks each one, so a 4th job skill that
  // maxes at 30 has two levels above it that its own page never describes --
  // they exist only while something is handing levels out.
  //
  // Nothing else changes: SP still buys the skill to its master level and no
  // further. See kLevelsPastMasterLevel.
  bool exceeds_master_level = 22;

  // What this skill grants for a while when it goes up, on the wait
  // cooldown_seconds states. See Buff. The heal a cast hands over at once is
  // the buff's own heal_pct.
  Buff buff = 28;
  // The burn this swing leaves on everything it reached. See Dot.
  Dot dot = 29;
  // The bigger swing this skill puts in the place of every Nth swing of the one
  // it names. Several, because the Marksman's Greater Empowered Arrows upgrades
  // two different swings off one ladder. See EmpoweredForm.
  repeated EmpoweredForm empowered_form = 30;
  // A second hit this swing lands at the same moment, priced on its own. See
  // SwingHit.
  repeated SwingHit extra_hit = 31;

  // The second attack this swing sets off, on a wait of its own. Only
  // Showdown's shuriken.
  SideStrike side_strike = 32;
  // What this skill also does on its own clock, beside being the swing it
  // already is. See AutoMode.
  repeated AutoMode auto_mode = 33;
  // What this skill hands to skills it names: strikes, reach, and levers that
  // one skill alone carries. Repeated because Greater Vessel of Light
  // strengthens two of them and grants each a different thing. See SkillBoost.
  repeated SkillBoost boost = 34;
  // The skill this one's empowered_form upgrades, by display name -- Speed
  // Mirage empowers Wind Arrow. Only a form with no target of its own reads
  // it; a lever aimed at a named skill is a SkillBoost instead.
  //
  // The name rather than a tag, because the grant is to one skill rather than
  // to a family -- follows_skill_tag is the other shape, and the right one
  // whenever more than one swing is meant.
  //
  // Empty on a skill carrying an empowered_form means that form upgrades this
  // skill's own attack. See EmpoweredForm.
  string boosts_skill_name = 35;
  // A skill this one takes the place of, by display name: once both are learned
  // the named skill grants nothing at all. GMS says "boosted to" rather than
  // "increased by" when it means this -- Advanced Combo's final damage per orb
  // replaces Combo Synergy's, and Advanced Final Attack states the whole of the
  // Final Attack it supersedes rather than a delta.
  //
  // Only for a skill whose whole grant is the one being replaced. Where two
  // skills merely overlap, the lever settles it on its own: two masteries are
  // already the better of the two, so a 4th job mastery skill outbids Weapon
  // Mastery without superseding it -- and must not, since Weapon Mastery pays
  // attack speed and critical rate beside it.
  //
  // The superseded skill stays learned and keeps its page. What it stops doing
  // is paying.
  string supersedes_skill_name = 36;
  // How many times the opening hit strikes, on the enemies it picks. Damage is
  // SkillEffect.lead_pct per line, exactly as `lines` reads skill_pct. Unset/0
  // is treated as 1, and means nothing without a lead_pct.
  int32 lead_lines = 37;
  // How many of the enemies the swing reached the opening hit lands on,
  // healthiest first. Unset/0 is treated as 1, which is the Rogue's shape --
  // "strikes one, then detonates in place".
  //
  // Above 1 it stops being an opening hit and becomes the part of a swing that
  // reaches fewer enemies than the rest of it: Piercing Arrow II's fragment
  // bounces off the first enemy onto two of the eight the arrow went through.
  // The same field either way, because the fight does the same thing with it.
  int32 lead_enemies = 38;
  // Whether this skill's Final Attack strikes ONE of the enemies the swing
  // reached rather than each of them. Every Final Attack GMS ships is this
  // shape: the client gives none of them a mobCount or a hitbox, and their
  // readouts name the target they pick -- "attacks the boss with the highest
  // HP first". Read the other way a Final Attack pays once per mob in front
  // of the player, which on a six-enemy swing is six times over.
  //
  // The roll happens once for the whole swing, not once per enemy, so a wide
  // swing is worth no more of it than a narrow one.
  bool final_attack_single_enemy = 39;

  // Whether this skill needs the secondary slot filled. Both Shield Masteries
  // ask for one, and data/equip/secondary now ships thirty of them, so a
  // character without one in hand is granted nothing -- see SkillGearMet.
  bool requires_secondary = 40;
  // The chance this passive gives every swing to land harder on one enemy.
  // Unset for all but Mortal Blow -- see Proc.
  Proc proc = 41;
  // The hold this swing is, if it is one. Only Lightning Orb -- see Channel.
  Channel channel = 48;
  // How this swing scatters, if it does. Only Megiddo Flame -- see Scatter.
  Scatter scatter = 49;

  // What every OTHER member of the party gets out of this skill, read at the
  // caster's level exactly as `base` and `per_level` are. Empty for a skill
  // nobody else benefits from, which is most of them.
  //
  // Held apart from `base` rather than shared with it because the two halves
  // rarely match: Hex of the Evil Eye pays an ally half of what it pays the
  // caster, and Parashock Guard's two halves have nothing in common at all.
  // Where they do match, the file simply says the same thing twice.
  //
  // Read at the ally's own effective level and no further: a level the party
  // granted them does not then raise what they grant back. One pass, or two
  // characters holding Combat Orders would lift each other in a circle.
  SkillEffect ally_base = 42;
  SkillEffect ally_per_level = 43;
  // Whether the skill's own effect needs somebody else in the party. False for
  // every skill but Parashock Guard, which GMS pays the caster only while it
  // is shielding an ally -- so alone it grants nothing.
  bool requires_party = 44;
  // Whether two allies both carrying this skill each pay. False is the buff
  // rule and the default: one Sharp Eyes stands over the party however many
  // archers cast it, and the better of the two is what everyone gets.
  //
  // True only for Blessed Ensemble, which is not a buff at all -- it pays for
  // the company kept, and GMS states it per Cleric in the party.
  bool ally_effect_stacks = 45;
  // Whether this is a Hyper Skill: bought with the character's own pool of
  // Hyper SP rather than their job stage's, listed on a page of its own, and
  // gated on required_level rather than on a skill below it.
  //
  // It still names the 4th-job advancement it belongs to, so a character's
  // book is one question either way. What that makes skill_order distinct
  // within is the PAIR -- an advancement and this flag -- since a hyper page
  // and a 4th job page are two lists.
  bool hyper = 46;
  // The level the skill unlocks at. 0 is every skill whose advancement is the
  // whole gate, which is all of them but a hyper.
  int32 required_level = 47;

  // Whether the player switches this skill on and off, rather than simply
  // holding it. Righteously Indignant is what it exists for: a button that
  // puts the Bishop's Vengeance forms in the place of their Benevolence
  // skills for as long as it is down. The switch is the character's -- see
  // Character.active_skill -- so it survives a save and travels with them.
  //
  // What the toggle itself grants is NOT gated on the switch. GMS marks such a
  // grant "[Passive Effects]", which is permanent once the skill is learned,
  // and the fold already reads a grant off an active skill for that reason.
  // What the switch decides is only which form of each named skill stands.
  bool toggle = 50;
  // The skill this one stands in the place of while `toggle_skill_name` is
  // switched on, by display name. The two are one row in the book: this form
  // takes the other's place on its page, at its skill_order, and is learned to
  // whatever level the player bought the other to.
  //
  // So a form costs no SP of its own, has no place in its book's numbering,
  // and pays nothing into what that book's levels are held to. It must name a
  // skill of its own advancement, or the page it replaces a row on is not the
  // page it is listed with.
  string replaces_skill_name = 51;
  // The toggle that raises this form, by display name. While it is switched
  // off the form grants nothing and offers nothing; while it is on, the skill
  // above stops instead. See DormantSkillNames.
  string toggle_skill_name = 52;
  // How long this swing leaves what it reached FROZEN -- a status that lives on
  // the monster, not the character. A frozen monster is stopped where it
  // stands, so it lands no hit on the player for as long as the ice holds, and
  // it is what Storm Magic, Shatter and Freezing Crush's critical damage all
  // ask about. GMS states the seconds per skill: Cold Beam and Ice Strike both
  // freeze for 8, Frostprey for 3.
  //
  // Not every ice swing freezes: GMS's Frozen Orb slows what it touches and
  // freezes nothing, so this is stated rather than read off the element.
  double freeze_seconds = 53;
  // --- From here down, one job line apiece. See the message comment. ---
  // The Fighter's. How many Combo Orbs this skill surrounds the character with
  // at level 1, and the rate that ring grows -- read exactly as `lines` and
  // `lines_per_level` are, so 0.25 is one more orb every fourth level. A
  // character carries ONE ring however many skills describe it: the largest
  // count wins rather than the sum, which is what lets the Hero's Advanced
  // Combo raise the Fighter's five to ten without replacing the skill that
  // prices them.
  //
  // Meaningless without something reading it -- see
  // SkillEffect::attack_per_combo_orb and final_dmg_pct_per_combo_orb.
  int32 combo_orbs = 100;
  double combo_orbs_per_level = 101;
  // The I/L Magician's. Freeze Stacks the character can hold at once, and so
  // whether they hold any at all: 0 says the mechanism is not learned. An ice
  // swing leaves one per line and a lightning swing spends one per line, and
  // what a held stack is worth is on the same skill -- see
  // SkillEffect::crit_dmg_per_freeze_stack.
  int32 freeze_stack_cap = 102;
}
