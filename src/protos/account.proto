syntax = "proto3";

package ms;

import "src/protos/keybinds.proto";

// What the player owns rather than what one character does: the settings and
// openings every character shares, so a second one starts at level 1 with the
// game already open.
//
// THE RULE for a new field: does a second character start over with it, or
// inherit it? Progress a character earns is theirs; what the player learned or
// set up belongs here.
message Account {
  // What the player has bound their keys to.
  Keybinds keybinds = 1;

  // The highest level and job stage any character has reached, which every
  // level-gated feature is measured against. Written from the characters in
  // the file; the one being played speaks for their own level.
  int32 max_level = 2;
  int32 max_job_stage = 3;

  // What the multiplayer server calls this player, and the token proving the
  // account is theirs. Both are the SERVER's to issue. Account-wide, because
  // it is the player the server knows -- which character they bring is
  // answered every time they connect.
  string multiplayer_account_id = 5;
  string multiplayer_token = 6;

  // Things the player has been shown once and need not be shown again: tabs
  // opened, gold trails walked. The keys are the frontend's -- see
  // chrome.h and progression.cc -- and this only keeps the record.
  repeated string seen_keys = 4;

  // What the player has switched on and off on the Options screen.
  Options options = 7;
}

// The switches the Options screen holds, one field apiece. Every one is
// written so that its default -- an unset field, which is what a save from
// before the option existed has -- is the state the game ships in. A new
// option that ships on has to be phrased as what it turns off.
message Options {
  // Whether the title of the panel holding focus blinks. Off, which is the
  // default, holds the chip lit instead of pulsing it.
  bool panel_title_blink = 1;

  // How loud the music plays on a map and in a boss fight, 0 to 100.
  //
  // These two are optional where every other option is a bare field, and for
  // the rule's own sake rather than against it: the state the game ships in
  // is volume 10, and a bare int32 defaults to 0, which is silence. Presence
  // is what lets an unset field mean the shipped volume.
  optional int32 map_bgm_volume = 2;
  optional int32 boss_bgm_volume = 3;

  // Whether the game picks a preset by what the character is doing -- the
  // first while farming, the second at a boss -- rather than leaving the
  // player to put one in use by hand. Off, which is the default, names the
  // presets by number and hands the choice over: see stat_preset.h.
  bool autoswap_presets = 4;

  // Whether the music plays on shuffle -- a track at random from everything
  // the build carries, rather than the one the map or the boss names. Off,
  // which is the default, leaves the music where the data puts it.
  bool jukebox = 5;
}
