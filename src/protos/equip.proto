syntax = "proto3";

package ms;

enum AttackSpeed {
  ATTACK_SPEED_UNSPECIFIED = 0;
  ATTACK_SPEED_SLOWER = 1;
  ATTACK_SPEED_SLOW_1 = 2;
  ATTACK_SPEED_SLOW_2 = 3;
  ATTACK_SPEED_AVERAGE = 4;
  ATTACK_SPEED_FAST_1 = 5;
  ATTACK_SPEED_FAST_2 = 6;
  ATTACK_SPEED_FASTER = 7;
  ATTACK_SPEED_FASTEST_1 = 8;
  ATTACK_SPEED_FASTEST_2 = 9;
  ATTACK_SPEED_FASTEST_3 = 10;
}

// The specific item type (e.g. one-handed sword, bow). Used to determine
// applicable scrolls, attack animations, and weapon-specific mechanics.
enum EquipType {
  EQUIP_TYPE_UNSPECIFIED = 0;
  EQUIP_TYPE_ONE_HANDED_SWORD = 1;
  EQUIP_TYPE_BOW = 2;
  EQUIP_TYPE_STAFF = 3;
  EQUIP_TYPE_DAGGER = 4;
  EQUIP_TYPE_CLAW = 5;
  EQUIP_TYPE_THROWING_STAR = 6;
  // The 2nd-job warrior weapons. Which of them a character can hold is decided
  // by their skills rather than by the item: a Fighter's Final Attack wants a
  // sword or an axe, a Spearman's a spear or a polearm.
  EQUIP_TYPE_TWO_HANDED_AXE = 7;
  EQUIP_TYPE_SPEAR = 8;
  EQUIP_TYPE_POLEARM = 9;
  EQUIP_TYPE_TWO_HANDED_BLUNT = 10;
  EQUIP_TYPE_TWO_HANDED_SWORD = 11;
  // No item is either of these yet. They exist so a skill that takes a weapon
  // in either hand can say so, rather than naming the half of it that has
  // items -- a Fighter's mastery is of axes, not of two-handed axes.
  EQUIP_TYPE_ONE_HANDED_AXE = 12;
  EQUIP_TYPE_ONE_HANDED_BLUNT = 13;
  // The bowman's other line. Hits harder than a bow of the same level and
  // carries a higher weapon constant; nothing else separates the two here.
  EQUIP_TYPE_CROSSBOW = 14;
  // The off-hand items, one kind per 2nd job. Two of them in the same branch
  // carry identical stats, so the type is the only thing that tells a
  // Fighter's medallion from a Page's rosary -- see AdvancementForSecondary,
  // which is what keeps each one in its own hands.
  EQUIP_TYPE_MEDALLION = 15;
  EQUIP_TYPE_ROSARY = 16;
  EQUIP_TYPE_IRON_CHAIN = 17;
  // One book per magician branch. All three are a "Magic Book" to the player,
  // as they are in GMS; they are three types here because the type is what
  // names the owner, and one type could not name three branches.
  EQUIP_TYPE_MAGIC_BOOK_FIRE_POISON = 18;
  EQUIP_TYPE_MAGIC_BOOK_ICE_LIGHTNING = 19;
  EQUIP_TYPE_MAGIC_BOOK_HOLY = 20;
  EQUIP_TYPE_ARROW_FLETCHING = 21;
  EQUIP_TYPE_BOW_THIMBLE = 22;
  EQUIP_TYPE_CHARM = 23;
  EQUIP_TYPE_DAGGER_SCABBARD = 24;
  // The archer's ammunition, one ladder per weapon. Two types rather than one
  // because the type is what says which weapon draws it, and a bow will not
  // fire a bolt -- see AmmoFor in src/item/projectile.h.
  EQUIP_TYPE_ARROW_FOR_BOW = 25;
  EQUIP_TYPE_ARROW_FOR_CROSSBOW = 26;
}

// The equipment window slot this item occupies when worn. Determines where the
// item appears on the character and enforces one-item-per-slot.
//
// These numbers are what a save names a worn item by, so a slot can be added
// but never moved -- they are the order the slots arrived in, not an order
// anybody reads. The order the equipment window lists them in is kSlotOrder,
// in src/frontend/widgets/equipped_list.cc.
enum EquipSlot {
  EQUIP_SLOT_UNSPECIFIED = 0;
  EQUIP_SLOT_PRIMARY_WEAPON = 1;
  // What the weapon throws: a thief's stars, an archer's arrows. A shield goes
  // in the off hand beside a sword; ammunition is drawn from rather than held,
  // so it gets a slot of its own that a shield will never compete for.
  EQUIP_SLOT_PROJECTILE = 2;
  // The off hand: one of the per-class secondaries a 2nd job carries. Shields
  // would go here too, and none are written. What fills this slot is what
  // Shield Mastery waits on; see Skill.requires_secondary.
  EQUIP_SLOT_SECONDARY = 3;

  // Armour.
  //
  // Top and bottom are separate slots and always will be. An overall covers
  // both for one item's worth of scrolling and star forcing, which is a
  // permanent loss of everything the second item would have carried.
  EQUIP_SLOT_HAT = 4;
  EQUIP_SLOT_TOP = 5;
  EQUIP_SLOT_BOTTOM = 6;
  EQUIP_SLOT_CAPE = 7;
  // The accessories, worn on the face rather than over the body.
  EQUIP_SLOT_FACE_ACCESSORY = 8;
  EQUIP_SLOT_EYE_ACCESSORY = 9;

  // The accessories star force treats as armour a character's Max HP climbs
  // with -- see RaisesMaxHp in src/item/item.h. Nothing is worn in the belt or
  // the shoulderpad yet; the ring and the pendant arrived with Horntail.
  //
  // These two are also the first of the four ring slots and the first of the
  // two pendant slots. The rest are at the bottom of this list.
  EQUIP_SLOT_RING = 10;
  EQUIP_SLOT_PENDANT = 11;
  EQUIP_SLOT_BELT = 12;
  EQUIP_SLOT_SHOULDER = 13;
  // Worn rather than carried, and the one slot with no level on it at all:
  // what goes here is a boss reward a character keeps from the day it drops.
  EQUIP_SLOT_POCKET = 14;
  // Last of the slots that shipped first: a save names a worn item by this
  // number, so it arrived here rather than beside the other accessories.
  // Horntail's earring fills it.
  EQUIP_SLOT_EARRINGS = 15;

  // One slot per Arcane River area, because a character wears one symbol from
  // each and the six do not compete. A slot apiece is what says so: the worn
  // map already allows one item per slot, and nothing else has to enforce it.
  //
  // Numbered in the order the areas open, which is the order the Symbols tab
  // lists them in.
  EQUIP_SLOT_SYMBOL_VANISHING_JOURNEY = 16;
  EQUIP_SLOT_SYMBOL_CHU_CHU_ISLAND = 17;
  EQUIP_SLOT_SYMBOL_LACHELEIN = 18;
  EQUIP_SLOT_SYMBOL_ARCANA = 19;
  EQUIP_SLOT_SYMBOL_MORASS = 20;
  EQUIP_SLOT_SYMBOL_ESFERA = 21;

  // A character wears four rings and two pendants, and any ring fits any of
  // the four -- so an item names EQUIP_SLOT_RING above and is worn in the
  // first of these that is free; see SlotFamily in src/item/item.h. The rule
  // that keeps them apart is that no family holds the same item twice.
  //
  // Numbered here rather than beside the first ring for the same reason:
  // a slot can be added but never moved.
  EQUIP_SLOT_RING_2 = 22;
  EQUIP_SLOT_RING_3 = 23;
  EQUIP_SLOT_RING_4 = 24;
  EQUIP_SLOT_PENDANT_2 = 25;

  // The rest of the worn body. Gloves and shoes are armour a player buys and
  // scrolls; neither is in GMS's Category A, so their stars raise no Max HP,
  // and gloves are scrolled on a shelf of their own that pays attack.
  EQUIP_SLOT_GLOVES = 26;
  EQUIP_SLOT_SHOES = 27;
  // The three trophies: worn for what they say a character has done, and
  // GMS lets no scroll near any of them.
  EQUIP_SLOT_BADGE = 28;
  EQUIP_SLOT_EMBLEM = 29;
  EQUIP_SLOT_MEDAL = 30;
  // Scrolled on its own shelf, which pays the attack the wearer's job swings
  // with. Nothing is worn here yet.
  EQUIP_SLOT_HEART = 31;
}

// A way an item can be made stronger after it drops. Listed on a prototype
// only to say the item refuses it.
enum Upgrade {
  UPGRADE_UNSPECIFIED = 0;
  UPGRADE_SCROLL = 1;
  UPGRADE_STAR_FORCE = 2;
}

// Which job branches can equip this item. UNIVERSAL means any job can equip
// it; BEGINNER includes pre-advancement characters (Noblesse, etc.). Used to
// filter scrolls and enforce equip requirements.
enum EquipJobCategory {
  EQUIP_JOB_CATEGORY_UNSPECIFIED = 0;
  EQUIP_JOB_CATEGORY_WARRIOR = 1;
  EQUIP_JOB_CATEGORY_BOWMAN = 2;
  EQUIP_JOB_CATEGORY_MAGICIAN = 3;
  EQUIP_JOB_CATEGORY_THIEF = 4;
  EQUIP_JOB_CATEGORY_PIRATE = 5;
  EQUIP_JOB_CATEGORY_UNIVERSAL = 6;
  EQUIP_JOB_CATEGORY_BEGINNER = 7;
}

message EquipStats {
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 luk = 4;
  int32 attack = 5;
  int32 magic_attack = 6;
  int32 max_hp = 7;
  int32 max_mp = 8;
  int32 def = 9;
  // Percentage bonus to damage dealt to boss monsters (e.g. 30 = 30%). Read by
  // OffenseStatsFor and applied by ExpectedAttackDamage, against a mob whose
  // `boss` flag is set. No mob in the game sets it yet, so the field is live
  // but nothing it applies to has been written.
  int32 boss_damage = 10;
  // Percentage of enemy defense ignored (e.g. 10 = 10%). Read by
  // OffenseStatsFor and applied by ExpectedAttackDamage against the mob's PDR.
  int32 ignore_enemy_defense = 11;
  // Percentage added to how often a kill drops anything (e.g. 20 = a fifth
  // more often), meso included. Meets what the character's passives grant by
  // summing -- see DerivedStats::item_drop_pct. No equip in the game grants
  // it yet, so the field is live but nothing sets it.
  int32 item_drop_rate = 12;
  // Percentage added to the HP and MP pools (e.g. 10 = a tenth more). Lands
  // over the whole pile the same way a passive's does, and sums with what the
  // character's skills grant -- see DerivedStatsFor. The Dominator Pendant is
  // the one piece that carries them.
  int32 max_hp_pct = 13;
  int32 max_mp_pct = 14;
  // Percentage added to the meso a kill drops (e.g. 20 = a fifth more). The
  // one worn share with a cap of its own: however much of it a character puts
  // on, equipment is worth at most kEquipMesoSoftCap -- see MesoBonus. No
  // equip in the game grants it yet; potentials are where it will come from.
  int32 meso_rate = 15;
}

// What an Arcane Symbol needs beyond an ordinary equip. Only the six symbols
// carry it, so its presence is what tells one from a piece of gear.
message ArcaneSymbolInfo {
  // The leading term of what a level-up costs: 10,000 x floor[(this + 0.1 x
  // level) x duplicates]. Rises by area, from 8 in Vanishing Journey to 18 in
  // Esfera, which is what makes a late symbol the expensive one to raise.
  int32 meso_cost_base = 1;
  // The level the area this symbol comes from opens at: 200 in Vanishing
  // Journey up to 235 in Esfera. A player has one of these from the level
  // they can first reach the map that hands it over.
  int32 area_level = 2;
}

// Static definition of an item type. Loaded from data/ textprotos at startup;
// shared read-only across all EquipInstances of the same item type.
message EquipPrototype {
  string name = 1;
  EquipType equip_type = 2;
  EquipSlot equip_slot = 3;
  AttackSpeed attack_speed = 4;
  int32 required_level = 5;
  repeated EquipJobCategory equip_job_categories = 6;
  EquipStats base_stats = 7;
  int32 upgrade_slots = 8;
  // Upgrade paths this item refuses. Ordinary equipment accepts every path, so
  // a data file carries the exception and the common case needs no line at
  // all. Read it per item, never per equip_type: two throwing stars are not
  // obliged to agree with each other.
  repeated Upgrade unsupported_upgrades = 9;
  // What the shop charges for one of these, in meso. An item joins the shop by
  // naming a price here, so there is no second list to keep in step with this
  // one.
  //
  // Optional because zero is a price rather than a refusal: the Master
  // Adventurer medal is handed out free to anyone who walks up to the counter,
  // and an item that says nothing at all is the one the shop does not stock.
  optional int32 shop_price = 10;
  // What the shop pays for one of these, in meso, when that is not a tenth of
  // shop_price -- the rate GMS itself buys equipment back at, and what a
  // stocked item is worth without saying so. Set only on a piece no shop
  // sells, which names its own price or goes unset and is worth nothing. Ask
  // SellPrice in src/item/item.h rather than this field.
  //
  // Zero is a price rather than a refusal, here as on a stackable: every item
  // can be sold, and one worth nothing is simply thrown away. That is what
  // clears a starter sword out of the bag.
  optional int32 sell_price = 11;
  // The token this is bought with, by data file stem, and how many of it. Both
  // unset for an item the shop sells for meso, which is most of them. An item
  // joins the token shelf by naming a price here, the same way naming a
  // shop_price joins it to the meso shelf.
  string token_item = 12;
  int32 token_price = 13;
  // The set family this item belongs to, e.g. "Frozen Weapon". A set names a
  // family where any one of many items fills the slot -- a weapon belongs to
  // one class, so the set cannot name it. Empty for an item in no set, and for
  // one the set names outright.
  string set_family = 14;
  // Set on the six Arcane Symbols and on nothing else. An item carrying it
  // levels by absorbing duplicates rather than by scrolls or stars, and what
  // it grants comes from its level and the wearer's job -- so its base_stats
  // are empty and SymbolStatsFor answers for it instead.
  ArcaneSymbolInfo arcane_symbol = 15;
}

// Per-instance mutable state for a single drop of equipment. Persisted in the
// save file; references its prototype by name. If trace is true, the item was
// destroyed by star force and lives in equip_tab as a non-equippable trace.
message Equip {
  string equip_name = 1;
  int32 remaining_upgrade_slots = 2;
  int32 scroll_successes = 3;
  EquipStats scroll_stats = 4;
  int32 stars = 5;
  bool trace = 6;
  // An Arcane Symbol's own ladder, and zero on everything else. The level a
  // fresh copy drops at is 1, which SymbolLevel reads off the zero here rather
  // than every drop having to write it.
  int32 symbol_level = 7;
  // Duplicates absorbed toward the next level. Survives a level-up: what is
  // left over after the ladder's price is paid carries into the next rung.
  int32 symbol_exp = 8;
  // Golden hammers driven into this piece, each one an upgrade slot on top of
  // the prototype's. Capped at kMaxHammers. The total the item holds is
  // TotalUpgradeSlots, not upgrade_slots -- see src/item/item.h.
  int32 hammers = 9;
}
