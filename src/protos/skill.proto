syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/equip.proto";

// How a skill folds into the game. Combat is a single expected-damage
// auto-attack, so skills are passive modifiers in one of two roles.
enum SkillKind {
  SKILL_KIND_UNSPECIFIED = 0;
  SKILL_KIND_ATTACK = 1;   // the swing's identity: supplies skill_pct
  SKILL_KIND_PASSIVE = 2;  // folds its levers into the character's stats
  // Cast, but not an attack. It spends the character's swing on something
  // other than damage -- the Cleric's Heal, which they cast in place of a
  // swing when they are low. A cast with no lever behind it is not offered at
  // all: it would take the slot and do nothing.
  SKILL_KIND_ACTIVE = 3;
  // Attacks on its own clock, alongside whatever the character is swinging,
  // rather than being the swing. A summon or a cooldown skill the player would
  // be holding down anyway; see cast_interval_seconds.
  SKILL_KIND_AUTO_ATTACK = 4;
}

// A mark on a skill that some rule outside the skill reads: a group it belongs
// to, a family a later skill asks about. A tag never changes what the skill
// itself does -- that is what SkillEffect is for.
enum SkillTag {
  SKILL_TAG_UNSPECIFIED = 0;
  // The Paladin's Holy Power group. Nothing reads it yet: Vessel of Light, the
  // skill GMS gates on having used one, is permanent here.
  SKILL_TAG_HOLY_POWER = 1;
  // A fire spell. Ignite reads it: the fire mage's Final Attack follows their
  // fire spells and nothing else, so the attacks say which of them burn.
  SKILL_TAG_FIRE = 2;
  // The Cleric's Benevolence group -- the healing half of their kit. Nothing
  // reads it yet: what turns a Benevolence skill into its Vengeance form is a
  // Hyper Skill, which is far above this game's cap.
  SKILL_TAG_BENEVOLENCE = 3;
  // The Hero line's Swordsmanship group -- Brandish and Intrepid Slash, the
  // two swings GMS marks with it. Nothing reads it yet: what reads it in GMS
  // is a 4th job skill, far above this game's cap.
  SKILL_TAG_SWORDSMANSHIP = 4;
}

// A skill's per-level contribution to the character's stats. Only the levers we
// currently model are here; a skill whose real effect is something we don't
// track (speed, jump, ...) simply carries no levers and does nothing. Percents
// are fractions (0.10 == +10%).
//
// Numbered in two blocks. Everything up to 99 is a lever any job could want;
// from 100 up is a lever exactly one job line's book grants, parked out of the
// way so a new class does not thread its one-off through the middle of the
// general ones. Nothing here is ever serialized -- the catalog loads from
// textproto by field NAME and the save refers to skills by display name -- so
// these numbers are free to move, unlike character.proto's.
message SkillEffect {
  // Primary stats, exactly as a worn item grants them.
  int32 str = 1;
  int32 dex = 2;
  int32 int = 3;
  int32 luk = 4;

  // HP and MP pools. The flat per-level amount lands first and the percent
  // scales what it comes to.
  int32 max_hp_per_level = 5;
  double max_hp_pct = 6;
  int32 max_mp_per_level = 7;
  double max_mp_pct = 8;

  int32 attack = 9;  // flat weapon attack, as a worn weapon grants it
  // Percentage added to the whole of the character's attack, worn and granted
  // alike, and the last thing to land on it -- the same bargain def_pct makes
  // with DEF. Unlike that one it pays: attack is the second factor of the
  // damage chain, so 25% here is worth 25% more damage.
  double attack_pct = 24;
  // Flat magic attack, likewise. A magician swings on this where everyone else
  // swings on attack, so the two are separate fields for the same reason a
  // staff's two numbers are: a skill grants one or the other, not both.
  int32 magic_attack = 10;
  double skill_pct = 11;  // damage multiplier (attack skills)
  double crit_rate = 12;  // added chance for a swing to crit
  // Added critical damage (0.05 == +5%), on top of the hidden 0.35 every
  // character crits for. Worth its share of the swings: a crit rate of 20%
  // makes 5% of critical damage worth 1% of damage.
  double crit_dmg = 13;
  int32 attack_speed = 14;  // faster-swing stages, added to the weapon's own
  // Weapon mastery, 0..1: how close the swing's minimum roll comes to its
  // maximum. Unlike everything else here, masteries do not stack -- a
  // character holding two takes the better one, not the sum.
  double mastery = 15;
  // Plain % damage (0.05 == +5%). Every source of it sums inside a single
  // multiplier, so two skills granting 5% come to 10%.
  double damage_pct = 16;
  // Final damage (0.10 == +10%), which multiplies where damage_pct adds: two
  // sources of 10% are worth 21%, not 20%. The distinction is invisible until
  // a second source of either exists, and expensive to unpick afterwards.
  double final_dmg_pct = 17;

  // Final Attack: a chance for the character's swing to be followed by one
  // extra hit, worth final_attack_pct of a plain swing, on each enemy that
  // swing reached. A multi-line final attack folds its lines into the percent
  // -- two hits of 80% is stated here as 1.60.
  //
  // Only the character's own swings carry it. A skill firing on its own clock
  // does not, which is why the two are separate fields rather than one
  // expected value: the chance and the damage are what the player is shown.
  //
  // It rolls separately for every enemy the swing reached, so what it is worth
  // is this against each of them. Which swings set it off belongs to the skill
  // rather than to the level -- see Skill.follows_skill_tag.
  double final_attack_chance = 18;
  double final_attack_pct = 19;

  int32 def = 20;                // flat weapon DEF
  double damage_taken_pct = 21;  // share of incoming damage cancelled
  // Chance an incoming hit misses outright (0.30 == 30%). Not reduction: what
  // it cancels is the whole hit rather than a share of one. The two are still
  // worth the same to an expected-value fight, which is why this multiplies
  // into the damage taken beside them -- what it buys the player that reduction
  // does not is a hit they never took at all, and nothing here can tell.
  double dodge_chance = 22;
  // Share of the monster's DEF this character's attacks ignore (0.25 == 25%).
  // Combines in reverse: what two sources leave the monster is the product of
  // what each leaves it, so 30% and 40% ignore 58% between them and no pile of
  // sources ever reaches all of it. Gear grants the same thing -- see
  // EquipStats::ignore_enemy_defense -- and the two meet the same way.
  //
  // On an ATTACK this rides that attack's own swing and no other; on a passive
  // it rides the character. GMS writes it both ways and means two different
  // things by them. See WithoutSwingLevers.
  double ied_pct = 23;

  // --- From here down, one job line apiece. See the message comment. ---

  // The Cleric's. Share of the HP pool one cast of this skill puts back (1.00
  // == all of it). The one lever spent during a fight rather than folded into
  // the stat line: the character casts it in place of a swing when they are
  // low, and the fight is what reads it. See CombatSim::HealToCast.
  double heal_pct = 100;
  // The Rogue's. Damage multiplier of the harder opening hit some swings land
  // on a single enemy before spreading -- GMS's "strikes one, then detonates
  // in place". Read with Skill.lead_lines, and 0 for the swings that land once.
  double lead_pct = 101;
  // The Fighter's. Attack per Combo Orb the character is carrying, for a skill
  // that surrounds them with orbs. The orbs are assumed full, so what this is
  // worth is this times the orbs the character has -- stated per orb rather
  // than as the product because a later skill raises the count and only the
  // count. See Skill.combo_orbs.
  int32 attack_per_combo_orb = 102;
  // The Crusader's, and the same bargain per orb as the field above.
  double final_dmg_pct_per_combo_orb = 108;
  // The Crusader's. Damage percentage this attack ADDS against anything that
  // is not a boss, per line, exactly as skill_pct is per line -- so a 180%
  // swing carrying 180% here lands 360% on an ordinary monster. GMS states it
  // as percentage POINTS on the skill for that reason, and it is Beam Blade's
  // whole identity. Not the equipment's boss damage in mirror image: that one
  // is a share of the character's damage, and this is a share of one swing's.
  double normal_skill_pct = 109;
  // The Magician's. Share of incoming damage that comes out of MP rather than
  // HP. Nothing tracks MP, so it lands as plain reduction alongside
  // damage_taken_pct.
  double damage_to_mp_pct = 103;
  // The Fighter's. Share of a hit taken that is dealt straight back to whatever
  // landed it (1.20 == 120% of the damage received). Measured against what the
  // character actually loses, so their own defences cut the reflection with it.
  double damage_reflect_pct = 104;
  // The Berserker's. Expected share of the HP pool a landed swing puts back
  // (0.02 == 2%). GMS states it as a chance of a fixed amount; the expectation
  // is what an expected-damage fight can use, so the two are multiplied out
  // here. Unlike heal_pct this costs no swing -- it rides the attack.
  double hp_recover_pct = 105;
  // Shield Mastery's, in both books that carry one -- the Bandit's and the
  // White Knight's. Percentage added to the whole of the character's DEF, worn
  // and granted and bought with AP alike, and the last thing to land on it.
  // Ships dead by design: DEF stops paying at a share of the attacking
  // monster's own attack, and a character has passed that cap on their stats
  // alone long before a skill grants any. See DerivedStats::def.
  double def_pct = 110;
  // The White Knight's. Levels this skill adds to every other skill the
  // character has already learned, held to each one's master level. It never
  // raises the skill granting it, and never teaches one that is unlearned.
  //
  // A double for a lever counted in whole levels, because GMS climbs it in a
  // step -- one level for most of the ladder and two at the top -- which
  // base + per_level * (L - 1) can only walk by carrying the fraction and
  // flooring it where it is read. See EffectiveSkillLevel.
  //
  // A skill marked Skill.exceeds_master_level takes these levels past its own
  // master level; every other skill stops there.
  double skill_level_bonus = 111;
  // The Ranger's. Damage this skill adds to the ONE skill named by
  // Skill.boosts_skill_name, per line, exactly as skill_pct is per line -- so
  // 70% here on a 178% three-line swing makes it 248% three times.
  //
  // Not damage_pct, which lifts everything the character swings. GMS states
  // this in percentage POINTS on the named skill for that reason.
  double boosted_skill_pct = 112;
  // The Priest's. Extra EXP every kill yields, as a fraction of what the mob
  // was already worth (0.50 == half again). Summed across the passives
  // granting it, and the only lever in the game that pays in something other
  // than a fight -- what it buys is the time to the next level.
  double exp_pct = 113;
  // The Priest's. Share of the HP pool one pulse of a fountain puts back, and
  // how many seconds apart the pulses are. Both are read together and only
  // together: what reaches the fight is the rate, so two sources would add
  // their rates rather than their pulses.
  //
  // Unlike heal_pct this costs no swing and asks for nothing -- the fountain
  // stands there whether the character is winning or losing. The interval
  // climbs the ladder downwards, so per_level is negative.
  double regen_pct = 114;
  double regen_interval_seconds = 115;
  // The Hermit's. Share added to the character's damage against a boss and
  // nothing else (0.10 == +10%). Sums with what gear grants, the two being the
  // same quantity from two places.
  //
  // Ships dead, like the resistances below: no mob in the game sets `boss`.
  // The stats page shows it so a player can see what their points and their
  // gear bought, which is more than the equipment's own half ever got.
  //
  // Rides one swing or the character by the same rule ied_pct does: Heaven's
  // Hammer hits a boss 30% harder and hands nothing to the swing after it.
  double boss_pct = 117;
  // The Chief Bandit's. Pick Pocket. Chance a meso falls out of an enemy,
  // rolled once per LINE the swing lands on them (0.30 == 30%) -- so a
  // four-line swing across eight enemies rolls thirty-two times. GMS states
  // one meso a proc and never states what one is worth, and its own hyper
  // enhancement raises the chance and the count and nothing else: a meso here
  // is a unit of ammunition, not money.
  //
  // Only the character's own swings drop them, and only the ones they chose to
  // swing -- not a summon's pulse, not a Final Attack, not a shadow's copy,
  // and not a skill on a clock of its own.
  double meso_drop_chance = 119;
  // The Chief Bandit's. Meso Explosion. What ONE LINE of a thrown meso deals
  // (1.00 == 100%); the skill's `lines` says how many a meso is worth.
  //
  // Nothing is spent to throw them. They are the mesos on the ground that Pick
  // Pocket knocked loose, never the ones in the player's purse, so what the
  // pair really trades is coins the character would never have picked up.
  double meso_hit_pct = 120;
  // The Dark Knight's. Final Pact. Seconds a character waits between one
  // revival and the next; anything above 0 says the skill revives them at all.
  // A hit that would kill them fills the pool back up instead, and the fight
  // carries on where it stood.
  //
  // Held here rather than in Skill.cooldown_seconds, which is a flat field: a
  // GMS pact shortens its own wait as it is levelled, and this one walks 1103
  // seconds down to 900. Two skills granting it would leave the shorter wait
  // standing rather than adding two chances.
  double revive_cooldown_seconds = 123;
  // The Dark Knight's. Maple Warrior. Share of what AP bought that this skill
  // grants back as flat stat, stat by stat (0.15 == 15%): 1000 points of STR
  // and 100 of DEX become 150 and 10. Rounded down, as GMS rounds it.
  //
  // Only what AP bought counts. A ring's STR and another skill's STR are not
  // multiplied by this, which is why it reads the allocation rather than the
  // total -- and what it grants IS a grant like theirs, so a percentage over
  // the character's stats would lift this too.
  double ap_stat_pct = 122;
  // The Chief Bandit's. Share added to the meso a kill yields (0.20 == +20%).
  // Sums across its sources, and the second lever in the game to pay in
  // something other than a fight -- exp_pct above is the first.
  double meso_pct = 121;

  // The Hermit's. Shadow Partner. A shadow copies every line the character's
  // swing lands and strikes again for this share of one (0.70 == 70%), so a
  // three-line swing lands three real lines and three shadow ones.
  //
  // Carried as lines rather than folded into a multiplier, which comes to the
  // same damage: what the player is buying is a second set of hits, and a page
  // that says so is worth the field. Summed across sources, of which there is
  // one.
  //
  // The shadow copies SWINGS. It does not copy a summon's pulse or a Final
  // Attack -- the same line those two are already drawn on in encounter.cc.
  double mirror_line_pct = 118;
  // The Priest's. Lifts every abnormal condition on the character. Nothing
  // inflicts one yet, so nothing reads it -- but it is the whole of what Dispel
  // does, and a skill page calling that skill empty would be saying the game
  // has no plans for it. The boss that needs it is what it waits for.
  bool cures_conditions = 116;
  // The Berserker's. Resistance to abnormal statuses, on GMS's own scale rather
  // than as a fraction, and to elemental damage as a fraction. Nothing in this
  // game inflicts a status or an element, so nothing reads either -- they are
  // here to keep the wiki's figures with the skill, and the stats page shows
  // them so the player can see what they bought.
  double status_resistance = 106;
  double elemental_resistance = 107;
}

// A second attack the same skill makes, on its own clock, beside the swing it
// already is. Arrow Blaster is the case it exists for: one skill the player
// learns once, which they fire by holding the key AND which leaves a turret
// behind firing by itself. Two skills sharing a display name would cost one SP
// ladder and list as two rows; this is one row, one ladder, one page.
//
// A skill may carry several. Revenge of the Evil Eye is the case for that:
// its Evil Eye Shock III lands a volley and then four auras behind it, which
// reach different numbers of enemies and so cannot be one attack.
//
// Read at the same learned level as the skill carrying it.
message AutoMode {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls this half, in both the row stating its reach and
  // the row stating its damage. Two halves sharing a label would say nothing
  // about either, so keep them short and distinct.
  string label = 6;
  // Seconds between its casts, exactly as Skill.cast_interval_seconds. Never
  // scaled by attack speed -- nothing on its own clock is.
  double cast_interval_seconds = 3;
  // How many enemies it reaches, which is its own and not the skill's: the
  // Evil Eye's auras cover 3 where the volley fired with them covers 10.
  int32 max_enemies = 4;
  int32 lines = 5;
}

// A buff a skill puts up for a while, on a cooldown of its own: what it grants
// while it is up, how long that is, and what shortens the wait for the next
// one. The skill's own cooldown_seconds is that wait.
//
// Dark Resonance is the case it exists for, and what makes it a mechanism
// rather than another passive is that its duration is SHORTER than its
// cooldown. Cross Surge and Hyper Body are up for as long as a player keeps
// pressing them, so this game simply folds them in as permanent; a buff that
// cannot be permanent has to be modelled, or the game would be handing out
// something GMS never does.
//
// What it grants goes through the same fold every passive does, so its levers
// meet the character's the way two skills' do -- two sources of ignored
// defence combine rather than sum, which is the whole reason a buff cannot be
// a multiplier applied to a damage number after the fact.
//
// Read at the same learned level as the skill carrying it.
message Buff {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // Seconds it stays up, climbing the same base + per_level * (L - 1) ladder
  // every other number here climbs.
  double duration_seconds = 3;
  double duration_seconds_per_level = 4;
  // Seconds a landed swing takes off the wait for the next cast. What it buys
  // the player is the reason to swing fast beyond the damage: the buff comes
  // round sooner. 0 for a buff that waits out its whole cooldown.
  double cooldown_reduction_seconds = 5;
}

// A second hit the same swing lands at the same moment. Divine Mark is the
// case it exists for: the hammer falls and the brand it leaves explodes, and
// GMS prices the two differently -- 420% seven times and 290% five times, with
// only the explosion hitting an ordinary monster harder.
//
// Folded into ONE swing rather than told apart in time, because nothing here
// would do anything with the gap between them. What it buys over simply adding
// the strikes together is that each half keeps its own multiplier and its own
// bonus against ordinary monsters, both of which are per line.
//
// It reaches whatever the swing reached: it is the same swing. It carries none
// of the swing's riders either -- a Final Attack rolls once for the swing, not
// once per hit in it, and a shadow copies the swing it was already copying.
//
// Read at the same learned level as the skill carrying it.
message SwingHit {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, under the swing's own Damage row.
  string label = 3;
  int32 lines = 4;
}

// A stronger version of a skill's attack, landed in place of every Nth
// ordinary one. Empowered Arrows is the case it exists for: the Sniper's
// Piercing Arrow is upgraded to an Empowered Piercing Arrow every fourth shot.
//
// Which attack it takes the place of is Skill::boosts_skill_name -- the same
// field that names what the permanent half of the bonus lands on, so one skill
// strengthening one other skill is one relationship and not two. Leaving that
// name EMPTY means the skill upgrades its own attack instead, which is how the
// F/P Mage's Creeping Toxin detonates the pool it is already spreading.
//
// Either clock will carry it. A form on a swing is landed in place of a swing;
// a form on a summon is landed in place of a pulse, and takes that pulse's
// place in the summon's interval rather than getting one of its own.
//
// It replaces the attack rather than adding to it, so four landings are three
// ordinary ones and one of these, never four and a fifth. Read at the same
// learned level as the skill carrying it.
//
// What is counted is ordinarily the swing, so the whole of the fourth one is
// this instead. brands_each_enemy below is the other shape entirely -- a mark
// riding each enemy that goes off ON TOP of the strike that completes it.
message EmpoweredForm {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // Swings of the named skill one of these takes the place of: 4 means three
  // ordinary swings, then this. Nothing happens without it.
  int32 casts_per_trigger = 3;
  // Ignored when brands_each_enemy is set, where the form goes exactly as far
  // as the enemies that came due.
  int32 max_enemies = 4;
  int32 lines = 5;
  // A mark on each enemy the swing strikes rather than a count on the swing.
  // Divine Judgment is what it is for: every Blast marks the enemies it hits,
  // and the mark detonates on the enemy that has taken casts_per_trigger of
  // them. Two things follow, and both are the opposite of the reading above.
  //
  // It ADDS rather than replaces: the enemy that came due takes its ordinary
  // strike and the detonation on top. And the count belongs to the enemy, so
  // one that dies partway there takes it to the grave, and the rest of the
  // swing lands ordinarily beside whoever went off.
  bool brands_each_enemy = 6;
}

// An extra grant that lands only with certain weapons in hand, on top of what
// the skill gives with any weapon it accepts. Weapon Mastery is the case it
// exists for: a Spearman masters a spear and a polearm equally, but only a
// spear swings faster and hits harder for it.
//
// The weapons named here must be ones the skill itself accepts -- a bonus for
// a weapon that lapses the whole skill would never be read.
message WeaponBonus {
  repeated EquipType required_equip_type = 1;
  // Flat, with no per-level counterpart: every GMS bonus of this shape is the
  // same at level 1 as at max. Give it one when one needs it.
  SkillEffect effect = 2;
}

// What one skill hands another by name, beyond damage. Greater Vessel of Light
// is the case it exists for: it adds a strike to Divine Charge and to Blast,
// and widens Divine Charge alone.
//
// Damage is deliberately not here. A percentage added to a named skill climbs
// with the level, so it is a lever and lives in SkillEffect as
// boosted_skill_pct beside the others. What is here is structural -- strikes
// and reach -- which no lever can express, because a SkillEffect has no notion
// of a target.
//
// Applied to a COPY of the target before its attack is built, so the damage
// chain, the line count and the reach all see one skill that already carries
// them. Read at the granting skill's own learned level.
message SkillBoost {
  string skill_name = 1;
  // Strikes added to every swing of the named skill. Flat: every GMS bonus of
  // this shape is +1 however far the granting skill is taught.
  int32 lines = 2;
  // Enemies added to its reach at level 1, and the rate that climbs, read
  // exactly as Skill.lines and Skill.lines_per_level are -- 0.2 is one more
  // enemy every fifth level, which is GMS's ceil(L/5).
  int32 max_enemies = 3;
  double max_enemies_per_level = 4;
}

// A skill that has to be learned to a level before another can be bought at
// all. GMS states this in the description; here it is structured, because the
// skills tab has to enforce it as well as say it.
//
// `skill_name` is the required skill's display name -- the same key a
// character's learned levels are held under, so the check needs no catalog.
message SkillRequirement {
  string skill_name = 1;
  int32 level = 2;
}

// Static definition of a skill. Loaded from data/skills textprotos at startup,
// keyed by filename stem; the Character's skill_levels map references the skill
// by its display `name`. The effect at learned level L is base + per_level *
// (L - 1), so `base` is the level-1 value and `per_level` the increment beyond.
//
// Numbered in the same two blocks as SkillEffect: general up to 99, one job
// line's own from 100 up.
message Skill {
  string name = 1;
  SkillKind kind = 2;
  // Flavour text for the inspect screen, taken from the GMS skill and pruned to
  // the effects this game actually has. A skill whose wiki entry boasts of
  // movement speed or an MP cost says neither here, because neither is real to
  // the player reading it.
  string description = 3;
  // Groups this skill belongs to. Recorded so a group survives until something
  // needs it; see SkillTag.
  repeated SkillTag tags = 4;
  // Where this skill sits on its advancement's page, counting from 1. GMS's
  // own order, taken off the wiki's skill list for the job, so a player who
  // knows the class finds the skills where they expect them. Distinct within
  // an advancement; nothing compares it across two.
  //
  // This is the whole of the order. What a skill DOES has no say in where it
  // is listed -- the attacks are not gathered above the passives -- because
  // GMS does not sort that way and a second rule would only fight this one.
  int32 skill_order = 5;

  // The advancement this skill belongs to. Its SP pool buys the skill, and the
  // skills tab groups one page per advancement. Determines the SP stage (see
  // StageForAdvancement).
  JobAdvancement job_advancement = 6;
  int32 max_level = 7;
  // What must be learned first, if anything. Named `required_skill` rather
  // than `requires`, which C++20 has taken for itself.
  SkillRequirement required_skill = 8;
  // Weapon types this skill needs in hand. Empty means any weapon, which is
  // what most skills want -- a swordman's job is decided by the job, not the
  // sword. An attack that names weapons cannot be swung without one; a passive
  // that names them stops granting anything without one, which is how Final
  // Attack demands a sword or an axe.
  repeated EquipType required_equip_type = 9;
  // The swings this skill's Final Attack follows: only an attack carrying this
  // tag sets it off. Unset means every swing does, which is what the warriors'
  // and archers' Final Attacks want -- they are about the weapon in hand, and
  // required_equip_type already says so.
  SkillTag follows_skill_tag = 10;

  SkillEffect base = 11;
  SkillEffect per_level = 12;
  // What the skill grants on top of `base` with particular weapons in hand.
  repeated WeaponBonus weapon_bonus = 13;

  // How many enemies one swing of this attack hits (attack skills). Unset/0 is
  // treated as 1 (single target); the bare poke is likewise 1.
  int32 max_enemies = 14;
  // How many times one swing strikes each enemy it reaches. Damage is
  // skill_pct per line, so a 90% 2-line skill deals 180% to every target.
  // Unset/0 is treated as 1. This is the count at level 1.
  int32 lines = 15;
  // Lines the skill gains per level, as a fraction: a strike is whole, so what
  // this buys is the level the next one arrives at. 1/15 is a line every
  // fifteen levels. See SkillLinesAt.
  double lines_per_level = 23;
  // How long one swing of this attack takes at average attack speed, in
  // milliseconds: the sum of its animation's frames. GMS keys the delay on the
  // skill, not on the weapon -- a spear and a sword swing the same skill at the
  // same speed, and the weapon has its say through its attack-speed stage
  // instead. See SwingIntervalSeconds for how the stage scales this.
  //
  // Unset takes kDefaultSwingDelayMs, which is what the bare poke swings at.
  // Meaningless for a SKILL_KIND_AUTO_ATTACK, which fires on
  // cast_interval_seconds rather than on the character's swing.
  int32 base_delay_ms = 16;
  // Whether base_delay_ms is the whole story, with no attack-speed stage
  // scaling it. True for GMS's key-down skills -- the ones held rather than
  // pressed, Hurricane and Arrow Blaster among them -- which fire at a fixed
  // rate however fast the weapon swings.
  //
  // A character whose only swing carries this gets nothing from an
  // attack-speed skill, which is the bargain GMS strikes too.
  bool fixed_delay = 19;
  // Seconds this skill is unavailable for after it is used, in GMS scale
  // before the game's own pacing stretches it. A swing with a cooldown is not
  // there to be chosen every time, so the fight falls back on whatever else it
  // has while this one recharges -- which is what lets a skill hit harder than
  // the swing it interrupts without simply replacing it.
  //
  // Not cast_interval_seconds, which is how often a skill that fights on its
  // own goes off by itself. A skill names one or the other, never both.
  double cooldown_seconds = 17;
  // Seconds the wait moves by per level, NEGATIVE for the usual case of a
  // skill that comes back sooner the further it is taught -- Heaven's Hammer
  // walks 29 seconds down to 15. Read together with the field above and only
  // through CooldownAt, which floors the pair at nothing.
  double cooldown_seconds_per_level = 24;
  // Seconds between casts of a SKILL_KIND_AUTO_ATTACK, in GMS scale before the
  // game's own pacing stretches it -- usually the skill's cooldown, since a
  // cooldown skill is one the player would fire the moment it came back.
  // Ignored for every other kind. A skill with no interval never fires.
  double cast_interval_seconds = 18;
  // The other clock a SKILL_KIND_AUTO_ATTACK can run on: swings landed rather
  // than seconds passed. Speed Mirage fires once every four of them.
  //
  // A skill names one clock or the other. Counting attacks rather than seconds
  // is what keeps such a skill worth the same behind a fast swing and a slow
  // one -- and it is the shape GMS states these in, because what the player is
  // being paid for is attacking.
  int32 attacks_per_cast = 20;
  // How many landed swings of THIS attack count as one toward the field above.
  // Unset is one, which is what an ordinary swing is worth.
  //
  // Above one for a swing that lands far faster than the rest: Arrow Blaster
  // fires at 120ms and takes seven, so 28 of them do what 4 ordinary swings
  // do. Without it a rapid swing would set off every counter in the book
  // several times a second. GMS states the rule in exactly this shape --
  // "every 7 hits count as 1 successful strike" -- so it is an integer here
  // rather than the fraction it works out to.
  int32 hits_per_attack_count = 21;
  // Whether granted levels can carry this skill PAST its master level. GMS
  // allows it for 4th job skills and marks each one, so a 4th job skill that
  // maxes at 30 has two levels above it that its own page never describes --
  // they exist only while something is handing levels out.
  //
  // Nothing else changes: SP still buys the skill to its master level and no
  // further. See kLevelsPastMasterLevel.
  bool exceeds_master_level = 22;

  // --- From here down, one job line apiece. See the message comment. ---

  // The Page's. Whether this skill needs the secondary slot filled. Nothing in
  // the catalog fills it yet, so a skill asking for one is learnable and grants
  // nothing -- which is what Shield Mastery does until secondaries are written.
  bool requires_secondary = 100;
  // The Rogue's. How many times the opening hit strikes, on the one enemy it
  // picks. Damage is SkillEffect.lead_pct per line, exactly as `lines` reads
  // skill_pct. Unset/0 is treated as 1, and means nothing without a lead_pct.
  int32 lead_lines = 101;
  // The Fighter's. How many Combo Orbs this skill surrounds the character with.
  // Read with SkillEffect::attack_per_combo_orb, and meaningless without it.
  int32 combo_orbs = 102;
  // The Ranger's. Another skill this one strengthens, by display name. What it
  // adds is SkillEffect::boosted_skill_pct, or an empowered_form below, or
  // both -- Speed Mirage empowers Wind Arrow, and nothing else in the game
  // reaches across to a second skill by name.
  //
  // The name rather than a tag, because the grant is to one skill rather than
  // to a family -- follows_skill_tag is the other shape, and the right one
  // whenever more than one swing is meant.
  //
  // Empty on a skill carrying an empowered_form means that form upgrades this
  // skill's own attack. See EmpoweredForm.
  string boosts_skill_name = 103;
  // The Ranger's. What this skill also does on its own clock, beside being the
  // swing it already is. See AutoMode.
  repeated AutoMode auto_mode = 104;
  // The Sniper's. The bigger swing this skill puts in the place of every Nth
  // swing of the one boosts_skill_name names. See EmpoweredForm.
  EmpoweredForm empowered_form = 105;
  // The Dark Knight's. What this skill grants for a while when it goes up, on
  // the wait cooldown_seconds states. See Buff. The heal a cast hands over at
  // once is the buff's own heal_pct.
  Buff buff = 106;
  // The Paladin's. A second hit this swing lands at the same moment, priced on
  // its own. See SwingHit.
  repeated SwingHit extra_hit = 108;
  // The Paladin's. Strikes and reach this skill hands to skills it names.
  // Repeated, unlike boosts_skill_name above, because Greater Vessel of Light
  // strengthens two of them and grants each a different thing. See SkillBoost.
  repeated SkillBoost boost = 107;
  // The Hero's. A skill this one takes the place of, by display name: once
  // both are learned the named skill grants nothing at all. GMS says "boosted
  // to" rather than "increased by" when it means this -- Advanced Combo's
  // final damage per orb replaces Combo Synergy's, and Advanced Final Attack
  // states the whole of the Final Attack it supersedes rather than a delta.
  //
  // Only for a skill whose whole grant is the one being replaced. Where two
  // skills merely overlap, the lever settles it on its own: two masteries are
  // already the better of the two, so a 4th job mastery skill outbids Weapon
  // Mastery without superseding it -- and must not, since Weapon Mastery pays
  // attack speed and critical rate beside it.
  //
  // The superseded skill stays learned and keeps its page. What it stops doing
  // is paying.
  string supersedes_skill_name = 109;
}
