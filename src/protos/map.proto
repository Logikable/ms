syntax = "proto3";

package ms;

import "src/protos/mob.proto";

// A hunting area. Loaded from data/maps textprotos at startup.
message MapData {
  string name = 1;
  // What spawns here. The counts sum to the map's spawn points, which --
  // combined with the fixed 7.56s global respawn tick -- set the full-clear
  // cap: a player who clears instantly tops out at (total count) / 7.56 kills
  // per second.
  repeated Spawn spawns = 2;
}
