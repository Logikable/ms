syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/equip.proto";

// What the client and the server say to each other. Nothing here is written to
// disk, so these field numbers are free to move -- but both ends have to agree
// on them, which is what kMultiplayerVersion in //src/multiplayer:protocol is
// for. Change a message, bump the version, and older clients are turned away
// rather than misread.

// How a party shares what it kills.
enum PartyMode {
  PARTY_MODE_UNSPECIFIED = 0;
  // One boss, one set of drops: the meso and the drop rolls are split by the
  // number of players.
  PARTY_MODE_SHARED = 1;
  // Every player fights their own copy of the boss and is paid as if they
  // came alone.
  PARTY_MODE_SOLO_TOGETHER = 2;
}

// What a player has switched on for a boss fight, on the boss screen's own
// options row. Every member of a party must have the same ones set, or the
// leader is refused -- a fight cannot pay one player and not the next.
message BossOptions {
  // Practice: the fight ignores the reset clock and spends no clear, and in
  // return pays nothing at all.
  bool practice = 1;
}

// One player as everyone else sees them: the character they bring, and the
// account that identifies them across connections.
message PlayerInfo {
  // Issued by the server the first time a player connects, and sent back on
  // every connection after that. Empty in a Hello from a new player.
  string account_id = 1;
  string name = 2;
  int32 level = 3;
  JobAdvancement job = 4;

  // The character as the Inspect screen draws them, built by PublicSheet,
  // which clears everything a party has no business with.
  //
  // Sent WHOLE rather than as a table of figures, so the screen showing it
  // runs the same stat code the owner's panels do. Its items are NAMED, so it
  // means anything only to a client holding the same catalogs -- which is what
  // the protocol version covers. The lobby listing strips it.
  Character sheet = 5;

  // The boss clears this character is holding against the reset clock. Sent
  // apart from the sheet, which strips them: what a party member may see of
  // somebody is one question, and what the server has to know before it lets
  // a party at a daily is another. Stripped from the listing with the sheet.
  repeated BossClear boss_clears = 6;

  // Whether this player has Autoswap Presets on. Beside the sheet rather than
  // in it, because it is the account's switch and not the character's -- but
  // it travels with them, so their sheet is read the way they read it.
  bool autoswap_presets = 7;

  // What they have set on the boss screen's options row, which the server
  // holds every member of a party to.
  BossOptions boss_options = 8;

  // The best level each of their account's OTHER characters has reached on
  // its job line, keyed by that line's second job (as int32, a proto3 map
  // limitation). Beside the sheet for the reason autoswap_presets is: it is
  // the account's climb rather than this character's, and their link skills
  // cannot be read off the sheet alone. See //src/character:link.
  map<int32, int32> link_lines = 9;
}

// One player's place in a party.
message PartyMember {
  PlayerInfo player = 1;
  // Whether they have said they are ready. Cleared for everyone whenever the
  // party's membership or its leader changes, so nobody is carried into a
  // fight on a promise they made about a different party. The leader is
  // always ready and this is not set for them.
  bool ready = 2;
}

// A party waiting in the lobby. It is people and nothing else: the fight is
// named when the leader starts one.
message Party {
  string id = 1;
  // Whose party it is. The leader starts the fight; when they leave, the
  // player who joined first takes it over.
  string leader_account_id = 2;
  repeated PartyMember members = 3;
}

// The first thing a client sends. Carries the character as they stand, since
// they level between connections.
message Hello {
  int32 protocol_version = 1;
  // What the server issued last time, empty for a player it has never seen.
  // The account it names is in player.account_id.
  string token = 2;
  PlayerInfo player = 3;
}

// The character as they stand now, sent when they level or take a new name.
// Without it a party would show who its members were when they joined.
message UpdatePlayer {
  PlayerInfo player = 1;
}

message CreateParty {}

message JoinParty {
  string party_id = 1;
}

message LeaveParty {}

// Leader only. The party leaves the lobby list and the fight begins.
message StartFight {
  // Which fight, as a key into the boss catalog and an index into its
  // difficulties.
  string boss_key = 1;
  int32 difficulty_index = 2;
  PartyMode mode = 3;
  // The leader's own options, which every member's must match.
  BossOptions options = 4;
}

message SetReady {
  bool ready = 1;
}

// Leader only. Both name a member by the account they play under.
message KickMember {
  string account_id = 1;
}

message PromoteMember {
  string account_id = 1;
}

// One line of damage as it landed. `slot` is a place in the phase's ROSTER,
// counted in spawn order, so both ends mean the same monster by the same
// number. The damage is the whole number the player watched fly off, which is
// also what comes off the shared roster -- the two cannot drift.
message FightDamage {
  int32 slot = 1;
  // Shared by every line one attack put on one monster, so a swing of eight
  // reads as one stack of eight rather than eight stacks of one.
  int32 event = 2;
  // What did it, as DamageOrigin and the index inside it -- which summon,
  // which burn. One monster holds at most one stack per player per source.
  int32 origin = 3;
  int32 source_index = 4;
  int64 damage = 5;
  bool crit = 6;
  // Which landing of the event it belongs to, so a swing that slashes twelve
  // times reads as twelve flashes on the watcher's screen too.
  int32 strike = 7;
}

// What one client's fight has landed since it last spoke, and what its player
// is doing. Sent while a fight is on and at no other time.
message FightUpdate {
  repeated FightDamage lines = 1;
  // Which phase these landed in. A report that crosses a phase change is
  // dropped rather than taken off the next phase's roster.
  int32 phase = 2;
  // Which of the phase's player spots this player has walked to. The client
  // walks first and the server says whether the spot was free.
  int32 spot = 3;
  // The swing being charged and how far along it is, for the bar over this
  // player's panel on everyone else's screen.
  string attack_name = 4;
  double attack_fraction = 5;
  // This player's Item Drop Rate, as a fraction. The clear rolls its drops
  // against the best one in the party, the way a party brings one along for
  // everybody.
  double item_drop_pct = 6;
}

// One player as the rest of the party sees them mid-fight.
message FightPlayerState {
  string account_id = 1;
  string name = 2;
  int32 spot = 3;
  // False once their client has gone. They deal no more damage and are paid
  // nothing, and the fight goes on without them.
  bool present = 4;
  string attack_name = 5;
  double attack_fraction = 6;
  // What they have landed since the last of these. A client skips its own:
  // it drew those numbers when it landed them.
  repeated FightDamage lines = 7;
}

// The fight as the server has it, sent to everyone in it about ten times a
// second. The first one a client receives is how it learns the fight has
// begun.
message FightState {
  // What the fight is doing. The ways of being over are in FightEnded.
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    COUNTDOWN = 1;
    FIGHTING = 2;
    PHASE_GAP = 3;
  }
  // Which fight this is, so a client that walked out of one can tell a state
  // still in flight from the party's next fight.
  string fight_id = 9;
  string boss_key = 1;
  int32 difficulty_index = 2;
  Stage stage = 3;
  // Counting from 0, as the difficulty's phases are.
  int32 phase = 4;
  double seconds_left = 5;
  double countdown_left = 6;
  // What every monster of the phase has left, one per slot.
  repeated double hp_fractions = 7;
  repeated FightPlayerState players = 8;
  // The terms the fight was started on. Sent with the fight rather than read
  // off each client's own switch, so a toggle mid-fight cannot change what
  // this one pays.
  BossOptions options = 10;
}

// One item a clear paid this player.
message FightAward {
  // What fell, by data file stem, as MobDrop names it.
  oneof drop {
    string item = 1;   // an ItemPrototype
    string equip = 2;  // an EquipPrototype
  }
  int64 count = 3;
}

// The fight is over. The meso is split by `share_count` and the EXP is not,
// both worked out by each client for itself; the drops are the server's to
// deal, because only it can hand a thing that fell to exactly one player.
message FightEnded {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    CLEARED = 1;
    TIMED_OUT = 2;
    // Every client left. Nobody is paid and nobody's entry is spent.
    ABANDONED = 3;
  }
  Outcome outcome = 1;
  // How many players the fight started with, which is what a clear is split
  // by. A player who leaves does not make the rest richer.
  int32 share_count = 2;
  // What this player won. The server rolls each of the boss's drops once at
  // its stated chance and gives what falls to a random player, so a drop that
  // is certain is certain: rolling per player at a split chance can pay it to
  // nobody.
  repeated FightAward awards = 3;
}

// Walking out of a fight in progress. The player is dropped from it exactly as
// a client that went would be: they deal no more damage, they are paid
// nothing, and the fight goes on for whoever is left.
message LeaveFight {}

// One stack on the table: what it is and how many. Named rather than pointed
// at, as everything crossing the wire is -- an index into a bag the other end
// cannot see means nothing there.
message TradeStack {
  string name = 1;
  int32 count = 2;
}

// What one side of a trade is putting up: the two currencies worth counting,
// and the items. An equip crosses WHOLE, scrolls, stars, hammers and potential
// with it, so the other end rebuilds the drop rather than a fresh copy of the
// prototype it names.
message TradeOffer {
  int64 meso = 1;
  int64 spell_traces = 2;
  repeated Equip equips = 3;
  repeated TradeStack stacks = 4;
}

// Trade with the player named. Both sides send it: the first opens the trade
// and the second joins the one they were asked into, which is why one message
// does both.
message RequestTrade {
  string account_id = 1;
}

// What this player is putting up, whole rather than as a change to it -- two
// changes in flight at once cannot then add up to an offer nobody made.
message SetTradeOffer {
  TradeOffer offer = 1;
}

// Walking out of the trade screen, which ends the trade for both.
message LeaveTrade {}

// Accepting what is on the table, or taking that back.
message AcceptTrade {
  bool accepted = 1;
}

// Answering the finalize dialog. A cancel clears this player's acceptance and
// nothing else: the other side keeps theirs, so one keypress puts the dialog
// back up.
message ConfirmTrade {
  bool confirmed = 1;
}

// The trade this client is in. An empty id means they are in none, which is
// how walking out, being walked out on, and never having traded read alike.
message TradeState {
  string id = 1;
  string partner_account_id = 2;
  string partner_name = 3;
  // False while the other player has been asked and has not yet pressed
  // Trade back. Their panel wears no name until it is true.
  bool partner_joined = 4;
  TradeOffer mine = 5;
  TradeOffer theirs = 6;
  // Whether each side has accepted what is on the table. BOTH are cleared
  // whenever either offer changes, so an accept always means the offer the
  // player was looking at when they gave it.
  bool mine_accepted = 7;
  bool theirs_accepted = 8;
  // Whether this player has confirmed and is waiting on the other. The trade
  // goes through the moment both have, so only one side is ever waiting.
  bool mine_confirmed = 9;
}

// Something worth putting in front of the player wherever they are: the gold
// box in the corner of the screen. One string per line, written to be shown as
// it stands -- the box is small, and nothing on the way to it wraps text.
message Notification {
  repeated string lines = 1;
}

// Who this client has open on the Inspect screen, so the server sends their
// sheet and keeps it fresh. An empty account says the screen has closed. One
// at a time: the screen reads one player.
message WatchPlayer {
  string account_id = 1;
}

// The heartbeat. A session that goes quiet for kSessionTimeout is dropped.
message Ping {}

message ClientMessage {
  oneof kind {
    Hello hello = 1;
    CreateParty create_party = 2;
    JoinParty join_party = 3;
    LeaveParty leave_party = 4;
    StartFight start_fight = 5;
    Ping ping = 6;
    UpdatePlayer update_player = 7;
    SetReady set_ready = 8;
    KickMember kick_member = 9;
    PromoteMember promote_member = 10;
    FightUpdate fight_update = 11;
    LeaveFight leave_fight = 12;
    WatchPlayer watch_player = 13;
    RequestTrade request_trade = 14;
    SetTradeOffer set_trade_offer = 15;
    LeaveTrade leave_trade = 16;
    AcceptTrade accept_trade = 17;
    ConfirmTrade confirm_trade = 18;
  }
}

// The answer to a Hello the server accepted.
message Welcome {
  // The player's account. The same one they sent, or a fresh one for a player
  // the server has never seen.
  string account_id = 1;
  // Sent back on the next connection to prove the account is theirs.
  string token = 2;
}

// Why the server is closing the connection. Its `message` is written to be
// shown to the player as it stands.
message Rejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The client's protocol version is not the server's.
    REASON_UPDATE_REQUIRED = 1;
    // The server is shutting down or has been taken offline.
    REASON_MAINTENANCE = 2;
    // The account and token do not go together.
    REASON_BAD_CREDENTIALS = 3;
    // The client sent something unreadable, or spoke out of turn.
    REASON_MALFORMED = 4;
  }
  Reason reason = 1;
  int32 server_protocol_version = 2;
  string message = 3;
}

// An action the server would not take. The connection stays up.
message Refused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_PARTY_GONE = 1;
    REASON_PARTY_FULL = 2;
    REASON_FIGHT_STARTED = 3;
    REASON_NOT_LEADER = 4;
    REASON_ALREADY_IN_PARTY = 5;
    REASON_NOT_IN_PARTY = 6;
    REASON_UNKNOWN_BOSS = 7;
    // The server is draining before an update and is taking nothing new on.
    REASON_DRAINING = 8;
    // The character is below the level the fight opens at.
    REASON_LEVEL_TOO_LOW = 9;
    // A kick or a promotion named somebody who is not in the party.
    REASON_NOT_A_MEMBER = 10;
    // Somebody in the party has already taken this fight's reward.
    REASON_ALREADY_CLEARED = 11;
    // Somebody in the party has not said they are ready.
    REASON_NOT_READY = 12;
    // The party does not agree on the options the fight is taken under.
    REASON_OPTIONS_DIFFER = 13;
    // The player asked to trade is in a fight or already trading, or the
    // asker is. Nobody is told which: what stands in the way is the other
    // player's own business.
    REASON_BUSY = 14;
    // They went offline between the menu opening and Enter.
    REASON_PLAYER_GONE = 15;
  }
  Reason reason = 1;
  string message = 2;
}

// Every party open to be joined. Pushed whenever the list changes, so no
// client has to ask.
message PartyList {
  repeated Party parties = 1;
}

// Everyone connected, as the Players list draws them. Pushed whenever the
// roster changes, in the order the players arrived.
//
// Without their sheets, the way the party listing goes without them: a client
// sends a fresh sheet whenever its character moves, and a roster carrying
// every sheet would send all of them to everybody. WatchPlayer asks for one.
message OnlinePlayers {
  repeated PlayerInfo players = 1;
}

// The player this client is watching, whole. Sent when the watch starts and
// again whenever their character changes under the reader.
message PlayerSheet {
  PlayerInfo player = 1;
}

// The party this client is in. An empty `party` means they are in none, which
// is how leaving, being closed on, and never having joined all read alike.
message PartyState {
  Party party = 1;
}

// Something that happened to this player's standing in a party, which the
// state after it cannot say on its own: being kicked and walking out both
// arrive as no party at all.
message PartyEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KICKED = 1;
    PROMOTED = 2;
  }
  Kind kind = 1;
  // Written to be shown to the player as it stands.
  string message = 2;
}

// A trade that went through, sent to each side as the trade is torn down.
// What is in it is what this player RECEIVES; what they put up has left them,
// so applying it is taking their own offer off and putting this on.
message TradeCompleted {
  TradeOffer received = 1;
}

message Pong {}

message ServerMessage {
  oneof kind {
    Welcome welcome = 1;
    Rejected rejected = 2;
    Refused refused = 3;
    PartyList party_list = 4;
    PartyState party_state = 5;
    Pong pong = 6;
    PartyEvent party_event = 7;
    FightState fight_state = 8;
    FightEnded fight_ended = 9;
    OnlinePlayers online_players = 10;
    PlayerSheet player_sheet = 11;
    TradeState trade_state = 12;
    Notification notification = 13;
    TradeCompleted trade_completed = 14;
  }
}
