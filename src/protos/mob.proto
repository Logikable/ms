syntax = "proto3";

package ms;

// One item a mob can drop, with its chance per kill.
message MobDrop {
  // What falls, by data file stem. An equip goes one per drop into the equip
  // tab; a full tab loses it, because a queue the player cannot see is worse
  // than a drop they can be told about.
  oneof drop {
    string item = 1;   // an ItemPrototype
    string equip = 2;  // an EquipPrototype
  }
  // Chance each kill takes, e.g. 0.4 for a 40% chance or 0.00025 for one in
  // four thousand. Rolled per kill; a rate above one pays its whole part
  // outright and rolls the rest.
  double per_kill = 3;
}

// Where one monster stands in a boss arena: a cell on a grid `arena_width`
// cells across and `arena_height` down. Nothing here is a column count -- the
// arena stretches to the screen it is drawn on, and what these say is which
// bars sit further apart than which. The dragon's legs are under his wings
// because his sprite puts them there, and the numbers here are what says so.
message ArenaSpot {
  int32 x = 1;
  int32 y = 2;
}

// A mob type and how many of it stand in one encounter. Shared by the maps,
// where the count is a map's spawn points, and by the boss phases, where it is
// how many come out at once.
message Spawn {
  string mob = 1;  // Mob data file, by filename stem.
  // How many come out. A map says it here; a boss phase names a spot per
  // monster below instead and leaves this unset.
  int32 count = 2;
  // Where each of them stands, one spot per monster -- so the spots ARE the
  // count, and a phase cannot write a different number of each. Empty on a
  // map, which has no arena to stand anyone in.
  repeated ArenaSpot spots = 3;
}

// Static definition of a monster type. Loaded from data/mobs textprotos at
// startup; shared read-only across all spawns of the same type.
message Mob {
  string name = 1;
  int32 level = 2;
  int32 attack = 3;
  int64 max_hp = 4;
  int64 exp = 5;
  // Items this mob can drop.
  repeated MobDrop drops = 6;
  // Physical defense rate as a whole percent (PDR); reduces incoming damage
  // unless the attacker ignores it. Snails are 0. Mirrors EquipStats percents.
  int32 pdr = 7;
  // True for bosses: they take 0.5x elemental base and are subject to boss%.
  bool boss = 8;
}
