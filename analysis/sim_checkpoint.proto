syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/equip.proto";

// A climb saved partway up, so a run asking about higher levels doesn't have to
// replay the lower ones. Not a save file: it holds the sim's own bookkeeping
// alongside the character. A checkpoint from a different build is refused; see
// CheckpointStamp.

// The player's state for one fight.
message CheckpointFight {
  // Boss and difficulty together; see FightKey.
  string fight = 1;
  bool attempted = 2;
  bool cleared_today = 3;
  bool near_miss = 4;
  double retry_at = 5;
  int32 power_at_last_try = 6;
  bool recalled_today = 7;
}

// Totals for one fight: one boss at one difficulty.
message CheckpointBossLog {
  // The key the log stores it under, boss and difficulty together.
  string fight = 1;
  string label = 2;
  string boss = 11;
  int32 difficulty = 8;
  int32 unlock_level = 3;
  int32 attempts = 4;
  int32 clears = 5;
  int32 first_attempt_level = 6;
  int32 first_clear_level = 7;
  double first_clear_seconds = 12;
  double best_done = 13;
  double best_seconds = 9;
  int32 best_power = 10;
}

// One level of the climb, for --detail.
message CheckpointStint {
  int32 level = 1;
  double seconds = 2;
  string map = 3;
  string weapon = 4;
}

// What a line of each type and rank measured, flattened by type then rank as
// AbilityWorth stores it.
message CheckpointWorth {
  repeated double rate = 1 [packed = true];
}

// What one milestone level recorded: when the climb reached it, what the
// character wore, and what they had earned by then. One per kMilestones entry,
// in order.
message CheckpointMilestone {
  // Playtime when the level was reached, or -1 if never reached. Every other
  // field here is read against this.
  double seconds = 1;
  // Total meso the character had been paid, and how much the shop took back.
  int64 meso = 2;
  int64 spent = 3;
  // The weapon's stars and remaining upgrade slots, and how many pieces of each
  // set they wore.
  int32 stars = 4;
  int32 slots = 5;
  int32 frozen = 6;
  int32 boss_set = 7;
  // Total honor the pool had received (what it holds plus what was spent on
  // rerolls), and the two sources that can be named. The remainder came from
  // monster drops.
  int64 honor = 8;
  int64 level_honor = 9;
  int64 boss_honor = 10;
}

// Result for one Frozen token. One per kFrozenTokens entry, in order.
message CheckpointToken {
  // Level it first dropped at, or 0 if it never did.
  int32 level = 1;
  // Kills of mobs that carry it, and the log of the chance that all of them
  // came up empty.
  int64 kills = 2;
  double log_miss = 3;
}

// Both potentials on one worn piece, and its stars and hammers.
message CheckpointSlotPotential {
  EquipSlot slot = 1;
  string item = 2;
  int32 item_level = 3;
  Potential main = 4;
  Potential bonus = 5;
  // Worn only while farming, under a boss piece of its own.
  bool farm = 6;
  int32 stars = 7;
  int32 hammers = 8;
  // A symbol's level, 0 for any other piece.
  int32 symbol_level = 9;
}

// Every worn piece's potentials the first time the climb reached `level`, or,
// with `end` set, where the run stopped.
message CheckpointPotentials {
  int32 level = 1;
  double seconds = 2;
  bool end = 3;
  repeated CheckpointSlotPotential slots = 4;
}

// Everything the tables have collected so far. Mirrors Climb field for field: a
// field added there must be added here.
message CheckpointClimb {
  repeated CheckpointMilestone milestones = 1;
  int64 ability_honor_spent = 11;
  AbilityPreset ability_farming = 12;
  AbilityPreset ability_bossing = 13;
  CheckpointWorth farming_worth = 14;
  CheckpointWorth bossing_worth = 15;
  int32 ten_star_level = 16;
  int32 frozen_set_level = 17;
  repeated CheckpointBossLog bosses = 18;
  repeated int32 frozen_level = 19 [packed = true];
  repeated CheckpointToken tokens = 20;
  repeated CheckpointStint stints = 23;
  repeated CheckpointPotentials potentials = 24;
}

// One alt rung the main took; see AltBought.
message CheckpointAlt {
  int32 line = 1;
  int32 level = 2;
  double at = 3;
  double seconds = 4;
}

// A fight a plan was measured against: boss key and difficulty index.
message CheckpointAim {
  string boss = 1;
  int32 difficulty = 2;
}

// A climb saved at the level the checkpoint was taken.
message SimCheckpoint {
  // The build that wrote it. A file whose stamp doesn't match the running
  // binary is refused.
  string stamp = 1;
  // Which climb this is, so one climb's file is never read for another.
  string branch = 2;
  uint32 seed = 3;
  int32 level = 4;

  Character character = 5;
  string current_map = 6;
  // How many of the branch's advancements have been taken.
  int32 taken = 7;
  int64 earned = 8;
  int64 spent = 9;
  int64 held = 10;
  // The weapon type the scout settled on, and the level it was measured at.
  int32 scout_weapon = 11;
  int32 scout_level = 12;
  double seconds = 13;
  double next_daily = 14;
  double next_look = 15;
  int32 looks_left = 16;
  repeated CheckpointFight fights = 17;
  bool ability_measured = 18;
  // The CombatPower the worth table was measured at; see kRemeasureGrowth.
  int32 ability_power = 25;
  // Both random streams, serialized by their own libraries: the world's, which
  // rolls every drop, and the run's, which decides when the player looks.
  string world_rng = 19;
  string run_rng = 20;

  CheckpointClimb climb = 21;

  // Progress within the level the checkpoint was taken at, so a resumed run
  // continues mid-level rather than from a level boundary it never stopped at.
  double level_began = 22;
  CheckpointStint stint = 23;
  repeated double carry = 24 [packed = true];

  // When each plan was last made from scratch, so a resumed run re-plans at
  // the same looks a full climb does. See MatrixChoice and SpendHyperPoints.
  CheckpointAim ability_aim = 26;
  bool hyper_measured = 27;
  int32 hyper_power = 28;
  CheckpointAim hyper_aim = 29;
  CheckpointWorth hyper_farming = 30;
  CheckpointWorth hyper_bossing = 31;
  bool matrix_planned = 32;
  int32 matrix_power = 33;
  reserved 34;  // matrix_aim, before the matrix keyed on the boss's defence
  double matrix_defence = 39;

  // The alt rungs taken, and the farming seconds still owed to them.
  repeated CheckpointAlt alts = 35;
  double alt_debt = 36;
  double next_alt_look = 37;
  // MatrixMemo's prices, by node name.
  map<string, double> matrix_relative = 38;
}
