syntax = "proto3";

package ms;

import "src/protos/equip.proto";
import "src/protos/skill.proto";

// Every set of equipment in the game. An enum rather than a free-typed name
// because there will only ever be a handful, and the screens that name a set
// should not be able to disagree with the data about its spelling.
enum EquipSetName {
  EQUIP_SET_NAME_UNSPECIFIED = 0;
  EQUIP_SET_NAME_FROZEN = 1;
  EQUIP_SET_NAME_BOSS_ACCESSORY = 2;
}

// What wearing several pieces of one set is worth. Each tier is a SkillEffect
// because a set bonus grants exactly what a passive skill grants -- stats,
// attack, a share of the HP pool, damage, defense ignored -- and everything
// that reads those levers should not have to learn a second shape for them.
message EquipSetTier {
  // Pieces of the set that must be worn for this tier to pay.
  int32 pieces = 1;
  SkillEffect effect = 2;
}

// The pieces that fill one slot of a set, by display name -- the way a save
// names what it holds, because the character carries prototypes rather than
// the catalog keys they were loaded under. More than one where a later boss
// drops an alternate for the same slot; wearing any of them fills it.
message EquipSetItems {
  repeated string name = 1;
}

// One slot of a set and what fills it.
message EquipSetMember {
  EquipSlot slot = 1;
  reserved 2;  // the single `string name` the items below grew out of
  oneof fills {
    EquipSetItems items = 4;
    // What fills the slot when no written item does: a set's weapon belongs to
    // one class, so there is one per class rather than one item. The inspect
    // screen reads it as "Choose 1 <family>", and counts toward nothing until
    // the items are written.
    string family = 3;
  }
}

// A family of equipment that pays for being worn together. Loaded from
// data/sets textprotos at startup.
message EquipSet {
  EquipSetName name = 1;
  // One member per slot, so no slot can count twice. Written in the order the
  // inspect screen lists them.
  repeated EquipSetMember members = 2;
  // Tiers are cumulative: five pieces pay the three, four and five tiers
  // together. Written that way so a tier states what it adds rather than
  // restating everything below it.
  repeated EquipSetTier tiers = 3;
  // How many slots the set spans once every piece of it is written. The tiers
  // are read against this rather than against the members above, because a set
  // arrives before all of its pieces do: the Boss Accessory Set pays at three,
  // five, seven and nine, and two of its nine slots hold an item today.
  int32 complete_pieces = 4;
}
