syntax = "proto3";

package ms;

// One item a mob can drop, with its chance per kill.
message MobDrop {
  // The item that drops, by data file stem. An equip drops one at a time into
  // the equip tab. If the tab is full the drop is lost, because a hidden queue
  // is worse than a drop the player can be told about.
  oneof drop {
    string item = 1;   // an ItemPrototype
    string equip = 2;  // an EquipPrototype
  }
  // Chance per kill, e.g. 0.4 for 40% or 0.00025 for one in four thousand. A
  // rate above one drops the whole part every kill and rolls for the remainder.
  double per_kill = 3;
}

// Where one monster stands in a boss arena: a cell on a grid `arena_width`
// cells wide and `arena_height` tall. These aren't screen columns; the arena
// stretches to fit the screen, so they only set how far apart the bars are
// relative to each other. The dragon's legs are under his wings because his
// sprite has them there, and these numbers encode that.
message ArenaSpot {
  int32 x = 1;
  int32 y = 2;
}

// How a monster moves around a boss arena. Each step is derived from the
// fight's clock, not rolled, so every client draws it in the same place without
// sending anything. It is only visual: a cell blocks nothing. A step never
// lands on a cell the player can stand on, since the arena draws one bar per
// cell.
message ArenaWalk {
  // Milliseconds between steps. 0 means it stands still, as does an unset walk.
  int32 interval_ms = 1;
  // How far one step can move it.
  enum Range {
    RANGE_UNSPECIFIED = 0;
    // Any other cell in the row it spawned on, reached instantly instead of
    // walked to. Only Vellum uses this; he blinks along his floor.
    RANGE_ROW = 1;
    // One cell up, down, left or right. Papulatus roams his whole room.
    RANGE_STEP = 2;
    // One cell left or right along the row it spawned on. Damien and Lotus pace
    // the row above the player and never come down to the floor.
    RANGE_ROW_STEP = 3;
  }
  Range range = 2;
  // An occasional rush across the arena, replacing one ordinary step. Unset
  // means it never dashes; only Damien dashes.
  ArenaDash dash = 3;
  // A jump off its row and back. Unset means it never jumps; only the Guardian
  // Angel Slime jumps.
  ArenaJump jump = 4;
}

// A jump off the row the monster walks and back down to the cell it left. It
// stays where it landed for `hang_ms` and doesn't walk up there, so the cell
// below is always free when it comes back down. Walking resumes one full
// interval after it lands.
message ArenaJump {
  // Milliseconds between jumps. 0 means it never jumps, as does an unset jump.
  // Must be longer than `hang_ms`, or the next jump is due before this one
  // lands.
  int32 interval_ms = 1;
  // The row it jumps to. Usually above its walking row, since arena rows count
  // downwards, but nothing requires that: a monster dropping into a pit is
  // written the same way.
  int32 y = 2;
  // Milliseconds it stays up.
  int32 hang_ms = 3;
}

// A dash: several cells in one direction, much faster than the walk it
// interrupts. It stops early at anything it can't enter (the arena edge or a
// cell the player can stand on), and walking resumes one interval after the
// last cell it reached.
message ArenaDash {
  // Milliseconds between dashes. 0 means it never dashes, as does an unset
  // dash.
  int32 interval_ms = 1;
  // How many cells one dash covers, unless a wall stops it.
  int32 cells = 2;
  // Milliseconds per cell. This is what makes it look like a dash and not a
  // walk. The arena is redrawn every kFightPublishInterval, so a cell faster
  // than that would look like a jump instead of a run.
  int32 step_ms = 3;
}

// A mob type and how many of it appear in one encounter. Used by maps, where
// the count is the map's spawn points, and by boss phases, where it is how many
// appear at once.
message Spawn {
  string mob = 1;  // Mob data file, by filename stem.
  // How many appear. Maps set this; a boss phase lists one spot per monster
  // below and leaves this unset.
  int32 count = 2;
  // Where each monster stands, one spot per monster. The spots are the count,
  // so a phase can't disagree with itself. Empty on a map, which has no arena.
  repeated ArenaSpot spots = 3;
  // How this monster moves around its arena. Unset means it stands still, which
  // is true of most monsters.
  ArenaWalk walk = 4;
}

// The definition of a monster type, loaded from data/mobs at startup and shared
// read-only by every spawn of that type.
message Mob {
  string name = 1;
  int32 level = 2;
  int32 attack = 3;
  int64 max_hp = 4;
  int64 exp = 5;
  // Items this mob can drop.
  repeated MobDrop drops = 6;
  // Physical defense rate as a whole percent (PDR). It reduces incoming damage
  // unless the attacker ignores it, and matches the percents in EquipStats.
  // Every mob file sets at least the standard 10, snails included, so IED is
  // worth something everywhere and not only against bosses. Bosses set higher
  // values.
  int32 pdr = 7;
  // True for bosses: they take half elemental damage at base and boss% applies
  // to them.
  bool boss = 8;
  // The bestiary text, adapted from the wiki's archive entry. Empty for a mob
  // the wiki says nothing about; the inspect panel then shows no description
  // instead of an invented one.
  string description = 9;
}
