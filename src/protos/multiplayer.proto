syntax = "proto3";

package ms;

import "src/protos/character.proto";

// What the client and the server say to each other. Nothing here is written to
// disk, so these field numbers are free to move -- but both ends have to agree
// on them, which is what kMultiplayerVersion in //src/multiplayer:protocol is
// for. Change a message, bump the version, and older clients are turned away
// rather than misread.

// How a party shares what it kills.
enum PartyMode {
  PARTY_MODE_UNSPECIFIED = 0;
  // One boss, one set of drops: the meso and the drop rolls are split by the
  // number of players.
  PARTY_MODE_SHARED = 1;
  // Every player fights their own copy of the boss and is paid as if they
  // came alone.
  PARTY_MODE_SOLO_TOGETHER = 2;
}

// One player as everyone else sees them: the character they bring, and the
// account that identifies them across connections.
message PlayerInfo {
  // Issued by the server the first time a player connects, and sent back on
  // every connection after that. Empty in a Hello from a new player.
  string account_id = 1;
  string name = 2;
  int32 level = 3;
  JobAdvancement job = 4;
}

// A party waiting in the lobby: who is in it, and what they mean to fight.
message Party {
  string id = 1;
  // Which fight, as a key into the boss catalog and an index into its
  // difficulties.
  string boss_key = 2;
  int32 difficulty_index = 3;
  PartyMode mode = 4;
  // Whose party it is. The leader starts the fight; when they leave, the
  // player who joined first takes it over.
  string leader_account_id = 5;
  repeated PlayerInfo members = 6;
}

// The first thing a client sends. Carries the character as they stand, since
// they level between connections.
message Hello {
  int32 protocol_version = 1;
  // What the server issued last time, empty for a player it has never seen.
  // The account it names is in player.account_id.
  string token = 2;
  PlayerInfo player = 3;
}

// The character as they stand now, sent when they level or take a new name.
// Without it a party would show who its members were when they joined.
message UpdatePlayer {
  PlayerInfo player = 1;
}

message CreateParty {
  string boss_key = 1;
  int32 difficulty_index = 2;
  PartyMode mode = 3;
}

message JoinParty {
  string party_id = 1;
}

message LeaveParty {}

// Leader only. The party leaves the lobby list and the fight begins.
message StartFight {}

// The heartbeat. A session that goes quiet for kSessionTimeout is dropped.
message Ping {}

message ClientMessage {
  oneof kind {
    Hello hello = 1;
    CreateParty create_party = 2;
    JoinParty join_party = 3;
    LeaveParty leave_party = 4;
    StartFight start_fight = 5;
    Ping ping = 6;
    UpdatePlayer update_player = 7;
  }
}

// The answer to a Hello the server accepted.
message Welcome {
  // The player's account. The same one they sent, or a fresh one for a player
  // the server has never seen.
  string account_id = 1;
  // Sent back on the next connection to prove the account is theirs.
  string token = 2;
}

// Why the server is closing the connection. Its `message` is written to be
// shown to the player as it stands.
message Rejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The client's protocol version is not the server's.
    REASON_UPDATE_REQUIRED = 1;
    // The server is shutting down or has been taken offline.
    REASON_MAINTENANCE = 2;
    // The account and token do not go together.
    REASON_BAD_CREDENTIALS = 3;
    // The client sent something unreadable, or spoke out of turn.
    REASON_MALFORMED = 4;
  }
  Reason reason = 1;
  int32 server_protocol_version = 2;
  string message = 3;
}

// An action the server would not take. The connection stays up.
message Refused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_PARTY_GONE = 1;
    REASON_PARTY_FULL = 2;
    REASON_FIGHT_STARTED = 3;
    REASON_NOT_LEADER = 4;
    REASON_ALREADY_IN_PARTY = 5;
    REASON_NOT_IN_PARTY = 6;
    REASON_UNKNOWN_BOSS = 7;
    // The server is draining before an update and is taking nothing new on.
    REASON_DRAINING = 8;
    // The character is below the level the fight opens at.
    REASON_LEVEL_TOO_LOW = 9;
  }
  Reason reason = 1;
  string message = 2;
}

// Every party open to be joined. Pushed whenever the list changes, so no
// client has to ask.
message PartyList {
  repeated Party parties = 1;
}

// The party this client is in. An empty `party` means they are in none, which
// is how leaving, being closed on, and never having joined all read alike.
message PartyState {
  Party party = 1;
}

message Pong {}

message ServerMessage {
  oneof kind {
    Welcome welcome = 1;
    Rejected rejected = 2;
    Refused refused = 3;
    PartyList party_list = 4;
    PartyState party_state = 5;
    Pong pong = 6;
  }
}
