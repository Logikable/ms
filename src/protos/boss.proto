syntax = "proto3";

package ms;

import "src/protos/mob.proto";

// How often a boss can be cleared again. The clock turns over at 4am local
// time; see src/character/boss_reset.h.
enum ResetPeriod {
  RESET_PERIOD_UNSPECIFIED = 0;
  RESET_PERIOD_DAILY = 1;
  RESET_PERIOD_WEEKLY = 2;
}

// One stage of a boss fight. The next begins when the last mob of this one
// dies, so a phase is over rather than on a clock.
message BossPhase {
  // What the phase fights, each spawn naming where its monsters stand.
  repeated Spawn spawns = 1;
  // Where the player starts. One of `player_spots` when the phase names any.
  ArenaSpot player = 3;
  // Everywhere the player may stand, this one included. A press moves to the
  // nearest of these strictly that way, so which arrow leads where is the
  // shape of the list rather than anything written down; see
  // NextPlayerSpot in src/combat/boss_run.h. A phase that names none stands
  // the player where `player` says and leaves them there.
  repeated ArenaSpot player_spots = 6;
  // How many cells the arena holds. The room left over is shared out among
  // the gaps, so these decide the margins as much as the spacing: a part in
  // the last cell stands against the edge of the screen. Unset is measured off
  // the spots themselves, which is a phase that wants no margin at all.
  int32 arena_width = 4;
  int32 arena_height = 5;
}

// One difficulty of one boss: what the player fights, how long they have, how
// often they may come back, and what it pays.
message BossDifficulty {
  string name = 1;  // "Normal"
  // Fought in order. Phase 1 of Zakum is his eight arms at once.
  repeated BossPhase phases = 2;
  ResetPeriod reset = 3;
  // Seconds the whole fight is allowed. Running out ends it with no clear.
  int32 time_limit_seconds = 4;
  repeated MobDrop drops = 5;
  // Meso a clear pays, on top of whatever the drops are worth. Zakum's stands
  // in for the Intense Power Crystal GMS drops and everyone sells at once.
  //
  // Flat: the character's Meso% does not touch it, so the rewards list can
  // state one number and be right. The drops beside it do scale with Item
  // Drop Rate, the way a monster's do.
  int64 meso = 6;
  // EXP a clear pays, over what the parts themselves are worth. Horntail's
  // whole reward is here: GMS pays it for the clear rather than for the eight
  // bodies, and says outright that no EXP boost touches it -- so this is flat,
  // as the meso beside it is.
  int64 exp = 8;
  // The level a character has to reach before this difficulty can be entered.
  // Unset means the boss screen's own gate is the only one, which is what a
  // fight a player meets on the day the screen opens wants.
  //
  // Per difficulty rather than per boss: a ladder's rungs open at different
  // levels, and the hard mode of a fight already beaten is the usual next
  // thing a player is waiting for.
  int32 unlock_level = 7;
  // A fight that is written down but not built yet. The screen lists it, dims
  // it, and shows nothing but the HP of each phase -- there is no clock, no
  // reset and no reward to state, because none of them has been decided.
  bool coming_soon = 9;
}

// A boss and every difficulty it can be fought at. Loaded from data/bosses
// textprotos at startup. No level here: it is read off the mobs the phases
// spawn, so the two can never disagree.
message Boss {
  string name = 1;
  repeated BossDifficulty difficulties = 2;
}
