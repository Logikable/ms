syntax = "proto3";

package ms;

import "src/protos/equip.proto";

// Category of a stackable (non-equip) item. Equipment is defined separately by
// EquipPrototype and never stacks.
enum ItemCategory {
  ITEM_CATEGORY_UNSPECIFIED = 0;
  // 1 was USE, a bag tab whose only item was a debug one.
  reserved 1;
  ITEM_CATEGORY_ETC = 2;
}

// The colour of a currency item's mark. The mark's SHAPE says which stage of
// the game the token belongs to, and its colour which piece it buys, so a
// player reads both off one glyph without a legend.
enum CurrencyColor {
  CURRENCY_COLOR_UNSPECIFIED = 0;
  CURRENCY_COLOR_THEME = 1;
  CURRENCY_COLOR_ORANGE = 2;
  CURRENCY_COLOR_PURPLE = 3;
  // The Root Abyss armour, one colour per piece: the three fall in the shop
  // together, so no two of them may read as shades of each other.
  CURRENCY_COLOR_GOLD = 4;
  CURRENCY_COLOR_GREEN = 5;
  CURRENCY_COLOR_PINK = 6;
}

// What a stackable is for, where nothing else about it says so. Naming one of
// these makes the item a CURRENCY: it is counted in the character's purse
// rather than carried on the Etc tab, so it costs no slot and no stack limit
// caps it. An ordinary drop names nothing.
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // The currency scrolls are bought with.
  ITEM_KIND_SPELL_TRACE = 1;
  // A currency a shop takes as payment. Such an item also carries the mark
  // the shop draws it by -- see currency_mark.
  ITEM_KIND_TOKEN = 2;
  // A boss's own drop, one per boss.
  ITEM_KIND_SOUL_SHARD = 3;
}

// Static definition of a stackable item type. Loaded from data/items textprotos
// at startup; shared read-only across all stacks of the same type.
message ItemPrototype {
  string name = 1;
  ItemCategory category = 2;
  // Maximum per-slot stack. 0 means the category default of 200 -- see
  // StackableItem::max_stack. Says nothing about a currency, which is counted
  // in the purse rather than carried and has no ceiling -- see ItemKind.
  int32 max_stack = 3;
  // Meso received when sold to a shop. Zero is a price, not a refusal: every
  // item can be sold, and one worth nothing is simply thrown away. A currency
  // is never sold at all -- it is not in the bag to be put on the counter.
  int32 sell_price = 4;
  // What the item is, in a sentence, for the inspect screen. A stack has no
  // stats to show, so this is the whole of what inspecting one tells you.
  string description = 5;
  // 6 was `effect`, what one copy did when used. Nothing in the game was ever
  // usable but a debug Level-Up item, which is gone.
  reserved 6;
  // Meso one copy costs in the shop. 0 = not stocked. Naming a price here is
  // the whole of how a stackable joins the shop, exactly as it is for equips.
  int32 shop_price = 7;
  // The mark the shop draws where a price is paid in this item, e.g. "●".
  // Empty for an ordinary item, which no price is ever asked in.
  string currency_mark = 8;
  CurrencyColor currency_color = 9;
  // See ItemKind.
  ItemKind kind = 10;
  // For a token, the level of the equipment it buys and the slot that goes in.
  // Together they are the order the bag files the token shelf in: the best
  // gear first, the weapon ahead of the rest of a set, and a token that buys a
  // whole set naming no slot and leading its level.
  //
  // NOT what currency_mark says: the mark is the STAGE of the game the token
  // belongs to, and one stage can cover two levels.
  int32 currency_level = 12;
  EquipSlot currency_slot = 13;
  // What a list calls the item where its own column already says the rest:
  // "Zakum's" under a column headed Soul Shard. Empty means the name does the
  // whole job, which is true of everything but the shards.
  string short_name = 11;
}
