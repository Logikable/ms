syntax = "proto3";

package ms;

import "src/protos/account.proto";
import "src/protos/character.proto";
import "src/protos/keybinds.proto";

// A player's saved game: everything a launch needs to put them back where they
// left off. Binary proto rather than text -- not protection, but so the file
// is not an invitation to edit.
//
// The catalogs are NOT in here: they load from data/ and the save names their
// entries, so a save stays a few kilobytes. A save holds an account and the
// characters on it, and what belongs to which is the question for every field
// added from here on -- see Account for the rule.
//
// Format versions:
//   1  One character. The save held that character beside their map, creation
//      time, playtime and keybinds.
//   2  Many characters. `characters` holds one CharacterSave apiece and
//      `offline_character` says which one the game opens on. Keybinds, the
//      seen-key list and the feature unlocks moved to `account`, shared by
//      every character; the rest stayed with the character. A version 1 save
//      loads as the one character, whose level and job stage seed the
//      account's unlocks.
//   3  The currencies left the bag. Spell traces, the shops' tokens and the
//      bosses' soul shards were stacks on the Etc tab, each costing one of its
//      128 slots; they are balances on `Character.currencies` now. A version 2
//      save is read by folding those stacks into it, which needs the item
//      catalog to say which of them was a currency.
message SaveGame {
  // Bumped when a change to the fields below cannot be read by an older build,
  // so a save from the future is refused rather than misread. Every message
  // reachable from here has load-bearing field numbers: renumbering one
  // silently misreads every save already written. An older version is read by
  // upgrading it -- see //src/save_migration.h.
  int32 format_version = 1;

  // What every character on the save shares.
  Account account = 8;

  // The characters, in the order the player made them.
  repeated CharacterSave characters = 9;

  // The character the game opens on, as an index into `characters`: the one a
  // launch logs into, and the only one an absence pays. NOT whoever was being
  // played when the file was written -- the player says which character farms
  // while the game is closed, on the character select, and playing somebody
  // else does not take it off them. Out of range loads the first.
  int32 offline_character = 10;

  // When this save was written, as seconds since the Unix epoch. The clock
  // offline progress is measured against: the next launch pays the player for
  // the gap between this and the moment they come back, and only the character
  // they load is paid. Wall clock because it has to survive the process
  // ending, which is the one thing a monotonic clock cannot do. Zero -- a save
  // written before the field existed -- credits no absence at all.
  int64 last_seen_unix_seconds = 7;

  // The version 1 layout, which held one character's fields here. See
  // SaveGameV1.
  reserved 2, 3, 4, 5, 6;
}

// One character on the account, and what the save keeps around them: where
// they were standing and the three clocks that are theirs alone.
message CharacterSave {
  Character character = 1;

  // The map being farmed, as a key into the map catalog. Empty means this
  // character was not fighting anywhere.
  string current_map = 2;

  // When this character was started, as seconds since the Unix epoch. Wall
  // clock rather than the monotonic one used for playtime: this is a date to
  // show, not a duration to measure. Zero means a save written before the
  // field existed, which loads as "created now".
  int64 created_unix_seconds = 3;

  // Total seconds with this character in play, across every session. Whole
  // seconds on disk; the running total is kept as a double so that
  // accumulating it a fraction of a second at a time does not truncate away
  // most of it.
  int64 playtime_seconds = 4;

  // When this character was last put into play, as seconds since the Unix
  // epoch. What the character select sorts on, newest first. Zero -- a save
  // written before the field existed -- sorts below every character who has
  // been played since, which is the honest answer: nobody knows when they
  // last were.
  int64 last_played_unix_seconds = 5;
}

// The version 1 save, frozen. Nothing writes it and nothing but the upgrade in
// //src/save_migration.h reads it: it exists so that the bytes of a one
// character save can still be parsed after SaveGame moved on. Its field
// numbers are the numbers version 1 wrote, and must never change.
message SaveGameV1 {
  int32 format_version = 1;
  Character character = 2;
  string current_map = 3;
  int64 created_unix_seconds = 4;
  int64 playtime_seconds = 5;
  Keybinds keybinds = 6;
  int64 last_seen_unix_seconds = 7;
}
