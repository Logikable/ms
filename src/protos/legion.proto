syntax = "proto3";

package ms;

import "src/protos/character.proto";

// A stat Legion points are spent on, in the order KMS's Overdrive screen lists
// them: the eight base stats, then the eight the Legion's rank opens.
enum LegionStat {
  LEGION_STAT_UNSPECIFIED = 0;
  LEGION_STAT_STR = 1;
  LEGION_STAT_DEX = 2;
  LEGION_STAT_INT = 3;
  LEGION_STAT_LUK = 4;
  LEGION_STAT_MAX_HP = 5;
  LEGION_STAT_MAX_MP = 6;
  LEGION_STAT_ATTACK = 7;
  LEGION_STAT_MAGIC_ATTACK = 8;
  LEGION_STAT_STATUS_RESISTANCE = 9;
  LEGION_STAT_EXP = 10;
  LEGION_STAT_CRIT_RATE = 11;
  LEGION_STAT_BOSS_DAMAGE = 12;
  LEGION_STAT_NORMAL_DAMAGE = 13;
  LEGION_STAT_BUFF_DURATION = 14;
  LEGION_STAT_IED = 15;
  LEGION_STAT_CRIT_DAMAGE = 16;
}

// One allocation of Legion points.
message LegionPreset {
  // Points in each stat, keyed by LegionStat. What was spent stays as spent
  // when the Legion's points or caps fall; see //src/character:legion for what
  // is read back.
  map<int32, int32> points = 1;
}

// The account's Legion allocations. Everything else about the Legion (level,
// rank, points, job effects) is read off the characters each time.
message Legion {
  // Three, as the other presets: Farm and Boss while autoswap is on, and a
  // third the player swaps in.
  repeated LegionPreset presets = 1;
  // The preset used while autoswap is off, a StatPreset index.
  int32 slot_in_use = 2;
  // The Legion Artifact's crystals and the Legion Champions; see
  // //src/character:legion_artifact.
  LegionArtifact artifact = 3;
  repeated LegionChampion champions = 4;
}

// A stat a Legion Artifact crystal can raise, in the client's order.
enum ArtifactStat {
  ARTIFACT_STAT_UNSPECIFIED = 0;
  ARTIFACT_STAT_ALL_STATS = 1;
  ARTIFACT_STAT_MAX_HP_MP = 2;
  ARTIFACT_STAT_ATTACK = 3;
  ARTIFACT_STAT_DAMAGE = 4;
  ARTIFACT_STAT_BOSS_DAMAGE = 5;
  ARTIFACT_STAT_IGNORE_DEFENSE = 6;
  ARTIFACT_STAT_BUFF_DURATION = 7;
  ARTIFACT_STAT_COOLDOWN_SKIP = 8;
  ARTIFACT_STAT_MESO = 9;
  ARTIFACT_STAT_ITEM_DROP = 10;
  ARTIFACT_STAT_CRIT_RATE = 11;
  ARTIFACT_STAT_CRIT_DAMAGE = 12;
  ARTIFACT_STAT_EXP = 13;
  ARTIFACT_STAT_STATUS_RESISTANCE = 14;
  ARTIFACT_STAT_SUMMON_DURATION = 15;
  ARTIFACT_STAT_FINAL_ATTACK_DAMAGE = 16;
}

// One crystal: its level, 1 to 5, and three different stats it raises by
// that many levels each.
message ArtifactCrystal {
  int32 level = 1;
  repeated ArtifactStat stats = 2;
}

// Up to nine crystals, account-wide.
message LegionArtifact {
  repeated ArtifactCrystal crystals = 1;
}

enum ChampionRank {
  CHAMPION_RANK_UNSPECIFIED = 0;
  CHAMPION_RANK_C = 1;
  CHAMPION_RANK_B = 2;
  CHAMPION_RANK_A = 3;
  CHAMPION_RANK_S = 4;
  CHAMPION_RANK_SS = 5;
  CHAMPION_RANK_SSS = 6;
}

// A character registered as a Legion Champion, by job: GMS allows one per
// job.
message LegionChampion {
  Job job = 1;
  ChampionRank rank = 2;
}
