syntax = "proto3";

package ms;

// Actions the game understands. Every key press is translated to one of these
// before any screen sees it, so panels check actions, not keys.
enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  KEY_ACTION_UP = 1;
  KEY_ACTION_DOWN = 2;
  KEY_ACTION_LEFT = 3;
  KEY_ACTION_RIGHT = 4;
  KEY_ACTION_CONFIRM = 5;
  KEY_ACTION_CANCEL = 6;
  KEY_ACTION_NEXT_PANEL = 7;
  KEY_ACTION_PREV_PANEL = 8;
}

// One action and the keys bound to it, in slot order. Keys are stored by the
// name the Keybinds screen shows ("A", "Ctrl+A", "Page Down"), so a save
// doesn't contain terminal bytes. A name this build doesn't know is dropped on
// load. An empty slot is an empty string.
message Keybind {
  KeyAction action = 1;
  repeated string keys = 2;
}

// All of the player's bindings. The first key of every action can't be changed,
// so a save that loses one is still playable.
message Keybinds {
  repeated Keybind binds = 1;
}
