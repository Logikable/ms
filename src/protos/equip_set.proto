syntax = "proto3";

package ms;

import "src/protos/equip.proto";
import "src/protos/skill.proto";

// Every equipment set in the game. An enum, not a free-form name, because there
// are only a handful and the screens that name a set shouldn't be able to spell
// it differently from the data.
enum EquipSetName {
  EQUIP_SET_NAME_UNSPECIFIED = 0;
  EQUIP_SET_NAME_FROZEN = 1;
  EQUIP_SET_NAME_BOSS_ACCESSORY = 2;
  // One per branch, because each Root Abyss piece belongs to a single class.
  EQUIP_SET_NAME_ROOT_ABYSS_WARRIOR = 3;
  EQUIP_SET_NAME_ROOT_ABYSS_BOWMAN = 4;
  EQUIP_SET_NAME_ROOT_ABYSS_MAGICIAN = 5;
  EQUIP_SET_NAME_ROOT_ABYSS_THIEF = 6;
  EQUIP_SET_NAME_SENGOKU_TREASURE = 7;
  // One per branch, for the same reason as Root Abyss.
  EQUIP_SET_NAME_ABSOLAB_WARRIOR = 8;
  EQUIP_SET_NAME_ABSOLAB_BOWMAN = 9;
  EQUIP_SET_NAME_ABSOLAB_MAGICIAN = 10;
  EQUIP_SET_NAME_ABSOLAB_THIEF = 11;
  EQUIP_SET_NAME_DAWN_BOSS = 12;
}

// What wearing several pieces of one set is worth. Each tier is a SkillEffect
// because a set bonus grants the same things a passive skill does (stats,
// attack, a share of max HP, damage, defense ignored), and the code that reads
// those shouldn't need a second format.
message EquipSetTier {
  // How many pieces of the set must be worn for this tier to apply.
  int32 pieces = 1;
  SkillEffect effect = 2;
}

// The items that fill one slot of a set, by display name. Names are used
// because that is how a save records items: a character holds prototypes, not
// the catalog keys they were loaded under. There is more than one when a later
// boss drops an alternative for the same slot; wearing any of them fills it.
message EquipSetItems {
  repeated string name = 1;
}

// One slot of a set and what fills it: items listed by name, a family (any item
// in it fills the slot), or both. Both are used when the slot takes one
// specific item or one item per class: the Boss Accessory shoulder is a Magnus
// drop or any of the four Cygnus shoulders.
message EquipSetMember {
  EquipSlot slot = 1;
  reserved 2;  // the single `string name` the items below grew out of
  EquipSetItems items = 4;
  // A family of per-class versions of one piece, which a set can't list as a
  // single item. The inspect screen shows "Choose 1 <family>" until one is
  // worn.
  optional string family = 3;
}

// Equipment that pays a bonus for being worn together, loaded from data/sets at
// startup.
message EquipSet {
  EquipSetName name = 1;
  // One member per slot, so no slot can count twice. Listed in the order the
  // inspect screen shows them.
  repeated EquipSetMember members = 2;
  // Tiers stack: wearing five pieces pays the three-, four- and five-piece
  // tiers together. Each tier lists only what it adds over the one below.
  repeated EquipSetTier tiers = 3;
  // How many slots the set covers once every piece exists. Tiers are read
  // against this, not against the members above, because a set can ship before
  // all of its pieces do.
  int32 complete_pieces = 4;
}
