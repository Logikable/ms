syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/equip.proto";

// How a skill fits into the game. Combat is a single expected-damage
// auto-attack, so skills act as modifiers in one of these roles.
enum SkillKind {
  SKILL_KIND_UNSPECIFIED = 0;
  SKILL_KIND_ATTACK = 1;   // the swing's identity: supplies skill_pct
  SKILL_KIND_PASSIVE = 2;  // folds its levers into the character's stats
  // Cast, but not an attack: it spends the character's swing on something other
  // than damage, like the Cleric's Heal, cast instead of a swing when HP is
  // low. A cast with no lever behind it isn't offered at all, since it would
  // take the swing and do nothing.
  SKILL_KIND_ACTIVE = 3;
  // Attacks on its own timer, alongside whatever the character is swinging,
  // instead of being the swing. Used for summons and for cooldown skills the
  // player would press as soon as they are ready. See cast_interval_seconds.
  SKILL_KIND_AUTO_ATTACK = 4;
}

// A marker on a skill that a rule outside the skill checks, such as a group it
// belongs to or a family a later skill asks about. A tag never changes what the
// skill itself does; SkillEffect does that.
enum SkillTag {
  SKILL_TAG_UNSPECIFIED = 0;
  // The Paladin's Holy Power group. Nothing reads it yet: Vessel of Light,
  // which GMS requires one of these to activate, is permanent here.
  SKILL_TAG_HOLY_POWER = 1;
  // A fire spell. Ignite reads it: the fire mage's Final Attack only follows
  // their fire spells, so each attack says whether it burns.
  SKILL_TAG_FIRE = 2;
  // The Cleric's Benevolence group (the healing half of their kit), and the
  // Vengeance forms Righteously Indignant swaps in for it. Both are only
  // markers; which form is active is decided by name, through
  // Skill.replaces_skill_name.
  SKILL_TAG_BENEVOLENCE = 3;
  // The Hero line's Swordsmanship group, on the swings GMS tags with it.
  // Nothing reads it here, because the skill GMS gates on it isn't built.
  SKILL_TAG_SWORDSMANSHIP = 4;
  // The two elements an I/L magician alternates. Freezing Crush reads them: an
  // ice swing leaves Freeze Stacks and a lightning swing spends them, so each
  // attack says which element it is.
  SKILL_TAG_ICE = 5;
  SKILL_TAG_LIGHTNING = 6;
  SKILL_TAG_VENGEANCE = 7;
  // The Marksman's own shots: Piercing Arrow, Snipe and the cartridge, the
  // three GMS lists. Split Shot reads it, since the arrow only splits after
  // those.
  SKILL_TAG_MARKSMANSHIP = 8;
  // A holy spell, as defined by the client's `elemAttr: h`. Angel of Balance
  // reads it: the angel's mark is spent only by holy damage. It is set on the
  // Bishop's skills, since the Bishop leaves the mark, but not on all of them:
  // GMS gives no element to the Vengeance forms, Heaven's Door or the angel
  // itself, which is why the angel can't spend its own mark.
  SKILL_TAG_HOLY = 9;
}

// A skill's per-level contribution to the character's stats. Only the levers we
// model are here. Percents are fractions (0.10 == +10%).
//
// Field numbers come in two ranges: below 100 for levers any job could use, and
// 100 and up for one job line's own. The test is the mechanism, not which job
// has it today: boss damage belongs below 100 because gear already grants it,
// and Combo Orbs above because only warriors count them.
//
// None of this is ever serialized, so these numbers can move, unlike
// character.proto's.
message SkillEffect {
  // Primary stats, the same as a worn item grants.
  double str = 1;
  double dex = 2;
  double int = 3;
  double luk = 4;

  // HP and MP. The flat amounts (the fixed grant and the per-level one) are
  // added first, and the percent then scales the total.
  //
  // The pair below is per level, which is how most GMS pool skills work.
  // Advanced Blessing just grants 750, so the flat pair above is the same thing
  // as a worn item's Max HP: the same number at level 1 and at 140.
  double max_hp = 25;
  double max_mp = 26;
  double max_hp_per_level = 5;
  double max_hp_pct = 6;
  double max_mp_per_level = 7;
  double max_mp_pct = 8;

  double attack = 9;  // flat weapon attack, as a worn weapon grants it
  // Percent added to the character's total attack, from gear and skills alike,
  // applied last, the same way def_pct works for DEF. Unlike def_pct it pays
  // off: attack is the second factor in the damage chain, so 25% here is 25%
  // more damage.
  double attack_pct = 24;
  // Flat magic attack, as above. Magicians use this where everyone else uses
  // attack, so the two are separate fields for the same reason a staff has both
  // numbers: a skill grants one or the other, not both.
  double magic_attack = 10;
  double skill_pct = 11;  // damage multiplier (attack skills)
  // Added critical rate. On a passive it applies to the character; on an attack
  // it applies only to that attack, like ied_pct and boss_pct. Snipe always
  // crits and gives nothing to the next swing. It adds to the character's rate,
  // so 1.00 is certain either way.
  double crit_rate = 12;
  // Added critical damage (0.05 == +5%), on top of the hidden 0.35 every
  // character crits for. It is worth its share of swings: at 20% crit rate, 5%
  // critical damage is worth 1% damage.
  double crit_dmg = 13;
  double attack_speed = 14;  // faster-swing stages, added to the weapon's own
  // The same, for a skill whose stages go past the soft cap that the weapon and
  // job book are held to, instead of counting toward it. It is a separate field
  // because only this one may pass the cap, which is what makes a stage worth
  // anything to a character already at the cap. See AttackSpeedStage.
  //
  // Only Decent Speed Infusion uses it. Every job's book reaches the cap or one
  // stage below it, so a stage that counted toward the cap would be worthless
  // to half of them and would make the Inner Ability line for the same thing
  // worthless too.
  double uncapped_attack_speed = 53;
  // Weapon mastery, 0..1: how close the minimum damage roll gets to the
  // maximum. Unlike everything else here, masteries don't stack: a character
  // with two uses the better one, not the sum.
  double mastery = 15;
  // Plain % damage (0.05 == +5%). All sources add up inside one multiplier, so
  // two skills granting 5% give 10%.
  //
  // On an attack it applies only to that swing instead of the character, like
  // ied_pct and boss_pct: Perfect Shot's +100% is the shot's alone, and the
  // Snipe after it gets none. See WithoutSwingLevers.
  double damage_pct = 16;
  // Final damage (0.10 == +10%), which multiplies where damage_pct adds: two
  // 10% sources give 21%, not 20%. The difference doesn't show until a second
  // source of either exists, and is expensive to untangle later.
  //
  // On an attack this applies only to that swing instead of the character, like
  // ied_pct and boss_pct. See WithoutSwingLevers.
  double final_dmg_pct = 17;
  // Final damage on every hit against an afflicted enemy, meaning one with any
  // status this game tracks on a monster: freeze (see Skill.freeze_seconds),
  // burn (see Dot) or stun (see Stun). GMS requires "Damage Over Time, Freeze,
  // Stun, Darkness, or Paralysis", and Storm Magic and Burning Magic list the
  // same five, so this is one condition, not a list each skill chooses from. A
  // status added later joins it here without anything else changing.
  //
  // On or off, like final_dmg_pct_when_scarred: an enemy is either afflicted or
  // not, and a second status adds nothing.
  double final_dmg_pct_when_afflicted = 52;

  // Final Attack: a chance that the swing is followed by one extra hit on each
  // enemy it reached, dealing final_attack_pct on each of final_attack_lines
  // lines. The lines are kept separate instead of combined into one percent
  // because each rolls its own crit and mastery; 0 lines means one.
  //
  // Only the character's own swings trigger it, and it rolls separately for
  // each enemy reached. The skill decides which swings trigger it; see
  // Skill.follows_skill_tag.
  double final_attack_chance = 18;
  double final_attack_pct = 19;
  double final_attack_lines = 32;
  // The share of that chance one swing loses (0.60 == it triggers at 40% of the
  // normal rate). It exists for Shurrikane: GMS gives it "40% of normal chance
  // to trigger Assassin's Mark", the cost of a shuriken that keeps hitting for
  // two and a half seconds.
  //
  // It is a share, not points, so it holds at every level of the Final Attack
  // it reduces. It is read only from the skill being swung: it never becomes
  // part of the character, and a non-attack skill that sets it affects nothing.
  // meso_drop_cut works the same way for coins.
  double final_attack_chance_cut = 55;

  double def = 20;                // flat weapon DEF
  double damage_taken_pct = 21;  // share of incoming damage cancelled
  // Chance that an incoming hit misses entirely. It isn't damage reduction,
  // since it cancels the whole hit, but in an expected-value fight the two are
  // worth the same, so it multiplies in alongside them.
  //
  // Only the flat roll. GMS's other kind of dodge, the avoid stat, is tested
  // against an accuracy check this game doesn't have, so a skill granting it
  // grants nothing here. Two sources combine as independent rolls.
  double dodge_chance = 22;
  // Share taken off the attack of whatever hits the character (0.30 == 30%
  // less). It isn't damage reduction: it weakens the monster before its hit is
  // rolled, so the character's DEF then cancels a larger share of what is left.
  // That is the difference between a barrier and armour.
  //
  // Sources add up, since GMS states each as points on the same number, and the
  // total can't pass 100%: no amount of barriers makes a monster harmless.
  //
  // It applies to ordinary monsters only, unless something grants the field
  // below. In GMS, what walks into the barrier is weakened, and a boss doesn't
  // walk into it.
  double enemy_attack_pct = 50;
  // Whether the share above also applies to bosses. It is set by a separate
  // skill, not bundled with the lever, because that is how GMS sells it: the
  // Night Lord's Frailty Curse - Boss Rush extends the barrier the rest of
  // their book already built. One skill granting it applies to the character's
  // whole total.
  bool enemy_attack_reaches_boss = 51;
  // Share of the monster's DEF this character's attacks ignore (0.25 == 25%).
  // Sources combine multiplicatively: what two sources leave is the product of
  // what each leaves, so 30% and 40% ignore 58% together and no number of
  // sources reaches 100%. Gear grants the same thing (see
  // EquipStats::ignore_enemy_defense), and the two combine the same way.
  //
  // On an attack it applies only to that attack's swing; on a passive it
  // applies to the character. GMS uses both forms and means different things by
  // them. See WithoutSwingLevers.
  double ied_pct = 23;

  // Share of a boss's elemental resistance the character ignores (0.10 == 10%).
  // Half of every hit on a boss is blocked by that resistance, and this is the
  // only thing that reduces it; see kBossElementalBase.
  //
  // GMS multiplies instead of subtracting points: ignoring 10% lowers the
  // reduction from 50% to 45%, not 40%. Two sources add, unlike ied_pct, but no
  // character ever has two, since Elemental Decrease belongs to the I/L and F/P
  // mages and Righteously Indignant to the Bishop.
  //
  // It applies to one swing or to the character by the same rule as ied_pct:
  // GMS states the arch mage's 4th-job Elemental Decrease as a cast.
  double ier_pct = 56;

  // Share added to the character's damage against bosses only (0.10 == +10%).
  // It adds to what gear grants, since the two are the same stat from two
  // places.
  //
  // The stats page shows it beside the gear's share, so the player can see the
  // total.
  //
  // It applies to one swing or to the character by the same rule as ied_pct:
  // Heaven's Hammer hits a boss 30% harder and gives nothing to the next swing.
  double boss_pct = 27;
  // The opposite of boss_pct: a share added to damage against anything that
  // isn't a boss (0.20 == +20%). It adds into the same sum as damage_pct, as
  // boss damage does, so its value depends on what else the character has.
  //
  // This is GMS's `nbdR`, shown in its readouts as "Damage Against Normal
  // Enemies: +20%". It applies to one swing or to the character by the same
  // rule as ied_pct and boss_pct.
  double normal_pct = 30;
  // Vicious Shot. The share of the character's critical rate added as critical
  // damage (0.50 == half of it). The rate includes the base 5% and isn't
  // capped; the point of the skill is the rate above 100%, which the critical
  // roll itself still caps.
  //
  // A swing's own stated rate isn't counted, as GMS says explicitly: Snipe's
  // guaranteed crit doesn't add to it.
  double crit_dmg_per_crit_rate = 31;
  // Damage percent this attack adds against non-bosses, per line, exactly as
  // skill_pct is per line. So a 180% swing with 180% here deals 360% to an
  // ordinary monster. This is Beam Blade's defining feature.
  //
  // This is the other of GMS's two, `nbdamPlus`, identified by its readout
  // wording: "+20% points" is this one, and a bare "+20%" is normal_pct above.
  double normal_skill_pct = 28;
  // Maple Warrior. The share of AP-bought stats this skill grants back as flat
  // stats, per stat (0.15 == 15%): 1000 STR and 100 DEX from AP give 150 and
  // 10. Rounded down, as in GMS.
  //
  // Only AP counts. STR from a ring or another skill isn't multiplied, which is
  // why this reads the allocation instead of the total. What it grants is a
  // flat grant like theirs, so a percent bonus on the character's stats raises
  // this too.
  double ap_stat_pct = 29;
  // Maple World Goddess's Blessing. A share added to what the lever above
  // grants, so 3.00 is GMS's "increases stat bonuses as Maple Warrior by 400%":
  // the first 100% is Maple Warrior itself, not a gain.
  //
  // It is a multiplier, not a second ap_stat_pct, because that is what it is:
  // it multiplies whatever Maple Warrior grants. A character without Maple
  // Warrior multiplies nothing and gets nothing, which covers GMS's "can only
  // be used when you have Maple Warrior".
  double ap_stat_bonus_pct = 54;
  // Lines added to every multi-line swing the character makes, summed across
  // sources. GMS's exceptions follow from how swings work here: a summon fires
  // on its own timer, and a Final Attack has no line count to add to. A swing
  // that hits once is left alone, because an added line is a share of the swing
  // and on a single hit it would double it.
  double bonus_attack_lines = 33;
  // Expected share of max HP that a landed swing restores (0.02 == 2%). GMS
  // states it as a chance of a fixed amount; an expected-damage fight uses the
  // expectation, so the two are multiplied here. Unlike heal_pct it costs no
  // swing and comes with the attack.
  //
  // On an attack it applies only to that swing, like ied_pct and the other
  // swing levers: Angel Ray heals the Bishop as it lands and Big Bang doesn't.
  // On a passive it applies to the character, as Lord of Darkness does. See
  // WithoutSwingLevers.
  double hp_recover_pct = 34;

  // Share of max HP one cast restores (1.00 == all of it). It is the only lever
  // used during a fight instead of being added to the stats: the character
  // casts it instead of swinging when HP is low. See CombatSim::HealToCast.
  double heal_pct = 35;
  // Damage multiplier for the stronger opening hit some swings land on one
  // enemy before spreading, GMS's "strikes one, then detonates in place". Read
  // with Skill.lead_lines; 0 for swings that hit once.
  double lead_pct = 36;

  // Shadow Partner. A shadow copies every line the character's swing lands and
  // hits again for this share of it (0.70 == 70%), so a three-line swing lands
  // three real lines and three shadow lines.
  //
  // It is kept as separate lines instead of a damage multiplier, which would
  // give the same damage, because a second set of hits is what the player is
  // buying and the skill page should say so. Sources add up; only one exists.
  //
  // The shadow copies swings only. It doesn't copy a summon's pulse or a Final
  // Attack; encounter.cc draws the line in the same place for both.
  double mirror_line_pct = 37;
  // Levels this skill adds to every other skill the character has learned, up
  // to each skill's master level. It never raises the skill granting it and
  // never teaches an unlearned skill.
  //
  // A double even though levels are whole, because GMS increases it in a step
  // (one level for most of the range, two at the top), which base + per_level *
  // (L - 1) can only follow by keeping the fraction and flooring it when read.
  // See EffectiveSkillLevel.
  //
  // A skill marked Skill.exceeds_master_level can go past its master level with
  // these; every other skill stops there.
  double skill_level_bonus = 38;
  // Share added to the duration of every buff the character casts (0.50 == 50%
  // longer), summed across sources. It lengthens the buff but not the wait for
  // the next one, which is the whole benefit.
  //
  // Only a Buff has a duration to lengthen, so this affects exactly the skills
  // that couldn't be modelled as permanent; see the Buff message.
  double buff_duration_pct = 39;
  // Share of max HP one pulse of a fountain restores, and the seconds between
  // pulses. Both are read together: what matters to the fight is the rate, so
  // two sources add their rates, not their pulses.
  //
  // Unlike heal_pct this costs no swing and needs no trigger: the fountain
  // heals whether the character is winning or losing. The interval goes down as
  // the skill levels, so per_level is negative.
  double regen_pct = 40;
  double regen_interval_seconds = 41;
  // A pulse that restores flat HP instead of a share of the pool, on the same
  // timer. It exists for the Evil Eye's aura: GMS heals a flat 20 HP every 24
  // seconds, which is nothing to a character with a real pool, and is exactly
  // what its Hyper Skill replaces.
  //
  // Set beside regen_pct or instead of it. Either one makes a fountain, and one
  // with both heals both.
  double regen_hp = 49;
  // Total INT per extra helping of the pulse above, so with 2500 here a
  // character with 5000 INT heals three times what the fountain states. It
  // exists for Holy Water: GMS's "HP Recovery is increased by 5% per 2500 INT".
  //
  // All of the character's INT counts, including skill grants, so it is applied
  // where the final total is known, not where the pulse is read. 0 for a
  // fountain that heals the same regardless of INT.
  double regen_int_step = 42;
  // A heal that triggers by itself when the character is nearly dead: below
  // emergency_heal_hp_threshold of max HP, it restores emergency_heal_pct of
  // max HP every second for emergency_heal_seconds, then waits
  // emergency_heal_cooldown_seconds. It exists for Invincible Belief.
  //
  // Unlike a fountain, which heals whether the fight is going well or badly,
  // and unlike revive_cooldown_seconds, which responds to a hit that already
  // killed the character. All four fields are read together, and the pct being
  // set is what means a skill grants one. Two sources don't stack; the shorter
  // cooldown wins, as with a pact.
  double emergency_heal_pct = 57;
  double emergency_heal_seconds = 58;
  double emergency_heal_hp_threshold = 59;
  double emergency_heal_cooldown_seconds = 60;
  // Extra EXP per kill, as a fraction of the mob's normal EXP (0.50 == 50%
  // more). Summed across the passives granting it. It shortens the time to the
  // next level and does nothing in a fight.
  double exp_pct = 43;
  // Share added to the meso a kill drops (0.20 == +20%). Summed across sources,
  // and like exp_pct it pays outside of fights.
  double meso_pct = 44;
  // Share added to how often a kill drops anything (0.20 == a fifth more
  // often), covering both the items a mob lists and its meso. Summed across
  // sources, and pays outside of fights like the two above.
  //
  // It raises the chance, where meso_pct raises the amount. A certain drop
  // can't become more certain, so the chance is capped at 1; see
  // MesoDropChance.
  double item_drop_pct = 45;
  // From Shield Mastery, in both books that have one: the Bandit's and the
  // White Knight's. Percent added to the character's total DEF (from gear,
  // skills and AP alike), applied last. It is useless by design: DEF stops
  // helping at a share of the attacking monster's attack, and characters pass
  // that cap on their stats alone long before any skill grants this. See
  // DerivedStats::def.
  double def_pct = 46;
  // Resistance to abnormal statuses on GMS's own scale, and to elemental damage
  // as a fraction. Nothing in this game inflicts a status or an element on the
  // character, so neither is read. They are kept so the skill carries the
  // wiki's figures, and the stats page shows them so the player sees what they
  // bought.
  double status_resistance = 47;
  double elemental_resistance = 48;
  // From here down, each field belongs to one job line; see the message
  // comment. The Fighter's: attack per Combo Orb the character has, for a skill
  // that surrounds them with orbs. The orbs are assumed full, so this is worth
  // this value times the character's orb count. It is stated per orb, not as
  // the product, because a later skill raises only the count. See
  // Skill.combo_orbs.
  double attack_per_combo_orb = 100;
  // The Crusader's, per orb like the field above.
  double final_dmg_pct_per_combo_orb = 101;
  // The Hero's, again per orb: boss damage per orb, and DEF per orb. The DEF
  // one is useless by design for the same reason as def_pct (a 4th job passes
  // the cap on stats alone), and is stated per orb so it matches what GMS says.
  double boss_pct_per_combo_orb = 112;
  double def_per_combo_orb = 113;
  // The Hero's V node. A share added to everything the orbs are already worth,
  // across all four per-orb levers above. It exists for Instinctual Combo: GMS
  // raises what the Combo Counter grants instead of adding a fifth per-orb
  // bonus, so a Hero who never bought the hyper that pays boss damage per orb
  // gets none of it here either.
  double combo_orb_gain_pct = 124;
  // The Hero's other V node. Combo Orbs' worth of final damage granted on top
  // of the ring, without granting the orbs themselves: Sword Illusion's cast is
  // worth six orbs for eight seconds, and only the final damage lever reads
  // them, not the attack, boss damage or DEF an orb also pays.
  //
  // Added to the ring's count instead of multiplying it, which is GMS's "Final
  // Damage increase from Combo Orb is additive". So a Hero with no per-orb
  // final damage gets nothing here, which covers GMS's "while Combo Attack is
  // active" without a separate check. See FoldComboOrbs.
  double final_dmg_combo_orbs = 125;
  // The Magician's. Share of incoming damage taken from MP instead of HP. MP
  // isn't tracked, so it acts as plain damage reduction alongside
  // damage_taken_pct.
  double damage_to_mp_pct = 102;
  // The Fighter's. Share of a hit taken that is dealt back to the attacker
  // (1.20 == 120% of the damage received). Measured against what the character
  // actually loses, so their own defences reduce the reflected damage too.
  double damage_reflect_pct = 103;
  // The Chief Bandit's Pick Pocket. Chance a meso drops from an enemy, rolled
  // once per line the swing lands on it (0.30 == 30%), so a four-line swing on
  // eight enemies rolls thirty-two times. GMS says one meso per proc and never
  // says what it's worth, and its hyper raises only the chance and the count: a
  // meso here is ammunition, not money.
  //
  // Only the character's own chosen swings drop them: not a summon's pulse, a
  // Final Attack, a shadow's copy, or a skill on its own timer.
  double meso_drop_chance = 104;
  // The share of that chance one swing loses (0.50 == coins drop half as
  // often). GMS halves Pick Pocket for Cruel Stab, which would otherwise pay a
  // Shadower more for mobbing than for anything else they do.
  //
  // It is a share, not points, so it is exactly half at every level of Pick
  // Pocket, not only at max. It is read only from the skill being swung: it
  // never becomes part of the character, and a non-attack skill that sets it
  // affects nothing.
  //
  // Not to be confused with its neighbours: meso_drop_chance above grants the
  // chance, and meso_pct is what a kill pays into the purse.
  double meso_drop_cut = 105;
  // The Chief Bandit's Meso Explosion. The damage of one line of a thrown meso
  // (1.00 == 100%); the skill's `lines` says how many lines a meso is worth.
  //
  // Throwing them costs nothing. They are the mesos Pick Pocket knocked onto
  // the ground, never the player's own, so the pair really trades coins the
  // character would never have picked up.
  double meso_hit_pct = 106;
  // The Dark Knight's Final Pact. Seconds between one revival and the next; any
  // value above 0 means the skill revives at all. A hit that would kill the
  // character refills their HP instead, and the fight continues.
  //
  // It is here, not in Skill.cooldown_seconds, which is a fixed field: a GMS
  // pact shortens its own wait as it levels, and this one goes from 1103
  // seconds down to 900. If two skills grant it, the shorter wait wins instead
  // of giving two chances.
  double revive_cooldown_seconds = 107;
  // Seconds off that wait, summed across the skills granting it and applied
  // after the shortest pact above is chosen. Only the Dark Knight's Final Pact
  // - Reduce Cooldown has it: GMS shortens the wait by defeating enemies after
  // a revival, which this game has no window to count, so the hyper just gives
  // the seconds.
  //
  // The wait never reaches zero: a wait of 0 means the character isn't revived
  // at all, so the cut stops a second short of that.
  double revive_cooldown_cut_seconds = 111;
  // The Priest's. Removes every abnormal condition on the character. Nothing
  // inflicts one yet, so nothing reads it, but it is the whole of what Dispel
  // does, and showing Dispel's page as empty would suggest the game has no
  // plans for it. It is waiting for a boss that needs it.
  bool cures_conditions = 108;
  // The I/L Magician's Freezing Crush. What one held Freeze Stack is worth:
  // critical damage on any swing, and final damage on the lightning swing that
  // spends it. See Skill.freeze_stack_cap.
  double crit_dmg_per_freeze_stack = 109;
  double final_dmg_pct_per_freeze_stack = 110;
  // Glacial Fury's, adding to Freezing Crush's stacks: extra stack cap while
  // this is active, and the magic attack each held stack is worth to an ice
  // swing. Neither does anything without a cap to raise: the mechanism belongs
  // to Freezing Crush, and a character who hasn't learned it holds no stacks.
  double freeze_stack_cap_bonus = 114;
  double magic_attack_per_freeze_stack = 115;
  // Shatter's. Enemy defence ignored per Freeze Stack held, on any swing, since
  // a frozen enemy is frozen whichever element hits it. It combines with the
  // character's other ignored defence as sources always do, and is worthless
  // against a monster whose defence is already fully ignored.
  double ied_pct_per_freeze_stack = 117;
  // Scarring Sword's. The chance that one line of a swing scars the enemy it
  // hits, and how long the scar lasts. GMS calls this piercing the enemy; the
  // name comes from the skill instead, since a pierce here already means an
  // arrow passing through a row of monsters.
  //
  // A scar is the second status this game tracks, after freeze, and is stored
  // on the monster the same way; see QueuedMob::scarred_left_seconds. Only the
  // character's own swings leave one.
  double scar_chance = 118;
  double scar_seconds = 119;
  // Chance Attack's. Final damage on every line that hits a scarred monster. On
  // or off, like final_dmg_pct_when_afflicted: a second scar adds nothing.
  double final_dmg_pct_when_scarred = 120;
  // Scarring Sword's other half. Share off a scarred monster's attack, on top
  // of what enemy_attack_pct already takes off every monster. It works the same
  // way as that field and weakens the mob before its hit is rolled.
  double enemy_attack_pct_when_scarred = 121;
  // Gungnir's Descent's. Flat damage each line adds, as a share of the
  // character's max HP (1.10 == 110% of max HP). It is added after the damage
  // chain and nothing multiplies it (not crits, mastery, final damage or
  // ignored defence), so it is worth less as a character's damage outgrows
  // their HP.
  //
  // GMS states it as "Damage increases by {50+2x}% of Max HP for every attack",
  // and the client gives the skill twelve lines.
  double max_hp_damage_pct = 122;
  // The F/P Magician's. Final damage for each burn active on the enemies in
  // front of the character, up to Skill.dot_count_cap. GMS's Elemental Drain
  // gives 3% each and Fervent Drain raises it to 5%, both capped at five.
  //
  // The count is over the whole group, not per enemy, which is what GMS means
  // by "within a certain range": eight monsters with one burn each count as
  // eight, and one boss with four burns counts as four. So it reaches its cap
  // on a map but only as many as the rotation keeps active on a boss.
  double final_dmg_pct_per_dot = 123;
}

// A second attack the same skill makes on its own timer, alongside the swing it
// already is. It exists for Arrow Blaster: one skill the player learns once,
// fired by holding the key, that also leaves a turret firing by itself. Two
// skills with one display name would share one SP ladder but show as two rows;
// this keeps it one row, one ladder, one page.
//
// A skill can have several. Revenge of the Evil Eye needs that: its Evil Eye
// Shock III fires a volley and then four auras, which hit different numbers of
// enemies and so can't be one attack.
//
// Read at the same learned level as the skill that has it.
message AutoMode {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls this part, in both its reach row and its damage
  // row. Two parts with the same label would be indistinguishable, so keep them
  // short and distinct.
  string label = 6;
  // Seconds between casts, as in Skill.cast_interval_seconds. Never scaled by
  // attack speed; nothing on its own timer is.
  double cast_interval_seconds = 3;
  // The other timer it can use: the character's landed swings instead of
  // seconds, as in Skill.attacks_per_cast. A mode uses one timer or the other,
  // never both. It exists for Inhuman Speed's afterimage: GMS spawns one every
  // ten attacks, and a rate in swings holds whatever the character is swinging.
  //
  // Counted through the swing's hits_per_attack_count, so a skill landing
  // several times a second counts as a fraction of an attack here without this
  // mode needing to say so.
  int32 attacks_per_cast = 7;
  // How many enemies it hits. This is its own, not the skill's: the Evil Eye's
  // auras hit 3 while the volley fired with them hits 10.
  int32 max_enemies = 4;
  int32 lines = 5;
  // Attacks per firing, each of `lines` lines against its own `max_enemies`, as
  // in BuffPulse.casts. Inhuman Speed's afterimage lasts a second and shoots
  // five times, which is one moment here. 0 means one, as for every other mode.
  int32 casts = 8;
  // Whether this stops while the skill's own buff is active. It exists for
  // Inhuman Speed: GMS spawns the afterimage on an attack count only while the
  // active part is off, and says the two never run together.
  //
  // Only read when the skill has a buff of its own.
  bool silent_while_buff_stands = 9;
}

// Damage a buff deals by itself: a wound that bleeds while the buff lasts and
// only then.
//
// This isn't an AutoMode, which is a turret that fires whether or not anything
// was hit and picks its own targets. A pulse has no reach of its own (it uses
// the swing's, being the mark that swing left) and no timer beyond the buff's.
// GMS's chance and damage are both combined into skill_pct, since neither means
// anything alone. Read at the skill's learned level.
message BuffPulse {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, in its row under the buff's heading.
  string label = 3;
  int32 lines = 5;
  // Enemies one attack hits. 0 uses the reach of the swing that applied the
  // buff, since the mark is on what was hit.
  int32 max_enemies = 6;
  // Attacks per tick, each of `lines` lines against its own `max_enemies`. It
  // exists for Cry Valhalla: GMS drops three sword strikes together, 60ms
  // apart, which is one moment here. 0 means one, as for every other pulse.
  int32 casts = 7;
  // Ticks one cast of the buff is worth; after that it stops for the rest of
  // the window. 0 means it ticks for as long as the buff lasts. Cry Valhalla's
  // twelve run out at 24 seconds of a 30-second buff, which is why a longer
  // buff gains nothing.
  int32 max_pulses = 8;
  // What sets the tick rate: a timer of its own, or the swings of a named
  // skill.
  oneof pace {
    // Seconds between ticks. Never scaled by attack speed; nothing on its own
    // timer is.
    double cast_interval_seconds = 4;
    // The skill whose swings drive this. It exists for Instinctual Combo's
    // tear: GMS leaves one on every Raging Blow, so it speeds up with the
    // character's attack speed. Only a buff's own pulse may set this, not a
    // stance's. It is read as if every swing were the named skill.
    string paced_by_skill_name = 9;
  }
  // Lines added to each attack for every enemy past the first that the
  // character's own swing hits, and the most that can be added. They exist for
  // Storm of Arrows: GMS rains longer when the triggering attack hit a crowd,
  // from 7 lines up to 15.
  //
  // The count comes from the swing, never from the rain's own reach. GMS says
  // "if currently attacking more than one enemy", and a rain counting its own
  // targets would rain 15 on a boss whose parts it counts as a crowd.
  int32 lines_per_extra_enemy = 10;
  int32 max_extra_lines = 11;
  // Skill damage this pulse gains each time it has already fired, and the most
  // times it can gain it, on the same base + per_level * (L - 1) ladder as
  // everything else. They exist for Poison Chain: GMS's poison builds up on an
  // enemy that survives an explosion, each stack adding 60 percentage points to
  // the next, up to five.
  //
  // The count is the pulse's own firings, not anything on the enemy. It amounts
  // to the same thing: a boss survives every explosion, so what has built up on
  // it is how many it has taken.
  double skill_pct_per_repeat = 12;
  double skill_pct_per_repeat_per_level = 13;
  int32 max_repeats = 14;
  // One more attack, at the top of that ramp, when `max_pulses` runs out. This
  // is GMS's "if the skill ended because the available explosions were used up,
  // all poison is removed, followed by an additional explosion". It isn't a
  // timed tick, so it lands with the last tick, not an interval later.
  bool final_repeat_strike = 15;
  // Attacks a tick fires on top of its per-enemy volley, each one line of the
  // pulse's damage, spread over the enemies in reach before any enemy takes a
  // second. Read exactly as Skill.scatter is, for the same reason.
  //
  // It exists for Dark Lord's Omen: GMS's scroll fires six stars at each enemy
  // plus seven more "regardless of the number of enemies", so all seven hit a
  // lone boss while a crowd of seven takes one each. Unset for every other
  // pulse.
  Scatter fixed_strikes = 16;
  // A differently shaped attack this pulse fires when `max_pulses` runs out.
  // Unlike final_repeat_strike, which fires the pulse itself once more at the
  // top of its ramp. Both land with the last tick, since an attack timed at the
  // end of the window would land after the buff ended.
  //
  // It keeps the pulse's levers and states only what is its own: one turret,
  // whose boss damage GMS states once. Unset for a pulse that just stops.
  SwingHit final_strike = 17;
}

// A shield that blocks whole hits instead of reducing each one, and lasts until
// its hit count or its timer runs out.
//
// GMS exempts attacks that deal a share of the target's max HP (nearly every
// boss attack) and reduces them instead. Nothing here deals damage that way, so
// `Mob.boss` decides which hits those are: a boss's hit is never blocked and is
// reduced by `boss_damage_taken_pct`. Read at the skill's learned level.
message Shield {
  // Hits one cast blocks before the shield breaks. A double for the same reason
  // Dot.max_stacks is: GMS raises it faster than one per level, and only a
  // fractional step floored when read can follow that.
  double hits = 1;
  double hits_per_level = 2;
  // Share of an unblockable hit that the shield reduces instead (0.10 == a
  // tenth). Multiplies with every other active reduction, as they all do.
  double boss_damage_taken_pct = 3;
  // Whether one cast covers the whole party or only the caster. Holy Magic
  // Shell is GMS's party shield; Divine Shield protects only the White Knight,
  // so it leaves this unset.
  bool party = 4;
}

// One form a buff can be cast in: how long it lasts and what it deals while
// active. It exists for Burning Soul Blade: GMS gives it a short, dense mobile
// sword and a long, thin stationary one, and removed the key that switched
// between them, so the form is chosen at the cast.
//
// Read at the same learned level as the skill that has it.
message Stance {
  // What the skill page calls this form, in its duration and damage rows. Two
  // forms with the same label would be indistinguishable.
  string label = 1;
  // Seconds it lasts, on the same base + per_level * (L - 1) ladder as
  // Buff.duration_seconds.
  double duration_seconds = 2;
  double duration_seconds_per_level = 3;
  // What it deals while active, as in Buff.pulse. Each stance has its own,
  // since the pulse is most of what makes two forms different.
  BuffPulse pulse = 4;
}

// An attack a buff loads a fixed number of, one used per swing while the buff
// is active. It is a real swing (it takes its own time, unlike a pulse on its
// own timer), so it states everything a swing does. Nested because GMS
// describes it in the buff's tooltip and it isn't learned separately. Read at
// the skill's learned level.
message Magazine {
  // What the skill page calls it, and the name its damage is reported under.
  // The fight finds the swing by this name, so two magazines can't share one.
  string label = 1;
  // Swings one cast of the buff provides. They expire with the buff whether or
  // not they were used: cartridges don't carry over between loads.
  int32 charges = 2;
  // A complete attack, the same as the fields with these names on Skill.
  int32 base_delay_ms = 3;
  int32 max_enemies = 4;
  int32 lines = 5;
  int32 casts = 6;
  SkillEffect base = 7;
  SkillEffect per_level = 8;
  // How the load scatters, read exactly as Skill.scatter is. It exists for
  // Poison Nova's fifteen clouds.
  Scatter scatter = 9;
  // The skill whose press uses a charge, by display name. When set, the load
  // has no button of its own: it lands alongside that swing, on its press and
  // during its animation, so the character pays no time for it. It exists for
  // Poison Nova: GMS lays clouds that the F/P's Mist Eruption sets off, instead
  // of giving them a key.
  //
  // Empty means Repeating Crossbow Cartridge's style: a real swing that the
  // fight picks like any other.
  string spent_by_skill_name = 10;
  // Whether every swing the character makes uses this load, instead of only the
  // skill named above. It exists for Throw Blasting: GMS attaches its charms to
  // whatever throwing attack was pressed, so tying them to one skill would
  // leave the load unused on the maps its six-enemy reach is meant for. The
  // load still lands with the press that uses it and has no button of its own,
  // as with a named skill.
  bool spent_by_every_swing = 11;
  // Charges one press uses, which is how many times the attack lands for it.
  // GMS's Throw Blasting attaches two to four charms to every attack, three on
  // average; a press with fewer left uses what remains. 0 means one, as for
  // every other magazine.
  //
  // Not the same as `casts`, which is attacks from one charge: Full Burst Shot
  // fires four arrows and uses one cartridge.
  int32 charges_per_swing = 12;
  // How often a charge comes back when the buff isn't active, and how many can
  // be stored that way. The timer only runs while the count is below
  // recharge_max, so a load in hand is never topped up. That implements GMS's
  // "the active and passive effects cannot trigger simultaneously", and makes
  // the buff's duration a ceiling instead of a silent period. Set both or
  // neither.
  double recharge_seconds = 13;
  int32 recharge_max = 14;
}

// One lever of a buff's party effect that grows with the caster's INT instead
// of being fixed by skill level. GMS states each as "+1 per N INT (up to M)"
// and counts the Bishop's INT, not the recipient's. Unlike
// SkillEffect::regen_int_step, which counts the drinker's own INT.
//
// It exists for Benediction: GMS grows all three of its party levers this way,
// each with its own step, so this message written three times covers them all.
message AllyIntLever {
  // INT per unit, and what a unit is worth. `effect` is added once per whole
  // step, so a 3000 step with final_dmg_pct 0.01 is GMS's "+1% per 3000 INT".
  // The INT counted is the caster's full total, the same way a fountain counts
  // the drinker's.
  double int_step = 1;
  SkillEffect effect = 2;
  // The cap on the lever, including ally_base. So a 10% cap over a 1% base
  // allows nine steps of growth. Unset for a lever GMS doesn't cap; none
  // currently is.
  SkillEffect cap = 3;
  // Whether the cap is instead the caster's own value of the same lever,
  // divided by the party size and rounded. Only Benediction's final damage uses
  // this: GMS splits one blessing among everyone in it, so in a party of two
  // each gets half the Bishop's 33%, and in a party of three a third. The
  // Bishop's own share isn't reduced.
  //
  // The count includes the caster. Every party member is assumed to be inside
  // the zone, since there are no positions here to stand outside it.
  bool cap_is_party_share = 4;
}

// A buff a skill turns on for a while, with its own cooldown: what it grants
// while active, how long it lasts, and what shortens the wait for the next
// one. The skill's cooldown_seconds is that wait.
//
// It exists for Dark Resonance, whose duration is shorter than its cooldown.
// Skills like Cross Surge and Hyper Body last as long as the player keeps
// recasting them, so this game treats them as permanent. A buff that can't be
// permanent has to be modelled, or the game would give out something GMS never
// does.
//
// Its levers go through the same step as every passive's, so they combine
// with the character's like two skills' do: two sources of ignored defence
// multiply instead of adding. That is why a buff can't just be a multiplier
// applied to a damage number afterwards.
//
// Read at the same learned level as the skill that has it.
message Buff {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // Seconds it lasts, on the same base + per_level * (L - 1) ladder as
  // everything else.
  double duration_seconds = 3;
  double duration_seconds_per_level = 4;
  // Seconds each landed swing takes off the wait for the next cast. It gives
  // the player a reason to swing fast beyond damage: the buff comes back
  // sooner. 0 for a buff that waits out its full cooldown.
  double cooldown_reduction_seconds = 5;
  // What the buff attacks with while active. Unset for a buff that only grants
  // levers.
  BuffPulse pulse = 6;
  // Whether only one of these is active over the whole party no matter how many
  // members cast it: it doesn't stack with itself, and the party casts it in
  // turn.
  //
  // The caster's own cooldown is unchanged. What changes is how often the buff
  // comes around to them: a party of N takes N turns. Only members who have the
  // skill are covered, which is all of GMS's faction rule.
  bool party_shared = 8;
  // Lines the character must land before this activates, instead of a cooldown
  // in seconds. It exists for Mortal Blow: GMS counts a Ranger's hits and
  // grants a window once the count is reached. Lines landed while it is active
  // don't count, so its uptime depends on how fast they attack. 0 for a buff on
  // a timer, which is every other buff.
  int32 charge_lines = 7;
  // Whether the buff starts at the cast instead of when the swing lands, so the
  // swing that applies it already benefits. Only for buffs attached to an
  // attack; a buff on its own cooldown is up before any swing anyway.
  //
  // It exists for Sword Illusion, and GMS's wording is the whole distinction:
  // the explosions come "afterwards" and the final damage "upon use". By
  // default the buff affects the swings after it, never the one that applied
  // it.
  bool raised_on_cast = 15;
  // Whether only the skill's wound form triggers this buff, and a normal press
  // doesn't. Trickblade is the only skill with two forms: GMS makes the
  // Shadower invincible for 1.8 seconds after the five slashes on a wounded
  // enemy, and says nothing like that about its normal spread attack. See
  // Wound.form.
  bool needs_wound_form = 24;
  // What this buff gives a named skill while active, as Skill.boost does
  // permanently. It exists for Storm of Arrows: GMS doubles Magic Arrow's
  // chance only during the storm, and a permanent boost would pay for a
  // 70-second window as if it never ended.
  //
  // Read at the same learned level as the skill that has it, and applied only
  // to the damage set built with this buff active; see LearnedPassives.
  repeated SkillBoost boost = 16;
  // What every other party member gets while this is active, read at the
  // caster's level. Only Smokescreen uses it: GMS shelters the party under it,
  // and here that becomes damage reduction.
  //
  // Separate from Skill.ally_base, which is permanent. A buff's party effect
  // comes and goes on the caster's timer, so allies get it as a timed window,
  // not as a passive. A 30-second buff on a 120-second cooldown folded in as a
  // passive would be worth four times too much.
  SkillEffect ally_base = 9;
  SkillEffect ally_per_level = 10;
  // What the caster's INT adds to that party effect, lever by lever. Empty for
  // a party effect fixed by the caster's level, which is all but Benediction's.
  // See AllyIntLever.
  repeated AllyIntLever ally_int_lever = 20;
  // The shield this buff creates, over the caster and the party: one cast, one
  // shield, and each member gets their own block count. Unset for a buff that
  // only grants levers.
  Shield shield = 11;
  // A buff that starts at `stages` times its levers and loses one stage every
  // `stage_interval_seconds`. It exists for Arcane Overdrive: three stages of
  // final damage, one lost every ten seconds, so a player who uses their
  // strongest skills right away gets more from it than one who waits. 0 for a
  // buff with a single strength, which is every other buff.
  //
  // Implemented as `stages` buffs started by one cast, each granting one stage
  // and each ending one stage interval after the previous one. So one of these
  // uses that many buff windows, not one; see kMaxBuffWindows in
  // combat/constants.h. duration_seconds is still the full length; no stage
  // outlasts it.
  int32 stages = 12;
  double stage_interval_seconds = 13;
  // The forms this buff can be cast in; one is chosen at each cast and lasts
  // until it expires. A buff with stances has no duration_seconds or pulse of
  // its own; each stance has both, and the fight picks based on the current
  // situation. See Stance.
  //
  // Still only one buff window however many forms there are, since only one is
  // active at a time.
  repeated Stance stance = 14;
  // The attack this buff loads, and how many swings of it one cast provides.
  // Unset for a buff that loads none; see Magazine.
  Magazine magazine = 17;
  // Seconds added to the window for each burn active on the group, up to
  // dot_count_cap. It exists for Elemental Fury: GMS extends the spirit's stay
  // by 0.6 seconds per active Fervent Drain, exactly one more strike of its
  // 0.6-second timer.
  //
  // The count is the same one Fervent Drain reads (burns across the whole
  // group), taken at the moment of the cast, so a window started while the
  // rotation's poisons are down is the short one. 0 for a buff whose length
  // doesn't depend on the enemies, which is every other buff.
  double duration_seconds_per_dot = 18;
  int32 dot_count_cap = 19;
  // The levers above apply only for `duty_seconds` of every
  // `duty_interval_seconds` while the buff is active, repeating for as long as
  // it is. They exist for Angel of Balance: GMS's angel re-grants a four-second
  // buff every five seconds, so the damage is up four seconds in five for the
  // thirty seconds the summon lasts.
  //
  // Only the grant turns on and off, never the buff. Its pulse keeps attacking,
  // its shield keeps blocking and its magazine stays loaded during the gap: the
  // angel attacks on its own timer whatever the buff is granting at the moment.
  // 0 for a buff that grants for its whole window, which is every other buff.
  double duty_seconds = 21;
  double duty_interval_seconds = 22;
  // A summon this buff dismisses while it is active. It exists for Angel of
  // Balance: GMS dismisses Bahamut to make room for the angel and won't allow
  // both at once.
  //
  // The named skill's timer is left where it was, not advanced, so it resumes
  // on the same beat it was dismissed on. Empty for every other buff.
  string silences_skill_name = 23;
  // Milliseconds a separate press of this buff costs, for a buff GMS casts with
  // its own press instead of applying with a swing. It gives the buff a timer:
  // it is cast and recast like any other buff, instead of waiting for a swing
  // the fight may never pick. Not scaled by attack speed, like every buff cast.
  // 0 for a buff applied by a swing.
  int32 own_cast_delay_ms = 25;
  // What the buff grants the caster on top of `base`, only while someone else
  // is in the party. Unlike Skill.requires_party, which disables the whole
  // skill, and ally_base, which is what the others get. Applied as a separate
  // source, so final damage here multiplies instead of adding.
  SkillEffect with_party_base = 26;
  SkillEffect with_party_per_level = 27;
  // The chance each landed swing activates this, instead of the player casting
  // it. It exists for Empirical Knowledge: GMS rolls its stack on every attack
  // instead of giving the player a button.
  //
  // Read with `stacks` below and with cooldown_seconds, which is the wait
  // between rolls for a skill that has one. 0 for a buff started by a timer or
  // by the swing that applies it, which is every other buff.
  double raise_chance = 28;
  double raise_chance_per_level = 29;
  // How many copies can be active at once, each started by its own roll and
  // each lasting its own window. Unlike `stages`, which is one cast losing
  // strength step by step, these are gained one at a time and expire the same
  // way. Each copy grants all of the levers above, so three stacks are worth
  // three times one.
  //
  // Implemented as that many buff windows, like a staged buff; see
  // kMaxBuffWindows in combat/constants.h. The fight keeps them ordered by time
  // remaining, so the active windows are always the first ones. 0 means one, an
  // ordinary buff.
  int32 stacks = 30;
  // Whether a swing activates this only when it hits an afflicted enemy (one
  // with a status this game tracks, the same test
  // SkillEffect::final_dmg_pct_when_afflicted uses). It exists for Thief's
  // Cunning: GMS grants the window for debuffing something, so a character who
  // inflicts nothing never gets one.
  //
  // Any of the character's swings can trigger it; no specific attack applies
  // the buff. Read with cooldown_seconds, which is the wait between windows.
  bool needs_afflicted_target = 31;
}

// A chance for a swing to hit one of the enemies it reached harder, and what
// triggering it gives the character.
//
// Rolled once per swing, since GMS says "when attacking"; rolled per line, the
// recovery would be worth the swing's line count times as much. The damage is a
// share of what that enemy was already taking, unlike a Final Attack, so a
// stronger swing gives a stronger proc. Read at the skill's learned level.
message Proc {
  // damage_pct is the share added to that enemy's damage; hp_recover_pct is the
  // share of max HP restored. Nothing else here is read.
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  double chance = 3;
  double chance_per_level = 4;
}

// A burn a swing leaves on the enemies it hit: damage on its own timer for a
// while after the swing. It exists for Flame Sweep, GMS's "enemies struck by
// the flame are burned and take continuous damage".
//
// Casting again reapplies it: the duration restarts and the damage is
// recalculated, so a burn applied under a buff keeps the buffed damage for its
// whole duration. Where max_stacks allows, a second cast adds another stack and
// the monster burns for both.
//
// This isn't an AutoMode, which has its own reach, or a BuffPulse, which deals
// damage while a buff on the character is active. A burn is on the monster, and
// a monster that dies while burning takes the rest of the burn with it. Read at
// the skill's learned level.
message Dot {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // Seconds between ticks. Never scaled by attack speed; nothing on its own
  // timer is.
  double interval_seconds = 4;
  // Seconds it burns, from the swing that applied it, on the same base +
  // per_level * (L - 1) ladder as everything else. GMS lengthens several of its
  // poisons as they level.
  double duration_seconds = 5;
  double duration_seconds_per_level = 3;
  int32 lines = 6;
  // Chance it applies to each enemy the swing hit (0.30 == 30%). 0 means
  // certain, which is right for a burn a swing always leaves; only the poison a
  // rogue keeps on their claw is rolled.
  double chance = 7;
  double chance_per_level = 8;
  // How many stacks one monster can carry at once, each ticking for full
  // damage. A ladder instead of a fixed number because Toxic Venom's count
  // grows, floored when read: GMS's 2 + floor(L/6) is 2 through level 5, 3
  // through 11 and 4 at 12, which only a fractional step can follow. 0 means
  // one, an ordinary burn.
  double max_stacks = 9;
  double max_stacks_per_level = 10;
}

// A second hit the same swing lands at the same moment, folded into the one
// swing instead of separated in time. The benefit over adding the strikes
// together is that each part keeps its own multiplier and its own per-line
// bonus against ordinary monsters.
//
// It hits whatever the swing hit, being the same swing, and doesn't carry the
// swing's add-ons: a Final Attack rolls once for the swing, and a shadow copies
// the swing it was already copying.
//
// A hit can also carry things the rest of the swing doesn't. `final_dmg_pct`
// multiplies with the character's and swing's, as final damage sources always
// combine. `crit_rate` is added to the character's for this hit only (GMS only
// ever uses it for a guaranteed crit), and their critical damage is unchanged.
// `hp_recover_pct` is paid per line of every strike, while the swing's own is
// paid per cast.
//
// Read at the skill's learned level.
message SwingHit {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, under the swing's own Damage row.
  string label = 3;
  int32 lines = 4;
  // Attacks this hit lands, each of `lines` lines rolled separately, as
  // Skill.casts is for the swing. It exists for Sword Illusion's five
  // explosions. 0 means one, as for every other extra hit.
  int32 casts = 5;
  // Enemies this part hits, when GMS gives it its own count. It exists for
  // Jupiter Thunder: the orb hits one enemy and the current arcing off it hits
  // two, so this hit reaches more than the swing does. 0 uses the swing's
  // reach, as every other extra hit does; Divine Mark's brand explodes on
  // exactly what the hammer hit.
  int32 max_enemies = 6;
  // Whether the shadow skips this hit. It exists for Throwing Star Barrage:
  // GMS's "Does not apply to Shadow Partner" is said of the spread and nothing
  // else the Night Lord throws. False everywhere else, since a shadow copies
  // the whole swing including its hits.
  bool skips_mirror = 7;
}

// A swing made of single-target strikes spread across the enemies in reach,
// instead of one strike hitting all of them. Strikes spread out before any
// enemy takes a second, so the enemy count decides how hard each is hit.
// Against a lone boss every strike hits it; treated as an ordinary N-enemy
// swing, the skill would be worth a fraction of what GMS gives there.
message Scatter {
  // Strikes per cast. Each is the skill's own swing on one enemy: same
  // multiplier, same lines, everything the same but the target count.
  int32 hits = 1;
  // Final damage a strike keeps when it hits an enemy an earlier strike of the
  // same cast already hit. GMS says "Final Damage decreases by 55% for
  // subsequent flames", so -0.55. Flat, not compounding: the third strike on
  // one enemy is worth the same as the second.
  //
  // Read like every other final damage here, so 0 means a repeat strike is
  // worth as much as the first.
  double repeat_final_dmg_pct = 2;
  // Strikes added on top of `hits` for each burn stack on the group. This is
  // DoT Punisher's "1 additional orb for every 1 of your damage over time
  // stack(s) on enemies in range".
  //
  // The count is over the whole group and counts stacks, not burns: eight
  // monsters with one burn each count as eight, and one boss with a burn three
  // stacks deep counts as three. It is fixed when the cast lands, so burns this
  // swing applies don't affect its own count.
  //
  // 0 means `hits` is the whole count.
  double hits_per_dot = 3;
  // The most strikes the count can reach. Only read when hits_per_dot is set;
  // GMS states it for the same skill: "Up to 25 Flame Orbs can be summoned".
  int32 max_hits = 4;
  // The most strikes of one cast any single enemy can take. It exists for
  // Poison Nova: GMS caps it outright ("Explosion damage from poisonous clouds
  // can apply up to 3 times for each enemy"), where Megiddo Flame reduces
  // repeat damage instead. Strikes past the cap are lost, which is what happens
  // when fifteen clouds burst on a lone boss.
  //
  // 0 lets strikes stack as deep as the count allows, as for every other
  // scattered swing.
  int32 max_hits_per_enemy = 5;
}

// How many Freeze Stacks a strike adds to the I/L's pile, when GMS states a
// count for the skill instead of one per line from its element. It exists for
// Spirit of Snow: GMS gives 3 for a blizzard hitting a single enemy and the
// normal 1 when spread over a crowd, a bossing bonus built into the skill, not
// anything ice does.
//
// Both fields are read, so a skill that sets this states everything it adds,
// and the element only decides whether it adds any.
message FreezeBuild {
  // Stacks added by a strike hitting exactly one enemy.
  int32 alone = 1;
  // Stacks added by a strike hitting more than one.
  int32 crowd = 2;
}

// The stun a strike leaves: the third status this game tracks on a monster,
// after freeze and burn. A stunned enemy counts as afflicted, which is what
// final_dmg_pct_when_afflicted checks. Nothing here models a monster acting on
// a schedule, so the stun costs the enemy nothing else. Bosses resist the
// status, as every GMS boss does, but still take the damage bonus.
//
// It also boosts what other swings do to the stunned enemy, and the skill that
// applied the stun never gets its own bonus, as GMS specifies.
message Stun {
  double duration_seconds = 1;
  // Chance it applies to each enemy hit. 0 means certain, which is what a skill
  // with no stated chance means.
  double chance = 4;
  // Final damage a swing with `lifted_tag` gets against a stunned enemy, on top
  // of everything it already multiplies by. 0 for a stun that is only a status,
  // which is what a stun with no reader would be.
  double final_dmg_pct = 2;
  // Which swings get that bonus. Unset gives it to none, since a bonus every
  // swing gets could simply be granted by the skill.
  SkillTag lifted_tag = 3;
}

// The mark a strike leaves, and what using it up is worth. The same shape as a
// Stun, differing in the one thing that matters: a stun boosts every eligible
// swing for as long as it lasts, while a mark boosts one line and is gone, so a
// ten-line swing gets a tenth of the bonus.
//
// Unlike a stun, the skill that leaves a mark isn't excluded, since it has no
// element to qualify with.
message Mark {
  double duration_seconds = 1;
  // Final damage the line that uses up the mark gets, on top of everything it
  // already multiplies by.
  double final_dmg_pct = 2;
  // Which swings can use up a mark. Unset means none can, which would leave the
  // mark a status with no reader.
  SkillTag lifted_tag = 3;
}

// A swing the player holds instead of pressing: it pulses while the key is down
// and ends with one bigger attack when released. It exists for Lightning Orb,
// an orb that zaps eight enemies every 150ms for up to two seconds and then
// bursts.
//
// The pulse is the skill's own damage, lines and reach. This message holds the
// pulse timer, how long the hold can last and what it ends with.
// Skill.base_delay_ms is the shortest hold, not the whole swing, and only it is
// scaled by attack speed; the pulse timer is the skill's own rate, as with
// fixed_delay for key-down swings.
//
// Targets are chosen when the hold starts and never again. An orb that has
// killed its targets keeps zapping empty space, so the fight releases the key
// as soon as another pulse would gain nothing. That is why the hold's length
// has to be decided at all.
message Channel {
  int32 pulse_interval_ms = 1;
  // Pulses a full hold is worth. The hold can't last longer than these take.
  int32 max_pulses = 2;
  // The attack the hold ends with, read like an extra_hit: its own multiplier
  // and its own lines, landing once however long the hold lasted.
  SwingHit finish = 3;
  int32 finish_delay_ms = 4;
  // Share of every hit the player takes that is blocked while the key is held.
  // The hold is the protection, so it lasts exactly as long as the hold.
  double damage_taken_pct = 5;
  // What the hold grows into, and how many pulses it fires at its starting
  // strength first. It exists for Grand Guardian: GMS's cross grows a second
  // into the hold and hits about twice as hard after that.
  //
  // Read like `finish` (its own multiplier and lines), but landing every pulse
  // from `small_pulses` on instead of once at the end. Unset for a hold that
  // stays the same throughout, like Calamitous Cyclone.
  SwingHit grown = 6;
  int32 small_pulses = 7;

  // A hold paid for with charges that build up over time instead of with a
  // cooldown, so it is limited by what has been stored, not by the time since
  // the last press. This makes its length fit the situation: on a crowd each
  // press uses the one charge available, while against a boss charges build up
  // and are spent together. Set all three or none.
  double charge_seconds = 8;
  int32 max_charges = 9;
  // Pulses one charge pays for. GMS states the cost in seconds (one light per
  // second), so this is that second divided by the pulse interval, rounded down
  // to the pulses that fit.
  int32 pulses_per_charge = 10;
}

// A second attack the swing triggers, on its own cooldown. Unlike an AutoMode,
// which fires whatever the character is swinging, this only fires with the
// swing that triggers it. The cooldown is in real time, so a faster swing
// doesn't trigger more of them.
//
// It has its own targets and its own strikes, and it isn't the character's
// swing: no Final Attack follows it, no burn comes with it, and nothing in the
// book aimed at the skill by name affects it. What the skill itself states
// still applies, since the two are one skill.
message SideStrike {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // What the skill page calls it, above its damage row.
  string label = 3;
  // 0 for a strike that reaches as far as the swing that triggered it.
  int32 max_enemies = 4;
  int32 lines = 5;
  double cooldown_seconds = 6;
  // Read exactly as Skill.scatter is, for the same reason: Showdown throws six
  // shurikens that each chase one enemy, so the cast's value depends on how
  // many enemies they spread over.
  Scatter scatter = 7;
  // Attacks one swing triggers, each of `lines` lines rolled separately, as in
  // SwingHit.casts. It exists for Mighty Mjolnir: GMS leaves a shockwave on
  // every enemy the hammer tracks down. 0 means one, as for Showdown's
  // shuriken.
  int32 casts = 8;
}

// A stronger version of a skill's attack that lands in place of every Nth
// normal one. `skill_name` names the attack; empty upgrades the skill's own.
// Works with either timer: a form on a summon takes the place of a pulse in its
// interval, instead of getting an extra one.
//
// It replaces the attack instead of adding to it, so four landings are three
// normal ones and one of these. Normally the swing is what is counted;
// brands_each_enemy is the opposite case, a mark on each enemy that goes off on
// top of the attack that completes it. Read at the skill's learned level.
message EmpoweredForm {
  SkillEffect base = 1;
  SkillEffect per_level = 2;
  // The attack this form replaces, by display name. Every form on a passive
  // names one, since a passive has no attack of its own to upgrade. A skill
  // with several forms names one per form, as Greater Empowered Arrows does: it
  // upgrades every fourth Piercing Arrow II and every fourth Snipe, with one
  // 20-level ladder for both.
  string skill_name = 7;
  // How many swings of the named skill one of these replaces: 4 means three
  // normal swings, then this. Nothing happens without it.
  int32 casts_per_trigger = 3;
  // The form's reach, when it differs from the attack it replaces. Empty uses
  // the attack's own reach, which is right for a form that only hits harder;
  // see AttachEmpoweredForm. Ignored when brands_each_enemy is set, since then
  // the form hits exactly the enemies whose count came due.
  int32 max_enemies = 4;
  int32 lines = 5;
  // Extra hits this form lands, as Skill.extra_hit does for a swing: each has
  // its own multiplier, line count and reach. Empowered Piercing Arrow II
  // explodes at the end of its flight, and Empowered Snipe uses up the mark
  // Snipe left.
  repeated SwingHit extra_hit = 8;
  // Counts on each enemy the swing hits instead of on the swing. It exists for
  // Divine Judgment: every Blast marks the enemies it hits, and the mark
  // detonates on an enemy that has taken casts_per_trigger of them. This works
  // the opposite way to the default in two respects.
  //
  // It adds instead of replacing: the enemy that came due takes its normal hit
  // plus the detonation. And the count belongs to the enemy, so one that dies
  // before reaching it loses its count, while the rest of the swing hits
  // normally alongside the enemy that detonated.
  bool brands_each_enemy = 6;
}

// An extra bonus that applies only with certain weapons equipped, on top of
// what the skill gives with any weapon it accepts. It exists for Weapon
// Mastery: a Spearman's mastery applies equally to spears and polearms, but
// only a spear swings faster and hits harder.
//
// The weapons named here must be ones the skill accepts, since a bonus for a
// weapon that disables the whole skill would never be read.
message WeaponBonus {
  repeated EquipType required_equip_type = 1;
  // Flat, with no per-level part: every GMS bonus like this is the same at
  // level 1 as at max. Add one if a skill ever needs it.
  SkillEffect effect = 2;
}

// Which swing a boost applies to, for a skill with an empowered form. GMS
// decides per grant: Piercing Arrow - Reinforce names Piercing Arrow II and its
// empowered form, while the Paladin's Blast node boosts Blast and the Divine
// Brand it detonates separately.
enum BoostReach {
  // The normal swing only. This is right for every boost naming a skill with no
  // empowered form, and for most of those that have one.
  BOOST_REACH_ORDINARY = 0;
  BOOST_REACH_BOTH = 1;
  BOOST_REACH_EMPOWERED = 2;
}

// What one skill gives another by name. There are two kinds: structural grants
// (strikes, reach, the timer) and `effect`, a lever aimed at that skill instead
// of the character. Greater Vessel of Light is the first kind (a strike for
// Divine Charge and Blast, and reach for Divine Charge only); a Hyper Skill's
// Reinforce is the second.
//
// The structural part is applied to a copy of the target skill before its
// attack is built, so the damage chain, line count and reach all see a skill
// that already includes it. Read at the granting skill's learned level.
message SkillBoost {
  string skill_name = 1;
  // Lines added to every swing of the named skill. Flat: every GMS bonus like
  // this is +1 regardless of the granting skill's level.
  int32 lines = 2;
  // Enemies added to its reach at level 1, and how that grows, read the same
  // way as Skill.lines and Skill.lines_per_level: 0.2 is one more enemy every
  // fifth level, which is GMS's ceil(L/5).
  //
  // It adds to the skill's own reach with no limit, so it can take a swing past
  // what its hitbox covers; see Skill.max_enemies for why that is allowed.
  int32 max_enemies = 3;
  double max_enemies_per_level = 4;
  // The swing count at which a swing-counted skill now fires, replacing its own
  // count instead of adding to it; GMS says "reduces the strikes required to
  // 7", an absolute number. 0 leaves the count alone, which is true of every
  // boost but Speed Mirage II's. If two name the same skill the faster one
  // wins, since the counts can't be added.
  int32 attacks_per_cast = 5;
  // Share off the named skill's cooldown (0.30 == 30% shorter), applied to the
  // whole ladder so the reduction is the same share at every level. It exists
  // for Heaven's Hammer - Cooldown Cutter, which GMS states as "Cooldown:
  // -30%".
  //
  // Combines multiplicatively, like ignored defence: what two reductions leave
  // is the product of what each leaves, so the cooldown never reaches zero.
  double cooldown_pct = 8;
  // Lines added to each second hit the named skill lands: its opening hit and
  // every extra hit, in both its empowered and normal forms. Flat, like `lines`
  // above. It exists for the Marksman's two Extra Strike hypers: GMS adds their
  // attack to the arrow's fragment and to the mark Snipe leaves, which are hits
  // beside the swing, not lines of it.
  //
  // Separate from `lines` because these are different strikes: a swing whose
  // second hit is priced separately doesn't gain one just by gaining a line.
  int32 extra_hit_lines = 9;
  // Which of the two swings this applies to, when the named skill has an
  // empowered form. The form is its own swing and by default gets none of what
  // the parent gives the normal version. See EmpoweredForm.
  BoostReach reach = 10;
  // Percentage points added to the named skill's burn tick, counted once per
  // tick line, as effect.skill_pct below is for its swing.
  //
  // Separate from that lever because the burn isn't the swing. A burn keeps the
  // swing's ignored defence, boss damage and final damage (BurnFor starts from
  // its stat line, so what a boost gives the swing already reaches the burn),
  // but it has its own multiplier, so a boost to the tick has to say so. It
  // exists for Mist Eruption: GMS permanently raises Poison Mist's continuous
  // damage.
  //
  // Read at the granting skill's level, like everything here.
  double dot_skill_pct = 11;
  double dot_skill_pct_per_level = 12;
  // Seconds added to the named skill's burn duration. Separate from effect for
  // the same reason as the field above: the burn isn't the swing and has its
  // own timer. It exists for Poison Mist - Aftermath, which GMS states as
  // "Bonus 6 seconds of additional damage".
  //
  // Read at the granting skill's level. Always seconds, never a share, since
  // GMS states seconds.
  double dot_duration_seconds = 13;
  double dot_duration_seconds_per_level = 14;
  // Seconds added to the named skill's buff duration. Separate from the fields
  // above for the same reason they are separate from `effect`: a buff has its
  // own timer, and lengthening it isn't a lever it grants. It exists for Holy
  // Magic Shell - Persist, which GMS states as "Duration: +5 sec".
  //
  // Buff Duration then lengthens the total, since the boost is applied first: a
  // share added to the buff's duration applies to this too, because the
  // character has one buff of one length.
  double buff_duration_seconds = 15;
  // Hits added to the shield the named skill's buff creates, and the share it
  // reduces from a hit it can't block. The Holy Magic Shell - Extra Guard and -
  // Enhance hypers use them.
  //
  // Both are read at the granting skill's level and applied before the shield
  // is built, so there is one block count however many hypers improve it. The
  // share adds to the buff's own, unlike the other reductions it then
  // multiplies with, because both are one skill's statement of how much a
  // boss's hit is reduced under its shield.
  double shield_hits = 16;
  double shield_boss_damage_taken_pct = 17;
  // Levers only the named skill gets, on top of its own. Seven are read:
  // skill_pct, damage_pct, boss_pct, ied_pct, crit_rate, final_dmg_pct and
  // final_attack_chance, each combining with the target's own the usual way.
  // Any other lever is silently dropped, which //src/data_test:skill_test
  // rejects.
  //
  // The two damage levers differ: skill_pct is percentage points on the
  // target's own multiplier, worth its value once per line, while damage_pct is
  // a share of the character's damage that only this swing gets.
  //
  // These aren't folded into the copy above, because ignored defence would add
  // where it must multiply, and the copy is made before the damage chain knows
  // what it is hitting. They apply to the swing, so a lever meant for the
  // character belongs in the granting skill's own `base`.
  //
  // The exception is a passive with a Final Attack, which has something to
  // boost without swinging: three of the levers apply to that extra hit
  // instead, with skill_pct as points on the hit's own multiplier. Read at the
  // granting skill's learned level.
  SkillEffect effect = 6;
  SkillEffect effect_per_level = 7;
  // The level the granting skill must reach before any of this applies. 0 means
  // it applies from level 1, which is true of nearly all boosts.
  //
  // It exists for V Matrix boost nodes: GMS gives one a damage ladder from
  // level 1, a second bonus at 20 and a third at 40, so a node states them as
  // three boosts naming one skill instead of one boost describing a staircase.
  // Below the level the boost isn't read at all, which is why this gates the
  // whole message and not a single lever.
  int32 min_level = 18;
  // Hits added to the named skill's swing, each priced separately like
  // Skill.extra_hit: its own multiplier, strikes and reach. It exists for
  // Throwing Star Barrage: GMS widens Quad Star into three more directions
  // while the barrage is active, each throwing a full set of stars at enemies
  // the swing itself doesn't reach.
  //
  // Separate from `lines`, which deepens the swing the skill already throws:
  // this is a different strike, and it states its own damage. It is resolved at
  // the granting skill's level before being handed over, so the target doesn't
  // apply its own ladder to it a second time.
  repeated SwingHit extra_hit = 20;
  // What the named skill's Final Attack chance is multiplied by, after all
  // additive sources. 2.0 doubles it; 0 leaves it alone, which is true of every
  // boost but one. It exists for Storm of Arrows: GMS doubles Magic Arrow's
  // chance instead of adding points.
  //
  // A separate field, not one of the seven in `effect`, for the same reason as
  // dot_skill_pct: those add to what the target already has, and this scales
  // it. A doubled chance can exceed 100%, which RolledFinalAttack treats as one
  // guaranteed hit plus a roll for the remainder.
  double final_attack_chance_mult = 19;
}

// The heavier form of a skill that has two, with its own multiplier, reach and
// cooldown. Read at the same learned level as the skill that has it and priced
// exactly like that skill's own swing.
message WoundForm {
  string label = 1;
  SkillEffect base = 2;
  SkillEffect per_level = 3;
  int32 max_enemies = 4;
  int32 lines = 5;
  // Attacks one press lands, each of `lines` lines rolled separately, as in
  // Skill.casts. GMS's Trickblade slashes five times.
  int32 casts = 6;
  int32 base_delay_ms = 7;
  // The cooldown this form uses instead, when GMS charges more for the heavier
  // press. 0 keeps the skill's own.
  double cooldown_seconds = 8;
}

// The wound one swing leaves on one enemy, and what the skill that has it lands
// while a wound is at full depth. It is the sixth status this game tracks, and
// the only one a monster can't share: a new wound removes it from whichever
// monster had it, which is GMS's rule and not a simplification.
//
// It is set on the skill that reads it, not on the swings that leave it,
// because that is where GMS puts the mechanism, so the sources are listed here,
// the way a SkillBoost names what it boosts. The wound does nothing for a swing
// that finds one: it is a trigger, not a bonus.
message Wound {
  double duration_seconds = 1;
  int32 max_stacks = 2;
  // A swing that leaves a wound, and how deep. GMS's Assassinate leaves one
  // with its finishing blow, and every attack of Sonic Blow leaves three,
  // filling the wound at once.
  message Source {
    string skill_name = 1;
    int32 stacks = 2;
  }
  repeated Source source = 3;
  // What the skill lands instead while a wound is at full depth. The client
  // calls the two Eviscerate Success and Eviscerate Fail: one key, and the
  // wound decides which one fires, not the player, so the fight reads the
  // current state instead of choosing.
  WoundForm form = 4;
}

// A skill that must be learned to some level before another can be bought. GMS
// states this in the description; here it is structured data, because the
// skills tab has to enforce it, not just show it.
//
// `skill_name` is the required skill's display name, the same key a
// character's learned levels use, so the check doesn't need the catalog.
message SkillRequirement {
  string skill_name = 1;
  int32 level = 2;
}

// Where a skill is listed: a book, and its position on that book's page.
//
// The advancement's SP pool pays for the skill and the skills tab shows one
// page per advancement, so this also sets the SP stage; see
// StageForAdvancement. Every placement of one skill is at the same stage,
// because skills are only shared between jobs at the same advancement stage.
message SkillPlacement {
  JobAdvancement job_advancement = 1;
  // The skill's position on the book's page, counting from 1. This is GMS's
  // order, taken from the wiki's skill list for the job, so a player who knows
  // the class finds skills where they expect. Unique within a book; never
  // compared across books.
  //
  // This is the only ordering. What a skill does has no effect on where it is
  // listed (attacks aren't grouped above passives), because GMS doesn't sort
  // that way and a second rule would only conflict with this one.
  int32 skill_order = 2;
}

// Which kind of V Matrix node a skill is, or none for an ordinary skill. The
// kind determines level costs and the max level (see v_matrix.h), so a node
// names its kind instead of repeating a ladder every node of that kind shares.
enum VNodeKind {
  V_NODE_KIND_UNSPECIFIED = 0;
  // Shared by every job. Listed under JOB_ADVANCEMENT_COMMON, which is nobody's
  // advancement, so every matrix has it.
  V_NODE_KIND_COMMON = 1;
  // A job's own active skill on a cooldown. Four per job.
  V_NODE_KIND_JOB = 2;
  // A job's own passive that boosts one to four of the skills below it. Six per
  // job, and the only kind that goes past level 30.
  V_NODE_KIND_BOOST = 3;
  // Shared by every job in one line, like Weapon Aura, which every warrior has.
  // Priced and capped like a common node, since it is one; what differs is
  // where it is listed. No advancement belongs to every warrior and no other
  // line, so it names each 5th job book that lists it, and access comes down to
  // whether the character has one of those books.
  V_NODE_KIND_ARCHETYPE = 4;
}

// The definition of a skill, loaded from data/skills at startup and keyed by
// file stem. The Character's skill_levels map refers to the skill by its
// display `name`. The effect at learned level L is base + per_level * (L - 1),
// so `base` is the level-1 value and `per_level` the increase per level after
// that.
//
// Field numbers use the same two ranges as SkillEffect, by the same test: a
// general mechanism below 100, one job line's own from 100 up.
message Skill {
  string name = 1;
  SkillKind kind = 2;
  // Description for the inspect screen, taken from the GMS skill and trimmed to
  // the effects this game actually has. A skill whose wiki entry mentions
  // movement speed or an MP cost doesn't here, because neither exists for the
  // player.
  string description = 3;
  // Groups this skill belongs to, recorded so a group is available once
  // something needs it. See SkillTag.
  repeated SkillTag tags = 4;
  // The books that list this skill, and where it sits in each. With one
  // placement the file lives in that book's folder; with more, it lives in the
  // shared folder covering every book that lists it: data/skills/<line>/shared
  // or data/skills/shared/<stage>.
  //
  // Before writing a new skill, check those folders and the other jobs of its
  // line. If a job already has it, add a placement instead of a copy.
  repeated SkillPlacement placement = 5;
  reserved 6;
  // The highest level points can buy. A skill whose level is derived leaves
  // this unset and takes its max from the level cap; see
  // account_levels_per_level and SkillMaxLevel.
  int32 max_level = 7;
  // A skill nobody buys: its level is the account's highest character level
  // divided by this, rounded down, and it rises automatically as the account
  // does. Only Blessing of the Fairy uses it: GMS rewards every character on
  // the account for how far the highest one has got.
  //
  // Such a skill costs no SP, gets no granted levels, and is capped by the
  // level cap, so its max moves with kMaxLevel instead of being written here.
  int32 account_levels_per_level = 66;
  // Marks a link skill, and names the job line whose characters level it by
  // that line's first job (JOB_SWORDMAN for warriors). Another skill nobody
  // buys: its level comes from the account's characters of that line, three
  // levels each, with one line counting once however many characters are in it.
  // See //src/character:link.
  //
  // Such a skill costs no SP and gets no granted levels. Any character can have
  // it, whatever their job; that is the point. So it is listed under
  // JOB_ADVANCEMENT_LINK, which is nobody's book, and access depends on what
  // the account has equipped, not whose book it is in.
  Job link_line = 67;
  // What must be learned first, if anything. Named `required_skill` because
  // C++20 reserves `requires`.
  SkillRequirement required_skill = 8;
  // Weapon types this skill needs equipped. Empty means any weapon, which is
  // what most skills want, since the job decides a swordman's skills, not the
  // sword. An attack that lists weapons can't be used without one; a passive
  // that lists them grants nothing without one, which is how Final Attack
  // requires a sword or an axe.
  repeated EquipType required_equip_type = 9;
  // The swings this skill's Final Attack follows: only attacks with this tag
  // trigger it. Unset means every swing does, which is what the warriors' and
  // archers' Final Attacks want, since they depend on the weapon and
  // required_equip_type already covers that.
  SkillTag follows_skill_tag = 10;
  // Whether that Final Attack also follows attacks on their own timer (a
  // summon's discharge, a turret's shot, an aura's pulse), not just the
  // character's swings. Unset is the normal case and the reason the rule
  // exists: what a Rogue throws after their stars is thrown by the Rogue.
  //
  // It exists for Frost Ark. In GMS the ark is struck by lightning whatever
  // cast it, and one of the three skills the client lists is Thunder Sphere, an
  // orb the character leaves in place and never swings again.
  bool follows_own_clock = 58;

  SkillEffect base = 11;
  SkillEffect per_level = 12;
  // Levers a damage-dealing skill grants permanently, in addition to the ones
  // above that apply only to its own swing. It exists for Cruel Stab: GMS lists
  // its final damage under "[Passive Effects]", which belongs to the character
  // and applies to every other swing, and the per-lever split in
  // WithoutSwingLevers can't tell that apart from Assassinate's, which doesn't.
  // Arrow Illusion is the same case on a timer.
  //
  // Only read on attacks and auto attacks. Every other kind of skill already
  // keeps everything it grants, so a second block would add nothing.
  SkillEffect passive = 26;
  SkillEffect passive_per_level = 27;
  // What the skill grants on top of `base` with specific weapons equipped.
  repeated WeaponBonus weapon_bonus = 13;

  // How many enemies one swing hits; 0 means single target, like the basic
  // attack.
  //
  // GMS's `mobCount` is a cap reached only when that many monsters are inside
  // the hitbox. This fight has no positions, so a swing always hits its cap,
  // which overpays a skill with a small hitbox. So a cap GMS couldn't fill is
  // reduced to what its hitbox holds:
  //
  //     reach = floor(box width / 70) * (1 + floor(box height / 250))
  //
  // 70 pixels is a monster's width and 250 is one platform's height, so the
  // factors are how many fit side by side and how many platforms the swing
  // covers. This only lowers GMS's number, never raises it.
  //
  // The boxes are `lt`/`rb` in Skill.wz, and the rule assumes the box is the
  // whole area covered. Three kinds aren't, and keep their cap: a projectile
  // with no box, a box that moves with its shot, and one tile of an area attack
  // (the client's `areaDotCount`).
  //
  // The rule applies to what a skill states for itself. A SkillBoost's reach is
  // added on top and isn't limited by the box, so a hyper can take a swing past
  // the area it covers. That is deliberate: otherwise the hyper point would buy
  // nothing. A file whose reach was reduced says so at the top.
  int32 max_enemies = 14;
  // How many times one swing hits each enemy it reaches. Damage is skill_pct
  // per line, so a 90% 2-line skill deals 180% to each target. Unset/0 means 1.
  // This is the count at level 1.
  int32 lines = 15;
  // Lines gained per level, as a fraction. A line is whole, so this sets the
  // level at which the next one arrives: 1/15 is a line every fifteen levels.
  // See SkillLinesAt.
  double lines_per_level = 23;
  // Attacks one swing lands, each of `lines` lines against the same
  // `max_enemies`, as BuffPulse.casts is for a pulse. It exists for Sword
  // Illusion: GMS slashes twelve times for 275% four times, and folding that
  // into one 48-line swing would misrepresent the skill.
  //
  // Each attack rolls its own mastery and crits instead of sharing the swing's,
  // so the log shows twelve hits of four, as GMS does. The swing's value
  // doesn't change: the expectation of N attacks of L lines equals that of N*L.
  // Read through SkillCasts; 0 means one, as for every other swing.
  int32 casts = 56;
  // Milliseconds between those attacks when they don't land together: each hits
  // the enemies left after the previous one, so a wall that clears the twelve
  // in front of it moves on to the next twelve.
  //
  // The swing still only costs its cast time (GMS frees the player as soon as
  // the wall appears), so the interval orders the attacks without costing their
  // time. 0 for every other swing, whose attacks count as one moment however
  // GMS spaces them.
  int32 cast_interval_ms = 59;
  // What an arrow gains for each enemy it has already passed through, as a
  // fraction. It compounds: at 0.15 the second enemy hit takes 1.15 times the
  // first and the sixth takes 1.15^5 = 2.01 times, the doubling GMS mentions
  // beside the 15%. 0 for every skill that hits all targets equally, which is
  // every skill but Piercing Arrow.
  //
  // Which enemy an arrow reaches first is arbitrary here, since nothing has a
  // position, so the order is random. All of the swing's own lines land at the
  // same step, since the arrow passes once; the opening hit and the Final
  // Attack are other arrows and don't get the bonus.
  double pierce_gain_pct = 25;
  // How long one swing of this attack takes at average attack speed, in
  // milliseconds: the sum of its animation frames. GMS ties the delay to the
  // skill, not the weapon; a spear and a sword use the same skill at the same
  // speed, and the weapon matters through its attack-speed stage instead. See
  // SwingIntervalSeconds for how the stage scales this.
  //
  // Unset uses kDefaultSwingDelayMs, the basic attack's delay. Meaningless for
  // a SKILL_KIND_AUTO_ATTACK, which fires on cast_interval_seconds instead of
  // the character's swing.
  int32 base_delay_ms = 16;
  // Whether base_delay_ms is final, with no attack-speed scaling. True for
  // GMS's key-down skills (held instead of pressed, such as Hurricane and Arrow
  // Blaster), which fire at a fixed rate however fast the weapon is.
  //
  // A character whose only swing has this gets nothing from attack-speed
  // skills, as in GMS.
  bool fixed_delay = 19;
  // Seconds this skill is unavailable after use, in GMS time before the game's
  // own pacing stretches it. A swing with a cooldown can't be picked every
  // time, so the fight uses its other options while it recharges. That lets a
  // skill hit harder than the swing it interrupts without replacing it
  // entirely.
  //
  // Not the same as cast_interval_seconds, which is how often a skill that
  // attacks on its own fires. A skill sets one or the other, never both.
  double cooldown_seconds = 17;
  // Seconds the cooldown changes per level, negative for the usual case of a
  // skill that recharges faster as it levels; Heaven's Hammer goes from 29
  // seconds down to 15. Read together with the field above, only through
  // CooldownAt, which stops the pair at zero.
  double cooldown_seconds_per_level = 24;
  // Seconds between casts of a SKILL_KIND_AUTO_ATTACK, in GMS time before the
  // game's pacing stretches it. Usually the skill's cooldown, since the player
  // would fire a cooldown skill as soon as it's ready. Ignored for every other
  // kind. A skill with no interval never fires.
  double cast_interval_seconds = 18;
  // The second timer a SKILL_KIND_AUTO_ATTACK can use: swings landed instead of
  // seconds. Speed Mirage fires once every four swings.
  //
  // A skill uses one of the three timers. Counting attacks instead of seconds
  // keeps the skill worth the same with a fast or slow swing, and it is how GMS
  // states these, because the player is being rewarded for attacking.
  int32 attacks_per_cast = 20;
  // The third timer: enemies defeated instead of swings or seconds. Erda
  // Fountain fires once every twelve kills.
  //
  // A skill uses one of the three timers. Counting kills makes the skill useful
  // only against crowds: on a boss almost nothing dies, so it goes quiet
  // without needing to be told.
  int32 kills_per_cast = 35;
  // How many landed swings of this attack count as one toward attacks_per_cast.
  // Unset means one, the value of a normal swing.
  //
  // Above one for swings that land much faster than others: Arrow Blaster fires
  // every 120ms and uses seven, so 28 of its swings count as 4 normal ones.
  // Without this, a rapid swing would trigger every counter in the book several
  // times a second. GMS states the rule this way ("every 7 hits count as 1
  // successful strike"), so it is an integer here instead of a fraction.
  int32 hits_per_attack_count = 21;
  // Whether granted levels can take this skill past its master level. GMS
  // allows it for marked 4th job skills, so a 4th job skill that maxes at 30
  // has two more levels its own page never describes; they exist only while
  // something grants levels.
  //
  // Nothing else changes: SP still only buys up to the master level. See
  // kLevelsPastMasterLevel.
  bool exceeds_master_level = 22;

  // What this skill grants for a while when it activates, on the cooldown given
  // by cooldown_seconds. See Buff. An immediate heal on cast is the buff's
  // heal_pct.
  Buff buff = 28;
  // The burn this swing leaves on everything it hit. See Dot.
  Dot dot = 29;
  // The stronger swing this skill puts in place of every Nth swing of the skill
  // it names. Repeated because the Marksman's Greater Empowered Arrows upgrades
  // two different swings with one ladder. See EmpoweredForm.
  repeated EmpoweredForm empowered_form = 30;
  // A second hit this swing lands at the same moment, priced separately. See
  // SwingHit.
  repeated SwingHit extra_hit = 31;

  // The second attack this swing triggers, on its own cooldown. See SideStrike.
  SideStrike side_strike = 32;
  // What this skill also does on its own timer, alongside being a swing. See
  // AutoMode.
  repeated AutoMode auto_mode = 33;
  // What this skill gives the skills it names: strikes, reach, and levers only
  // that skill gets. Repeated because Greater Vessel of Light boosts two skills
  // with different things. See SkillBoost.
  repeated SkillBoost boost = 34;
  // A skill this one replaces, by display name: once both are learned the named
  // skill grants nothing. GMS says "boosted to" instead of "increased by" when
  // it means this.
  //
  // Only for a skill whose entire effect is replaced. Where two skills merely
  // overlap, the lever's own rule decides (two masteries already use the better
  // one). The replaced skill stays learned and keeps its page; it just stops
  // granting anything.
  string supersedes_skill_name = 36;
  // A group of skills that don't stack, named by the group, not a member:
  // within a group, each lever uses its best single source instead of the sum.
  //
  // Decided lever by lever and at the character's current levels, so neither
  // member has to be better everywhere: a Decent skill beats one with three
  // points in it and loses to a maxed one, and a lever only one of them grants
  // applies either way. That is the difference from supersedes_skill_name,
  // which decides at level 1 permanently.
  //
  // A group can have three members. Two granting the same amount of the same
  // lever count once, with the first-listed source taking it.
  string exclusive_group = 55;
  // How many times the opening hit strikes the enemies it picks. Damage is
  // SkillEffect.lead_pct per line, as `lines` uses skill_pct. Unset/0 means 1,
  // and it does nothing without a lead_pct.
  int32 lead_lines = 37;
  // How many of the enemies the swing reached the opening hit lands on,
  // healthiest first. Unset/0 means 1, the Rogue's "strikes one, then detonates
  // in place".
  //
  // Above 1 it is no longer an opening hit but a part of the swing that reaches
  // fewer enemies than the rest: Piercing Arrow II's fragment bounces off the
  // first enemy onto two of the eight the arrow went through. It is the same
  // field either way, because the fight handles both the same.
  int32 lead_enemies = 38;
  // How many enemies this Final Attack hits, which decides between two
  // behaviours. 0 follows the swing onto each enemy it hit, rolling separately
  // for each.
  //
  // Any other number rolls once for the whole swing and hits that many enemies
  // whatever the swing hit. Every GMS Final Attack is the second kind with 1:
  // the client gives none a mobCount, and their readouts name the target they
  // pick. A number instead of a flag because a split with its own mobCount can
  // still hit ten enemies off a swing that hit one.
  int32 final_attack_max_enemies = 39;
  // What the card calls this skill's Final Attack, when GMS gives the extra hit
  // its own name. Empty means "Final Attack".
  //
  // Display only; the lever is the same whatever its source. A skill that
  // reduces another skill's Final Attack names the skill, not the hit, since
  // the card can't tell which skill the character actually has.
  string final_attack_label = 63;
  // Whether the shadow skips this swing. It exists for Slash Shadow Formation:
  // GMS's "Also unaffected by the effects of Shadow Partner" is said of the
  // whole skill, not one hit in it.
  //
  // The narrower SwingHit.skips_mirror keeps the shadow off a single hit of a
  // swing it otherwise copies. When the swing sets this, every hit is covered
  // too, since a hit can't be copied by a shadow that never appeared.
  bool skips_mirror = 64;
  // Whether GMS skips this attack's cast animation, so pressing it costs only
  // the press. It exists for Slash Shadow Formation: the client lists the
  // actions it can be used during, which are the two swings a Shadower is
  // always in the middle of.
  //
  // base_delay_ms keeps the animation GMS would otherwise play, so the file
  // still matches the client. The swing is charged kWaivedCastMs, not scaled by
  // attack speed, since there is no animation left for a faster weapon to
  // shorten. A buff cast during a sequence works the same way.
  bool waives_cast = 65;

  // Whether this skill needs something in the secondary slot. Both Shield
  // Masteries require one, and secondaries exist in data/equip/secondary, so a
  // character without one equipped gets nothing; see SkillGearMet.
  bool requires_secondary = 40;
  // The chance this passive gives every swing to hit one enemy harder. Unset
  // for all but Mortal Blow; see Proc.
  Proc proc = 41;
  // The hold this swing is, if it is one. See Channel.
  Channel channel = 48;
  // How this swing scatters, if it does. See Scatter.
  Scatter scatter = 49;

  // What every other party member gets from this skill, read at the caster's
  // level like `base` and `per_level`. Empty for skills that don't benefit
  // anyone else, which is most of them.
  //
  // Separate from `base` instead of shared, because the two rarely match: Hex
  // of the Evil Eye gives an ally half of what it gives the caster, and
  // Parashock Guard's two halves have nothing in common. When they do match,
  // the file just states the same thing twice.
  //
  // Read at the ally's own effective level and no further: levels the party
  // granted them don't raise what they grant back. It is one pass, or two
  // characters with Combat Orders would keep raising each other.
  SkillEffect ally_base = 42;
  SkillEffect ally_per_level = 43;
  // Whether the skill's own effect needs someone else in the party. False for
  // every skill but Parashock Guard, which GMS only pays the caster while it
  // shields an ally, so alone it grants nothing.
  bool requires_party = 44;
  // Whether two allies with this skill both apply it. False is the buff rule
  // and the default: one Sharp Eyes covers the party however many archers cast
  // it, and everyone gets the better of the two.
  //
  // True for Blessed Ensemble and Blessed Harmony, which aren't buffs: they
  // reward the company kept, and GMS states them per Cleric.
  bool ally_effect_stacks = 45;
  // Whether the party effect above reaches one other member instead of all.
  // Only Divine Echo uses it: GMS puts the Paladin's echo on a single party
  // member, chosen by number key.
  //
  // Nobody is at the keyboard here, so it goes to the member who sorts first by
  // name, excluding the caster. Every client in the party computes the same
  // choice from the same roster, so nothing needs to be sent to agree on it.
  // See PartyGrants.
  bool ally_grant_reaches_one = 57;
  // Whether this is a Hyper Skill: bought with the character's separate Hyper
  // SP pool instead of their job stage's, shown on its own page, and gated by
  // required_level instead of by a lower skill.
  //
  // It still names the 4th-job advancement it belongs to, so a character's book
  // is found the same way either way. skill_order is therefore unique within
  // the pair of advancement and this flag, since a hyper page and a 4th job
  // page are two separate lists.
  bool hyper = 46;
  // The level the skill unlocks at. 0 for every skill whose advancement is the
  // only gate, which is all of them except hypers.
  int32 required_level = 47;

  // Which kind of V Matrix node this is, if any. Nodes are bought with V Points
  // instead of SP and follow their kind's ladder, so this is what distinguishes
  // them; see LearnSkill.
  VNodeKind v_node = 54;

  // Whether the player switches this skill on and off instead of just having
  // it. It exists for Righteously Indignant: a button that swaps the Bishop's
  // Vengeance forms in for their Benevolence skills while it is on. The switch
  // is stored on the character (see Character.active_skill), so it survives
  // saving and goes with them.
  //
  // What the toggle itself grants doesn't depend on the switch. GMS marks such
  // a grant "[Passive Effects]", which is permanent once learned, and grants
  // from active skills are already applied for that reason. The switch only
  // decides which form of each named skill is active.
  bool toggle = 50;
  // The skill this one replaces while `toggle_skill_name` is on, by display
  // name. The two share one row in the book: this form takes the other's place
  // on its page at its skill_order, and has whatever level the player bought
  // the other to.
  //
  // So a form costs no SP of its own, has no place in its book's numbering, and
  // adds nothing to the book's level requirements. It must name a skill from
  // its own advancement, or the page it replaces a row on wouldn't be the page
  // it is listed with.
  string replaces_skill_name = 51;
  // The toggle that enables this form, by display name. While it is off the
  // form grants and offers nothing; while it is on, the skill above stops
  // instead. See DormantSkillNames.
  string toggle_skill_name = 52;
  // How long this swing freezes what it hits. Freeze is a status on the
  // monster, not the character. A frozen monster can't move, so it can't hit
  // the player while the ice lasts, and Storm Magic, Shatter and Freezing
  // Crush's critical damage all check for it. GMS gives the seconds per skill:
  // Cold Beam and Ice Strike freeze for 8, Frostprey for 3.
  //
  // Not every ice swing freezes: GMS's Frozen Orb slows what it touches and
  // freezes nothing, so this is stated per skill instead of derived from the
  // element.
  double freeze_seconds = 53;
  // The stun this skill's strike leaves on what it hits, if any. See Stun.
  Stun stun = 60;
  // Seconds taken off this skill's next cooldown for each of its strikes that
  // hit nothing. It exists for Jupiter Thunder: GMS refunds 3.4 seconds per
  // unused shock, and on a map the barrage has just cleared that is most of the
  // thirty. In the boss fight it was built for, it refunds nothing.
  //
  // Only read when a swing's strikes are separated in time, since a swing
  // landing as one moment either hit something or didn't. See cast_interval_ms.
  double cooldown_refund_seconds = 61;
  // The mark this skill's strike leaves on what it hits, if any. Unset for
  // every skill but Angel of Balance. See Mark.
  Mark mark = 62;
  // From here down, each field belongs to one job line; see the message
  // comment. The Fighter's: how many Combo Orbs this skill surrounds the
  // character with at level 1, and how fast that grows, read the same way as
  // `lines` and `lines_per_level`, so 0.25 is one more orb every fourth level.
  // A character has one ring however many skills describe it: the largest count
  // wins, not the sum, which lets the Hero's Advanced Combo raise the Fighter's
  // five orbs to ten without replacing the skill that prices them.
  //
  // Does nothing without something reading it; see
  // SkillEffect::attack_per_combo_orb and final_dmg_pct_per_combo_orb.
  int32 combo_orbs = 100;
  double combo_orbs_per_level = 101;
  // The I/L Magician's. How many Freeze Stacks the character can hold at once,
  // and so whether they have any at all: 0 means the mechanism isn't learned.
  // An ice swing adds one per line and a lightning swing spends one per line;
  // what a held stack is worth is on the same skill, see
  // SkillEffect::crit_dmg_per_freeze_stack.
  int32 freeze_stack_cap = 102;
  // The I/L Magician's. What one strike of this skill adds to that pile, when
  // GMS states a count instead of one per line from the element. Unset for a
  // normal ice swing. See FreezeBuild.
  FreezeBuild freeze_build = 104;
  // The I/L Magician's. Lines this skill lands per Freeze Stack it spends, when
  // GMS states a rate instead of one stack per line for a lightning swing. It
  // exists for Jupiter Thunder: GMS spends one per five lines of its shocks, so
  // a pile of five lasts beyond the first shock instead of going with it. 0
  // means one, a normal lightning swing.
  int32 freeze_lines_per_spend = 105;
  // The F/P Magician's. How many burns SkillEffect::final_dmg_pct_per_dot
  // counts, and so whether it counts any: 0 means the mechanism isn't learned.
  // The largest cap wins instead of the sum, as with the Combo Orb ring above,
  // so Fervent Drain raises Elemental Drain's rate without replacing the count
  // they share.
  int32 dot_count_cap = 103;
  // The Shadower's. The wound this skill leaves on one enemy and the heavier
  // form it lands while one is at full depth. Unset for every skill but
  // Trickblade. See Wound.
  Wound wound = 106;
}
