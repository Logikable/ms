syntax = "proto3";

package ms;

// One item a mob can drop, with its chance per kill.
message MobDrop {
  // What falls, by data file stem. An equip goes one per drop into the equip
  // tab; a full tab loses it, because a queue the player cannot see is worse
  // than a drop they can be told about.
  oneof drop {
    string item = 1;   // an ItemPrototype
    string equip = 2;  // an EquipPrototype
  }
  // Chance each kill takes, e.g. 0.4 for a 40% chance or 0.00025 for one in
  // four thousand. Rolled per kill; a rate above one pays its whole part
  // outright and rolls the rest.
  double per_kill = 3;
}

// Where one monster stands in a boss arena: a cell on a grid `arena_width`
// cells across and `arena_height` down. Nothing here is a column count -- the
// arena stretches to the screen it is drawn on, and what these say is which
// bars sit further apart than which. The dragon's legs are under his wings
// because his sprite puts them there, and the numbers here are what says so.
message ArenaSpot {
  int32 x = 1;
  int32 y = 2;
}

// How a monster moves around a boss arena. Each step is drawn off the run's
// own CLOCK rather than rolled, so every client draws it in the same place
// with nothing sent between them. Scenery: a cell gates nothing. A step never
// lands where a player may stand, the arena drawing one bar per cell.
message ArenaWalk {
  // Milliseconds between steps. 0 stands still, as an unset walk does.
  int32 interval_ms = 1;
  // How far one step may carry it.
  enum Range {
    RANGE_UNSPECIFIED = 0;
    // Any other cell of the row it spawned on, arrived at rather than walked
    // to. Vellum alone, who blinks along his floor.
    RANGE_ROW = 1;
    // One cell up, down, left or right. Papulatus roams his whole room.
    RANGE_STEP = 2;
    // One cell left or right along the row it spawned on. Damien and Lotus
    // pace the row over the player's heads and never come down to the floor.
    RANGE_ROW_STEP = 3;
  }
  Range range = 2;
  // A rush across the arena now and then, in place of one ordinary step.
  // Unset never dashes, which is every walker but Damien.
  ArenaDash dash = 3;
  // A leap off its row and back. Unset never jumps, which is every walker but
  // the Guardian Angel Slime.
  ArenaJump jump = 4;
}

// A jump: off the row the monster walks and back down to the cell it left. It
// hangs where it landed for the whole of `hang_ms` and does not walk up there,
// so it can always come back down -- a jump never has to ask whether the cell
// below it is still free. The walk resumes a full interval after the landing.
message ArenaJump {
  // Milliseconds between jumps. 0 never jumps, as an unset jump does. Must be
  // longer than `hang_ms`, or the next one falls due before this one lands.
  int32 interval_ms = 1;
  // The row it jumps to. Above the row it walks, since the arena's rows count
  // downwards -- but nothing here requires that, and a monster that drops into
  // a pit is written the same way.
  int32 y = 2;
  // Milliseconds it stays up there.
  int32 hang_ms = 3;
}

// A dash: several cells in a row, one way, far quicker than the walk it
// interrupts. It stops early at anything it cannot enter -- the edge of the
// arena, or a cell the player may stand on -- and the walk picks up one
// interval after the last cell it reached.
message ArenaDash {
  // Milliseconds between dashes. 0 never dashes, as an unset dash does.
  int32 interval_ms = 1;
  // How many cells one carries it, wall permitting.
  int32 cells = 2;
  // Milliseconds a cell takes. This is what makes it read as a dash rather
  // than a walk: the arena is drawn every kFightPublishInterval, so a cell
  // shorter than that would be a jump instead of a run.
  int32 step_ms = 3;
}

// A mob type and how many of it stand in one encounter. Shared by the maps,
// where the count is a map's spawn points, and by the boss phases, where it is
// how many come out at once.
message Spawn {
  string mob = 1;  // Mob data file, by filename stem.
  // How many come out. A map says it here; a boss phase names a spot per
  // monster below instead and leaves this unset.
  int32 count = 2;
  // Where each of them stands, one spot per monster -- so the spots ARE the
  // count, and a phase cannot write a different number of each. Empty on a
  // map, which has no arena to stand anyone in.
  repeated ArenaSpot spots = 3;
  // How this monster wanders its arena. Unset stands still, which is nearly
  // every monster.
  ArenaWalk walk = 4;
}

// Static definition of a monster type. Loaded from data/mobs textprotos at
// startup; shared read-only across all spawns of the same type.
message Mob {
  string name = 1;
  int32 level = 2;
  int32 attack = 3;
  int64 max_hp = 4;
  int64 exp = 5;
  // Items this mob can drop.
  repeated MobDrop drops = 6;
  // Physical defense rate as a whole percent (PDR); reduces incoming damage
  // unless the attacker ignores it. Mirrors EquipStats percents. Every mob
  // file carries at least the regular 10, snails included, so that IED is
  // worth something everywhere rather than only against a boss; the bosses
  // set their own, higher.
  int32 pdr = 7;
  // True for bosses: they take 0.5x elemental base and are subject to boss%.
  bool boss = 8;
  // What the bestiary says about it, adapted from the wiki's own archive
  // entry. Empty for a mob the wiki writes nothing about; the inspect panel
  // then shows no blurb at all rather than a made-up one.
  string description = 9;
}
