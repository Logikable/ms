syntax = "proto3";

package ms;

import "src/protos/mob.proto";

// One stage of a boss fight. The next stage begins when the last mob of this
// one dies, so phases end on kills, not on a timer.
message BossPhase {
  // The mobs this phase spawns, each spawn saying where its monsters stand.
  repeated Spawn spawns = 1;
  // Every place the player can stand; the first is where they start. An arrow
  // key moves to the nearest spot strictly in that direction, so the layout of
  // the list decides where each arrow leads. See NextPlayerSpot in
  // src/combat/boss/boss_run.h. Only the first entry's position in the list
  // matters.
  repeated ArenaSpot player_spots = 2;
  // How many cells wide the arena is. Leftover room is spread across the gaps,
  // so this sets the margins as well as the spacing: a part in the last cell
  // sits against the edge of the screen. Unset means the width is taken from
  // the spots, for a phase that wants no margin.
  int32 arena_width = 3;
  int32 arena_height = 4;
  // The music for this phase, named by its file stem under bgm/. Empty keeps
  // whatever the previous phase played, which is what every phase after the
  // first of a one-track boss does.
  string bgm = 5;
  // Spots that open and close on the fight's clock, numbered after
  // `player_spots`.
  TimedSpots timed_spots = 6;
  // When set, the fight's clock drops to this many seconds as the phase starts
  // (if less is left, nothing changes), and running out ends the fight as a
  // failure. GMS's Hard Lucid gives her last phase 45 seconds.
  int32 time_limit_seconds = 7;
  // Readies every skill on a cooldown as the phase starts. GMS's Hard Lucid
  // does this for her last phase.
  bool reset_cooldowns = 8;
  // Forms the boss takes in turn on the phase's own clock, from the first,
  // looping until the phase ends. Each recolours the HP bar and changes the
  // music; nothing about the fight changes.
  repeated PhaseForm forms = 9;
  // This phase's Sacred Power, in place of the difficulty's. GMS's Seren and
  // Normal Kalos ask more of their second phase. 0 keeps the difficulty's.
  int32 sacred_power = 10;
  // Parts of the arena that only reach their own monsters (Spawn.zone).
  repeated PhaseZone zones = 11;
  // Too many players in one zone, and every one of them deals less to its
  // monsters. GMS's Kaling punishes three or more on one Peril.
  ZoneCrowding crowding = 12;
  // How players are put in zones as the phase starts and each time a zone's
  // monsters all die. Zones are filled in their listed order.
  ZonePlacement placement = 13;
}

// See PlacePlayers in src/combat/boss/placement.h.
enum ZonePlacement {
  ZONE_PLACEMENT_UNSPECIFIED = 0;  // nobody is moved
  // Evenly, at most two to a zone, the first zone filled first: Kaling's
  // rooms, where Taowu's shields make him the one to kill first.
  ZONE_PLACEMENT_SPREAD = 1;
  // Two to a zone, a pair moving on together: Kaling's last phase, where she
  // holds at each quarter until a Peril dies, so killing one at a time pays.
  ZONE_PLACEMENT_PAIRS = 2;
}

// A set of the phase's player spots: whoever stands on one is in the zone.
message PhaseZone {
  // Indices into the phase's player spots.
  repeated int32 spots = 1;
  // Set for a room of its own, as Kaling's first phase has one per Peril.
  ArenaRoom room = 2;
}

// A room laid beside the others in the phase's arena: the columns from `x`,
// `width` wide, the arena's full height. Whoever stands in it sees only it,
// and its monsters (Spawn.zone) never walk out of it.
message ArenaRoom {
  int32 x = 1;
  // 0 means it isn't a room, as does an unset message.
  int32 width = 2;
  // As BossPhase.bgm, for whoever is in it; empty keeps the phase's.
  string bgm = 3;
}

// A zone with at least `players` in it is crowded: everyone there deals
// `damage_pct` percent to its monsters. 0 players means never, as does an unset
// message.
message ZoneCrowding {
  int32 players = 1;
  int32 damage_pct = 2;
}

// One of a phase's forms: GMS's Seren cycles Noon, Dusk, Midnight and Dawn.
message PhaseForm {
  // Shown in the fight's heading after the phase.
  string name = 1;
  int32 seconds = 2;
  HpBarColor hp_bar = 3;
  // As BossPhase.bgm; empty keeps the phase's.
  string bgm = 4;
}

// Extra places to stand that open every `interval_ms` of fight time, measured
// from the end of the countdown, and stay open for `open_ms`. When they close,
// anyone on one drops
// to the nearest free fixed spot, in party order; see DropFromClosedSpots in
// src/combat/boss/arena_spots.h.
message TimedSpots {
  // 0 means they never open, as does an unset message.
  int32 interval_ms = 1;
  // Must be shorter than `interval_ms`, or the guard's.
  int32 open_ms = 2;
  repeated ArenaSpot spots = 3;
  // Opens with each opening of the phase's guard (Spawn.guard), for `open_ms`,
  // in place of `interval_ms`: Gloom's tentacles are the strike that bares its
  // eye.
  bool follow_guard = 4;
}

// One difficulty of one boss: what the player fights, how long they have and
// what it pays. Every boss is daily (src/character/boss_reset.h).
message BossDifficulty {
  string name = 1;  // "Normal"
  // Fought in order.
  repeated BossPhase phases = 2;
  reserved 3;
  reserved "reset";
  // Seconds allowed for the whole fight. Running out ends it without a clear.
  int32 time_limit_seconds = 4;
  repeated MobDrop drops = 5;
  // Meso paid for a clear, on top of the drops. Zakum's stands in for the
  // Intense Power Crystal that GMS drops and everyone sells straight away.
  //
  // The character's Meso% doesn't apply, so the rewards list can show one exact
  // number. The drops still scale with Item Drop Rate, as a monster's do.
  int64 meso = 6;
  // EXP paid for a clear, on top of what the parts are worth. All of Horntail's
  // reward is here, because GMS pays it for the clear, not for the eight
  // bodies, and says no EXP boost applies. So this is flat, like the meso.
  int64 exp = 7;
  // The level needed to enter this difficulty; unset means only the boss
  // screen's own gate applies. Set per difficulty because each step of a ladder
  // opens at a different level.
  int32 unlock_level = 8;
  // A fight that is written down but not built yet. The screen lists it dimmed
  // and shows only each phase's HP. There is no timer, reset or reward to show
  // because none has been decided.
  bool coming_soon = 9;
  // The Arcane Force the fight requires, weighed as an Arcane River map weighs
  // it: short of it the player deals less, never is kept out. 0 requires none.
  int32 arcane_force = 10;
  // Sol Erda Energy a clear pays each member, unsplit, from GMS's table: 50
  // for Hard Damien, 120 for Hard Verus Hilla. Paid only with the sixth_job
  // switch on.
  int64 sol_erda_energy = 11;
  // The Sacred Power the fight requires, as a Grandis map requires it. A
  // difficulty sets this or arcane_force, not both.
  int32 sacred_power = 12;
}

// A boss and every difficulty it can be fought at, loaded from data/bosses at
// startup. It has no level field: the level comes from the mobs its phases
// spawn, so the two can't disagree.
message Boss {
  string name = 1;
  repeated BossDifficulty difficulties = 2;
  // The boss screen's page that lists it, from 1; 0 is the first page too.
  int32 page = 3;
}
