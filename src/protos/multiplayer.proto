syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/equip.proto";

// Messages between the client and the server. None of this is saved to disk, so
// field numbers can move, but both ends must agree on them. That is what
// kMultiplayerVersion in //src/multiplayer:protocol is for: when a message
// changes, bump the version and older clients are turned away instead of
// misread.

// How a party shares what it kills.
enum PartyMode {
  PARTY_MODE_UNSPECIFIED = 0;
  // One boss and one set of drops: meso and drop rolls are divided by the
  // number of players.
  PARTY_MODE_SHARED = 1;
  // Each player fights their own copy of the boss and is paid as if they came
  // alone.
  PARTY_MODE_SOLO_TOGETHER = 2;
}

// The options a player has turned on in the boss screen's options row. Every
// party member must have the same ones, or the leader's start is refused, since
// a fight can't pay one player and not another.
message BossOptions {
  // Practice: the fight ignores the reset timer and uses up no clear, and pays
  // nothing.
  bool practice = 1;
}

// One player as others see them: the character they bring, and the account that
// identifies them across connections.
message PlayerInfo {
  // Issued by the server the first time a player connects and sent back on
  // every later connection. Empty in a new player's Hello.
  string account_id = 1;
  string name = 2;
  int32 level = 3;
  JobAdvancement job = 4;

  // The character as the Inspect screen draws them, built by PublicSheet, which
  // clears everything a party doesn't need.
  //
  // The whole character is sent, not a table of numbers, so the screen showing
  // it runs the same stat code as the owner's panels. Items are referred to by
  // name, so the sheet only makes sense to a client with the same catalogs,
  // which the protocol version guarantees. The lobby listing strips it.
  Character sheet = 5;

  // Boss clears this character has that still count against the reset timer.
  // Sent separately from the sheet, which strips them: what party members may
  // see about someone is a different question from what the server must check
  // before letting a party into a daily. Stripped from the listing along with
  // the sheet.
  repeated BossClear boss_clears = 6;

  // Whether this player has Autoswap Presets on. It sits beside the sheet, not
  // in it, because it is an account setting, not a character one. It is still
  // sent with the player so others read their sheet the way they do.
  bool autoswap_presets = 7;

  // The options they have set on the boss screen, which the server requires
  // every party member to match.
  BossOptions boss_options = 8;

  // The best level each of the account's other characters has reached in its
  // job line, keyed by that line's second job (int32 because of a proto3 map
  // limitation). It sits beside the sheet for the same reason as
  // autoswap_presets: it is the account's progress, not this character's, and
  // their link skills can't be worked out from the sheet alone. See
  // //src/character:link.
  map<int32, int32> link_lines = 9;
}

// One player's place in a party.
message PartyMember {
  PlayerInfo player = 1;
  // Whether they have marked themselves ready. Cleared for everyone whenever
  // the party's members or leader change, so nobody is pulled into a fight on a
  // ready given for a different party. The leader is always ready and never
  // sets this.
  bool ready = 2;
}

// A party waiting in the lobby. It only lists people; the leader picks the
// fight when starting it.
message Party {
  string id = 1;
  // The party's leader, who starts the fight. When the leader leaves, the
  // member who joined first takes over.
  string leader_account_id = 2;
  repeated PartyMember members = 3;
}

// The first message a client sends. It includes the character's current state,
// since they level between connections.
message Hello {
  int32 protocol_version = 1;
  // The token the server issued last time; empty for a player it has never
  // seen. The account it belongs to is in player.account_id.
  string token = 2;
  PlayerInfo player = 3;
}

// The character's current state, sent when they level up or change their name.
// Without it a party would keep showing members as they were when they joined.
message UpdatePlayer {
  PlayerInfo player = 1;
}

message CreateParty {}

message JoinParty {
  string party_id = 1;
}

message LeaveParty {}

// Leader only. The party leaves the lobby list and the fight begins.
message StartFight {
  // Which fight: a key into the boss catalog and an index into its
  // difficulties.
  string boss_key = 1;
  int32 difficulty_index = 2;
  PartyMode mode = 3;
  // The leader's options, which every member's must match.
  BossOptions options = 4;
}

message SetReady {
  bool ready = 1;
}

// Leader only. Both refer to a member by their account.
message KickMember {
  string account_id = 1;
}

message PromoteMember {
  string account_id = 1;
}

// One damage number as it landed. `slot` is a position in the phase's roster,
// counted in spawn order, so both ends use the same number for the same
// monster. The damage is the full number the player saw, which is also what is
// subtracted from the shared roster, so the two can't disagree.
message FightDamage {
  int32 slot = 1;
  // Shared by every line one attack put on one monster, so an eight-hit swing
  // shows as one stack of eight, not eight stacks of one.
  int32 event = 2;
  // The source of the damage, as a DamageOrigin and an index within it (which
  // summon, which burn). A monster shows at most one stack per player per
  // source.
  int32 origin = 3;
  int32 source_index = 4;
  int64 damage = 5;
  bool crit = 6;
  // Which hit of the event this line belongs to, so a twelve-hit swing also
  // shows as twelve flashes on other players' screens.
  int32 strike = 7;
}

// One skill's row in a player's damage breakdown; see DamageBreakdown.
message FightBreakdownRow {
  string skill = 1;
  double damage = 2;
  int64 casts = 3;
  int64 lines = 4;
}

// One player's full breakdown at the end of the fight.
message FightBreakdown {
  string account_id = 1;
  string name = 2;
  repeated FightBreakdownRow rows = 3;
}

// The damage one client's fight has dealt since its last update, and what its
// player is doing. Sent only while a fight is running.
message FightUpdate {
  repeated FightDamage lines = 1;
  // The phase the damage was dealt in. A report that crosses a phase change is
  // dropped instead of being applied to the next phase's roster.
  int32 phase = 2;
  // Which of the phase's player spots this player has moved to. The client
  // moves first and the server says whether the spot was free.
  int32 spot = 3;
  // The swing being charged and its progress, for the bar over this player's
  // panel on everyone else's screen.
  string attack_name = 4;
  double attack_fraction = 5;
  // This player's Item Drop Rate, as a fraction. The clear rolls drops at the
  // party's highest rate, as if one member's rate covered everyone.
  double item_drop_pct = 6;
  // How many buffs this player has active, shown as dots on that bar.
  int32 buff_count = 7;
  // Their damage by skill over the whole fight so far, replacing the previous
  // one. Sent together with the lines it counts, so the totals everyone sees at
  // the end match what was subtracted from the roster.
  repeated FightBreakdownRow breakdown = 8;
}

// One player as the rest of the party sees them during a fight.
message FightPlayerState {
  string account_id = 1;
  string name = 2;
  int32 spot = 3;
  // False once their client has disconnected. They deal no more damage, get no
  // reward, and the fight continues without them.
  bool present = 4;
  string attack_name = 5;
  double attack_fraction = 6;
  // Damage they have dealt since the last update. A client skips its own lines,
  // since it already drew them.
  repeated FightDamage lines = 7;
  int32 buff_count = 8;
}

// The server's view of the fight, sent to every participant about ten times a
// second. The first one a client receives tells it the fight has started.
message FightState {
  // What the fight is doing. The ways it can end are in FightEnded.
  enum Stage {
    STAGE_UNSPECIFIED = 0;
    COUNTDOWN = 1;
    FIGHTING = 2;
    PHASE_GAP = 3;
  }
  // Which fight this is, so a client that left one can tell a late update for
  // it from the party's next fight.
  string fight_id = 9;
  string boss_key = 1;
  int32 difficulty_index = 2;
  Stage stage = 3;
  // Counted from 0, like the difficulty's phases.
  int32 phase = 4;
  double seconds_left = 5;
  double countdown_left = 6;
  // The HP fraction left for each monster in the phase, one per slot.
  repeated double hp_fractions = 7;
  repeated FightPlayerState players = 8;
  // The options the fight was started with. Sent with the fight instead of read
  // from each client's own setting, so toggling one mid-fight can't change what
  // this fight pays.
  BossOptions options = 10;
}

// One item a clear gave this player.
message FightAward {
  // The item that dropped, by data file stem, as in MobDrop.
  oneof drop {
    string item = 1;   // an ItemPrototype
    string equip = 2;  // an EquipPrototype
  }
  int64 count = 3;
}

// The fight is over. Meso is divided by `share_count` and EXP isn't; each
// client works both out for itself. The server hands out drops, because only it
// can give an item to exactly one player.
message FightEnded {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    CLEARED = 1;
    TIMED_OUT = 2;
    // Every client left. Nobody is paid and nobody's entry is used up.
    ABANDONED = 3;
  }
  Outcome outcome = 1;
  // How many players the fight started with, which the clear is divided by. A
  // player leaving doesn't give the others a bigger share.
  int32 share_count = 2;
  // What this player won. The server rolls each of the boss's drops once at its
  // listed chance and gives any drop to a random player. That way a guaranteed
  // drop always drops; rolling per player at a divided chance could give it to
  // nobody.
  repeated FightAward awards = 3;
  // Everyone's damage by skill, including players who left, as each last
  // reported it.
  repeated FightBreakdown breakdowns = 4;
}

// Leaving a fight in progress. The player is removed exactly as if their client
// had disconnected: they deal no more damage, get no reward, and the fight
// continues for the others.
message LeaveFight {}

// One stack in a trade: what it is and how many. Referred to by name, like
// everything sent over the wire, since an index into a bag the other end can't
// see is meaningless there.
message TradeStack {
  string name = 1;
  int32 count = 2;
}

// What one side of a trade offers: the two currencies worth trading, and the
// items. An equip is sent whole, with its scrolls, stars, hammers and
// potential, so the other end rebuilds that exact item and not a fresh copy of
// its prototype.
message TradeOffer {
  int64 meso = 1;
  int64 spell_traces = 2;
  repeated Equip equips = 3;
  repeated TradeStack stacks = 4;
}

// Trade with the named player. Both sides send it: the first opens the trade
// and the second joins the one they were invited to, so one message does both.
message RequestTrade {
  string account_id = 1;
}

// This player's whole offer, not a change to it, so two changes sent at once
// can't add up to an offer nobody made.
message SetTradeOffer {
  TradeOffer offer = 1;
}

// Leaving the trade screen, which ends the trade for both players.
message LeaveTrade {}

// Accept what is offered, or withdraw acceptance.
message AcceptTrade {
  bool accepted = 1;
}

// The answer to the finalize dialog. Cancelling clears only this player's
// acceptance; the other side keeps theirs, so one keypress brings the dialog
// back.
message ConfirmTrade {
  bool confirmed = 1;
}

// The trade this client is in. An empty id means none, which covers leaving,
// being left, and never having traded.
message TradeState {
  string id = 1;
  string partner_account_id = 2;
  string partner_name = 3;
  // False while the other player has been invited but hasn't pressed Trade
  // back. Their panel shows no name until then.
  bool partner_joined = 4;
  TradeOffer mine = 5;
  TradeOffer theirs = 6;
  // Whether each side has accepted the current offers. Both are cleared
  // whenever either offer changes, so an accept always refers to the offer the
  // player saw when they gave it.
  bool mine_accepted = 7;
  bool theirs_accepted = 8;
  // Whether this player has confirmed and is waiting for the other. The trade
  // goes through as soon as both confirm, so only one side is ever waiting.
  bool mine_confirmed = 9;
}

// A message worth showing the player wherever they are, in the gold box in the
// corner of the screen. One string per line, shown exactly as written: the box
// is small and nothing wraps the text.
message Notification {
  repeated string lines = 1;
}

// The player this client has open on the Inspect screen, so the server sends
// their sheet and keeps it up to date. An empty account means the screen
// closed. Only one at a time, since the screen shows one player.
message WatchPlayer {
  string account_id = 1;
}

// The heartbeat. A session that is silent for kSessionTimeout is dropped.
message Ping {}

message ClientMessage {
  oneof kind {
    Hello hello = 1;
    CreateParty create_party = 2;
    JoinParty join_party = 3;
    LeaveParty leave_party = 4;
    StartFight start_fight = 5;
    Ping ping = 6;
    UpdatePlayer update_player = 7;
    SetReady set_ready = 8;
    KickMember kick_member = 9;
    PromoteMember promote_member = 10;
    FightUpdate fight_update = 11;
    LeaveFight leave_fight = 12;
    WatchPlayer watch_player = 13;
    RequestTrade request_trade = 14;
    SetTradeOffer set_trade_offer = 15;
    LeaveTrade leave_trade = 16;
    AcceptTrade accept_trade = 17;
    ConfirmTrade confirm_trade = 18;
  }
}

// The reply to a Hello the server accepted.
message Welcome {
  // The player's account: the one they sent, or a new one for a player the
  // server has never seen.
  string account_id = 1;
  // Sent back on the next connection to prove the account is theirs.
  string token = 2;
}

// Why the server is closing the connection. `message` is meant to be shown to
// the player as is.
message Rejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    // The client's protocol version doesn't match the server's.
    REASON_UPDATE_REQUIRED = 1;
    // The server is shutting down or has been taken offline.
    REASON_MAINTENANCE = 2;
    // The account and token don't match.
    REASON_BAD_CREDENTIALS = 3;
    // The client sent something unreadable or out of order.
    REASON_MALFORMED = 4;
  }
  Reason reason = 1;
  int32 server_protocol_version = 2;
  string message = 3;
}

// An action the server refused. The connection stays open.
message Refused {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_PARTY_GONE = 1;
    REASON_PARTY_FULL = 2;
    REASON_FIGHT_STARTED = 3;
    REASON_NOT_LEADER = 4;
    REASON_ALREADY_IN_PARTY = 5;
    REASON_NOT_IN_PARTY = 6;
    REASON_UNKNOWN_BOSS = 7;
    // The server is draining before an update and accepts nothing new.
    REASON_DRAINING = 8;
    // The character is below the fight's required level.
    REASON_LEVEL_TOO_LOW = 9;
    // A kick or promotion named someone who isn't in the party.
    REASON_NOT_A_MEMBER = 10;
    // Someone in the party has already claimed this fight's reward.
    REASON_ALREADY_CLEARED = 11;
    // Someone in the party hasn't marked themselves ready.
    REASON_NOT_READY = 12;
    // Party members have different options set for the fight.
    REASON_OPTIONS_DIFFER = 13;
    // The player invited to trade is in a fight or already trading, or the
    // inviter is. The reply doesn't say which, since the other player's
    // situation is their own business.
    REASON_BUSY = 14;
    // They went offline between the menu opening and Enter being pressed.
    REASON_PLAYER_GONE = 15;
  }
  Reason reason = 1;
  string message = 2;
}

// Every party open to join. Sent whenever the list changes, so clients never
// have to ask.
message PartyList {
  repeated Party parties = 1;
}

// Everyone connected, as the Players list shows them. Sent whenever someone
// connects or disconnects, in the order they arrived.
//
// Sheets are left out, as in the party list: a client sends a new sheet
// whenever its character changes, and including every sheet would send all of
// them to everybody. WatchPlayer requests one.
message OnlinePlayers {
  repeated PlayerInfo players = 1;
}

// The full sheet of the player this client is watching. Sent when watching
// starts and again whenever their character changes.
message PlayerSheet {
  PlayerInfo player = 1;
}

// The party this client is in. An empty `party` means none, which covers
// leaving, the party being closed, and never having joined.
message PartyState {
  Party party = 1;
}

// Something that happened to this player's party membership that the new state
// can't show by itself: being kicked and leaving both arrive as no party.
message PartyEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KICKED = 1;
    PROMOTED = 2;
  }
  Kind kind = 1;
  // Meant to be shown to the player as is.
  string message = 2;
}

// A completed trade, sent to both sides as the trade closes. It holds what this
// player receives. What they offered has already left them, so applying it
// means removing their own offer and adding this.
message TradeCompleted {
  TradeOffer received = 1;
}

message Pong {}

message ServerMessage {
  oneof kind {
    Welcome welcome = 1;
    Rejected rejected = 2;
    Refused refused = 3;
    PartyList party_list = 4;
    PartyState party_state = 5;
    Pong pong = 6;
    PartyEvent party_event = 7;
    FightState fight_state = 8;
    FightEnded fight_ended = 9;
    OnlinePlayers online_players = 10;
    PlayerSheet player_sheet = 11;
    TradeState trade_state = 12;
    Notification notification = 13;
    TradeCompleted trade_completed = 14;
  }
}
