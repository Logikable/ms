syntax = "proto3";

package ms;

import "src/protos/mob.proto";

// How often a boss can be cleared again. The clock turns over at 4am local
// time; see src/character/boss_reset.h.
enum ResetPeriod {
  RESET_PERIOD_UNSPECIFIED = 0;
  RESET_PERIOD_DAILY = 1;
  RESET_PERIOD_WEEKLY = 2;
}

// One stage of a boss fight. The next stage begins when the last mob of this
// one dies, so phases end on kills, not on a timer.
message BossPhase {
  // The mobs this phase spawns, each spawn saying where its monsters stand.
  repeated Spawn spawns = 1;
  // Every place the player can stand; the first is where they start. An arrow
  // key moves to the nearest spot strictly in that direction, so the layout of
  // the list decides where each arrow leads. See NextPlayerSpot in
  // src/combat/boss_run.h. Only the first entry's position in the list matters.
  repeated ArenaSpot player_spots = 2;
  // How many cells wide the arena is. Leftover room is spread across the gaps,
  // so this sets the margins as well as the spacing: a part in the last cell
  // sits against the edge of the screen. Unset means the width is taken from
  // the spots, for a phase that wants no margin.
  int32 arena_width = 3;
  int32 arena_height = 4;
  // The music for this phase, named by its file stem under bgm/. Empty keeps
  // whatever the previous phase played, which is what every phase after the
  // first of a one-track boss does.
  string bgm = 5;
}

// One difficulty of one boss: what the player fights, how long they have, how
// often they may come back, and what it pays.
message BossDifficulty {
  string name = 1;  // "Normal"
  // Fought in order. Zakum's phase 1 is all eight of his arms at once.
  repeated BossPhase phases = 2;
  ResetPeriod reset = 3;
  // Seconds allowed for the whole fight. Running out ends it without a clear.
  int32 time_limit_seconds = 4;
  repeated MobDrop drops = 5;
  // Meso paid for a clear, on top of the drops. Zakum's stands in for the
  // Intense Power Crystal that GMS drops and everyone sells straight away.
  //
  // The character's Meso% doesn't apply, so the rewards list can show one exact
  // number. The drops still scale with Item Drop Rate, as a monster's do.
  int64 meso = 6;
  // EXP paid for a clear, on top of what the parts are worth. All of Horntail's
  // reward is here, because GMS pays it for the clear, not for the eight
  // bodies, and says no EXP boost applies. So this is flat, like the meso.
  int64 exp = 7;
  // The level needed to enter this difficulty; unset means only the boss
  // screen's own gate applies. Set per difficulty because each step of a ladder
  // opens at a different level.
  int32 unlock_level = 8;
  // A fight that is written down but not built yet. The screen lists it dimmed
  // and shows only each phase's HP. There is no timer, reset or reward to show
  // because none has been decided.
  bool coming_soon = 9;
}

// A boss and every difficulty it can be fought at, loaded from data/bosses at
// startup. It has no level field: the level comes from the mobs its phases
// spawn, so the two can't disagree.
message Boss {
  string name = 1;
  repeated BossDifficulty difficulties = 2;
}
