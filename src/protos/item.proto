syntax = "proto3";

package ms;

import "src/protos/equip.proto";

// The colour of a currency's mark. The mark's shape says which stage of the
// game the token belongs to and its colour says which piece it buys, so the
// player can read both from one glyph without a legend.
enum CurrencyColor {
  CURRENCY_COLOR_UNSPECIFIED = 0;
  CURRENCY_COLOR_THEME = 1;
  CURRENCY_COLOR_ORANGE = 2;
  CURRENCY_COLOR_PURPLE = 3;
  // Root Abyss armour, one colour per piece. All three sit in the shop
  // together, so no two may look like shades of each other.
  CURRENCY_COLOR_GOLD = 4;
  CURRENCY_COLOR_GREEN = 5;
  CURRENCY_COLOR_PINK = 6;
}

// What a stackable item is for, when nothing else about it says so. Setting one
// of these makes the item a currency: it is counted in the character's purse
// instead of carried on the Etc tab, so it takes no slot and has no stack
// limit. Ordinary drops leave this unset.
enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  // Spent to buy scrolls.
  ITEM_KIND_SPELL_TRACE = 1;
  // A currency a shop accepts as payment. These items also set currency_mark,
  // the symbol the shop draws for them.
  ITEM_KIND_TOKEN = 2;
  // A boss's own drop, one per boss.
  ITEM_KIND_SOUL_SHARD = 3;
}

// The definition of a stackable item type, loaded from data/items at startup
// and shared read-only by every stack of that type.
message ItemPrototype {
  string name = 1;
  // 2 was `category`, whose only value was Etc: every stackable goes on the Etc
  // tab.
  reserved 2;
  // Maximum stack per slot. 0 means the default of 200 (see
  // StackableItem::max_stack). Currencies ignore this: they are counted in the
  // purse, not carried, and have no limit (see ItemKind).
  int32 max_stack = 3;
  // Meso paid when sold to a shop. Zero is still a price: every item can be
  // sold, and one worth nothing is thrown away. Currencies are never sold
  // because they aren't in the bag.
  int32 sell_price = 4;
  // One sentence describing the item, for the inspect screen. A stack has no
  // stats, so this is all that inspecting one shows.
  string description = 5;
  // 6 was `effect`, what using one copy did. The only usable item was a debug
  // Level-Up item, which has been removed.
  reserved 6;
  // Meso one copy costs in the shop; 0 means the shop doesn't sell it. Setting
  // a price is all it takes to put a stackable in the shop, the same as for
  // equips.
  int32 shop_price = 7;
  // The symbol the shop draws next to prices paid in this item, e.g. "●". Empty
  // for ordinary items, which are never used as payment.
  string currency_mark = 8;
  CurrencyColor currency_color = 9;
  // See ItemKind.
  ItemKind kind = 10;
  // For a token, the level of the equipment it buys and the slot that equipment
  // goes in. The bag sorts its token shelf by these: best gear first, the
  // weapon before the rest of its set, and a token for a whole set (no slot)
  // first within its level.
  //
  // This differs from currency_mark, which shows the token's stage of the game;
  // one stage can cover two levels. Data files never set this. FillTokenShelves
  // works it out from what the catalog sells for the token.
  int32 currency_level = 12;
  EquipSlot currency_slot = 13;
  // A shorter name for lists whose column heading already says the rest, e.g.
  // "Zakum's" under a Soul Shard column. Empty means the full name is used,
  // which is true of everything but soul shards.
  string short_name = 11;
}

// One stack on the Etc tab. It stores the catalog key and a count, not the
// item: prototypes load from data/ and are looked up by name, so saves stay
// small and the data files decide what an item is. The prototype also decides
// which tab the stack goes on.
message StackableStack {
  string name = 1;
  int32 count = 2;
  reserved 3;  // the tab, which the prototype already names
}
