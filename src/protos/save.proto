syntax = "proto3";

package ms;

import "src/protos/character.proto";
import "src/protos/keybinds.proto";

// A player's saved game: everything a launch needs to put them back where they
// left off. Written as binary proto rather than text -- not as protection, but
// so the file is not an invitation to edit.
//
// Item and skill catalogs are NOT in here. They are loaded from data/, and the
// save refers to their entries by name, so what a Sword is stays the data
// files' business and a save stays a few kilobytes.
message SaveGame {
  // Bumped when a change to the fields below cannot be read by an older build,
  // so a save from the future is refused rather than misread. Every message
  // reachable from here has load-bearing field numbers now: renumbering one
  // silently misreads every save already written.
  int32 format_version = 1;

  Character character = 2;

  // The map being farmed, as a key into the map catalog. Empty means the
  // player was not fighting anywhere.
  string current_map = 3;

  // When this character was started, as seconds since the Unix epoch. Wall
  // clock rather than the monotonic one used for playtime: this is a date to
  // show, not a duration to measure. Zero means a save written before the
  // field existed, which loads as "created now".
  int64 created_unix_seconds = 4;

  // Total seconds with the game open, across every session. Whole seconds on
  // disk; the running total is kept as a double so that accumulating it a
  // fraction of a second at a time does not truncate away most of it.
  int64 playtime_seconds = 5;

  // What the player has bound their keys to. A save written before the field
  // existed loads as the default bindings.
  Keybinds keybinds = 6;
}
